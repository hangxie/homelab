---
# OS-level NVIDIA host stack: driver, container toolkit, containerd runtime,
# the gpu=true:NoSchedule node taint. NFD and the NVIDIA device plugin are
# delegated to GitOps (waves 530 and 540).

- name: Detect GPU worker nodes
  hosts: workers
  become: true
  gather_facts: false

  tasks:
    - name: Install PCI utilities
      apt:
        name: pciutils
        state: present
        update_cache: yes

    - name: Detect NVIDIA GPUs via PCI scan
      shell: lspci | grep -qi nvidia
      register: nvidia_gpu_detect
      changed_when: false
      failed_when: false

    - name: Group workers by GPU presence
      group_by:
        key: "{{ 'gpu_workers_detected' if nvidia_gpu_detect.rc == 0 else 'non_gpu_workers_detected' }}"

- name: Install NVIDIA host stack on GPU workers
  hosts: gpu_workers_detected
  become: true
  gather_facts: false
  vars:
    nvidia_cuda_distro: debian13
    nvidia_cuda_repo_url: "https://developer.download.nvidia.com/compute/cuda/repos/{{ nvidia_cuda_distro }}/x86_64"
    nvidia_cuda_keyring_path: /usr/share/keyrings/nvidia-cuda-archive-keyring.gpg
    # Pinned rather than floating, for the same reason chart versions are: the
    # CUDA repo keeps every past release, so a pin stays resolvable and driver
    # moves land in Git as a reviewable change instead of arriving with
    # whichever playbook run happens to come after an upstream release.
    # Bumping this reboots the GPU workers — the module cannot be swapped
    # under running CUDA processes.
    nvidia_driver_version: "610.57.04-1"

  tasks:
    - name: Install GPU host prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Enable contrib/non-free components in Debian Deb822 sources
      replace:
        path: /etc/apt/sources.list.d/debian.sources
        regexp: '^Components: main$'
        replace: 'Components: main contrib non-free non-free-firmware'

    - name: Add NVIDIA container toolkit GPG key
      shell: |
        curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit.gpg
      args:
        creates: /usr/share/keyrings/nvidia-container-toolkit.gpg

    - name: Add NVIDIA container toolkit repo
      shell: |
        curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list \
          | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit.gpg] https://#g' \
          > /etc/apt/sources.list.d/nvidia-container-toolkit.list
      args:
        creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list

    - name: Add NVIDIA CUDA apt GPG key
      shell: |
        curl -fsSL {{ nvidia_cuda_repo_url }}/8793F200.pub | gpg --dearmor -o {{ nvidia_cuda_keyring_path }}
      args:
        creates: "{{ nvidia_cuda_keyring_path }}"

    - name: Add NVIDIA CUDA apt repository
      copy:
        dest: /etc/apt/sources.list.d/nvidia-cuda.list
        mode: '0644'
        content: |
          deb [signed-by={{ nvidia_cuda_keyring_path }}] {{ nvidia_cuda_repo_url }} /

    - name: Install NVIDIA container toolkit
      apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: yes

    # Picks the meta-package that actually tracks the running kernel, by
    # matching its Depends against the running version. Selecting on install
    # state and dependency rather than the first alphabetical match matters:
    # dpkg-query lists removed (rc) and never-installed (un) packages too, and
    # linux-image-amd64 sorts ahead of linux-image-cloud-amd64 — so a plain
    # `head -1` can resolve to the generic flavour on a cloud-kernel host and
    # reinstate the original wrong-headers failure.
    - name: Resolve kernel headers meta-package tracking the running kernel
      shell: |
        set -o pipefail
        running=$(uname -r)
        for meta in $(dpkg-query -W -f='${db:Status-Abbrev}|${Package}\n' 'linux-image-*' 2>/dev/null \
                        | awk -F'|' '$1 ~ /^ii/ { print $2 }' \
                        | grep -E '^linux-image-[a-z0-9-]+$'); do
          if dpkg-query -W -f='${Depends}\n' "$meta" 2>/dev/null | grep -q "linux-image-${running}"; then
            echo "${meta/linux-image-/linux-headers-}"
            exit 0
          fi
        done
        exit 1
      args:
        executable: /bin/bash
      register: kernel_headers_meta
      changed_when: false
      # Reads state and changes nothing, so it has to run under --check too:
      # skipping it leaves the package list below with an empty name, and a
      # driver bump is exactly the change worth dry-running first.
      check_mode: false
      failed_when: kernel_headers_meta.rc != 0 or kernel_headers_meta.stdout == ""

    # Unconditional on purpose. This previously ran only when the nvidia module
    # was missing, which made the driver install-once: an already-working host
    # never moved off whatever version it was first built with, so pinning a
    # version here would have had no effect on it.
    #
    # Only the two packages that set the driver version are pinned; the rest of
    # the stack (libcuda1, libnvidia-ml1, firmware-nvidia-gsp, ...) is versioned
    # in their dependencies and follows automatically.
    #
    # The headers meta-package is tracked rather than the running kernel's
    # versioned headers: a versioned pin stops matching after a kernel upgrade,
    # so DKMS silently skips the rebuild and the nvidia module disappears on
    # the next reboot.
    - name: Install pinned NVIDIA driver stack
      apt:
        name:
          - "nvidia-driver-cuda={{ nvidia_driver_version }}"
          - "nvidia-kernel-open-dkms={{ nvidia_driver_version }}"
          - "{{ kernel_headers_meta.stdout }}"
          - dkms
          - nvtop
        state: present
        update_cache: yes
      register: nvidia_driver_packages

    # A driver change leaves the new userspace libraries beside the old loaded
    # module, which fails every CUDA call until the module is swapped.
    - name: Reboot GPU workers after driver install
      reboot:
      when: nvidia_driver_packages is changed

    # The checks below are deliberately ungated. Previously they ran only when
    # a package changed, so the one state that matters most — packages already
    # correct but no module built for the current kernel — passed silently.

    # unattended-upgrades installs kernels on its own schedule and nothing
    # reboots the host, so a kernel with no DKMS build can sit installed and
    # harmless for days and then take the GPU out at the next reboot. Checking
    # every installed kernel rather than just the running one catches that
    # while it is still cheap to fix.
    - name: Collect kernels with no NVIDIA module built
      shell: |
        set -o pipefail
        dkms_status=$(/usr/sbin/dkms status 2>/dev/null)
        missing=""
        for kver in $(dpkg-query -W -f='${db:Status-Abbrev}|${Package}\n' 'linux-image-*' 2>/dev/null \
                        | awk -F'|' '$1 ~ /^ii/ { print $2 }' \
                        | sed -n 's/^linux-image-\([0-9].*\)$/\1/p'); do
          case "$dkms_status" in
            *", ${kver},"*) ;;
            *) missing="${missing} ${kver}" ;;
          esac
        done
        echo "${missing# }"
      args:
        executable: /bin/bash
      register: dkms_missing_kernels
      changed_when: false
      check_mode: false

    # Capturing dkms status once and matching in the shell is not incidental:
    # piping it into `grep -q` makes grep exit on the first match, the SIGPIPE
    # fails the pipeline under pipefail, and the first kernel listed is then
    # always reported missing.
    - name: Assert every installed kernel has an NVIDIA module built
      assert:
        that:
          - dkms_missing_kernels.stdout == ""
        fail_msg: >-
          No NVIDIA DKMS module for kernel(s): {{ dkms_missing_kernels.stdout }}.
          Booting one of these leaves the host without a GPU. Install the
          matching linux-headers and run `dkms autoinstall`.

    - name: Verify NVIDIA kernel module loads
      command: modprobe nvidia
      changed_when: false

    # Catches the userspace/kernel-module version skew a partial driver upgrade
    # leaves behind, which modprobe alone does not see.
    - name: Verify the NVIDIA driver answers
      command: nvidia-smi -L
      register: nvidia_smi_check
      changed_when: false
      failed_when: nvidia_smi_check.rc != 0 or 'GPU 0' not in nvidia_smi_check.stdout

    - name: Dump effective containerd config before NVIDIA runtime configuration
      command: containerd config dump
      register: containerd_config_dump_before_nvidia
      changed_when: false

    - name: Detect whether NVIDIA runtime is already the containerd default
      set_fact:
        nvidia_containerd_runtime_configured: >-
          {{
            'default_runtime_name = "nvidia"' in containerd_config_dump_before_nvidia.stdout
            and (
              'nvidia-container-runtime' in containerd_config_dump_before_nvidia.stdout
              or 'runtimes.nvidia' in containerd_config_dump_before_nvidia.stdout
            )
          }}
      changed_when: false

    - name: Configure NVIDIA runtime for containerd
      command: nvidia-ctk runtime configure --runtime=containerd --set-as-default
      when: not (nvidia_containerd_runtime_configured | bool)
      notify: Restart containerd

    - name: Dump effective containerd config
      command: containerd config dump
      register: containerd_config_dump
      changed_when: false

    - name: Verify NVIDIA runtime is present in effective containerd config
      assert:
        that:
          - >
            'default_runtime_name = "nvidia"' in containerd_config_dump.stdout
            or 'nvidia-container-runtime' in containerd_config_dump.stdout
            or '.runtimes.nvidia' in containerd_config_dump.stdout
        fail_msg: NVIDIA runtime not found in effective containerd config

  handlers:
    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted

- name: Taint GPU nodes
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Apply gpu=true:NoSchedule taint to GPU nodes
      shell: |
        current_taints=$(kubectl get node {{ item }} -o jsonpath='{range .spec.taints[?(@.key=="gpu")]}{.key}={.value}:{.effect}{"\n"}{end}')
        if printf '%s\n' "$current_taints" | grep -qx 'gpu=true:NoSchedule'; then
          echo unchanged
        else
          kubectl taint nodes {{ item }} gpu=true:NoSchedule --overwrite
        fi
      loop: "{{ groups['gpu_workers_detected'] | default([]) }}"
      environment:
        KUBECONFIG: "{{ bootstrap_kubeconfig }}"
      register: gpu_taint_apply
      changed_when: "' tainted' in gpu_taint_apply.stdout or ' modified' in gpu_taint_apply.stdout"
      when: (groups['gpu_workers_detected'] | default([]) | length) > 0
