# Cilium values shared by phase-1 bootstrap (cilium.yml) and the
# phase-5 post-bootstrap upgrade (cilium-post-bootstrap.yml). Keys that
# must stay consistent across install and upgrade live here so there is
# one source of truth - datapath/IPAM/encryption/API endpoint settings
# would be disruptive to flip after the cluster is running.
kubeProxyReplacement: true
k8sServicePort: 6443
ipam:
  mode: kubernetes
# All nodes share one L2 segment, so pod traffic routes directly with no
# tunnel. ipv4NativeRoutingCIDR is set per playbook.
routingMode: native
autoDirectNodeRoutes: true
# Transparent encryption (WireGuard or IPsec) capped node-to-node throughput,
# and with it Ceph, at ~200-270 MB/s against ~1.2 GB/s without (#265). Ceph
# encrypts its own traffic with msgr2 secure mode (CephCluster spec).
encryption:
  enabled: false
gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true
l2announcements:
  enabled: true
tls:
  readSecretsOnlyFromSecretsNamespace: true
  secretsNamespace:
    name: cilium-secrets
  secretSync:
    enabled: true
k8sClientRateLimit:
  qps: 50
  burst: 100
prometheus:
  enabled: true
