---
# Quiesce the cluster before the Proxmox VMs are powered off.
#
# Pulling the VMs out from under a running cluster leaves every stateful
# workload in crash recovery on the next boot — for MySQL that means Group
# Replication has to be rebooted from a complete outage, which is what makes
# mysql-cluster-router come back bootstrapped against a cluster that is not
# ONLINE yet. This playbook gives the pods a real SIGTERM (and their preStop
# hooks, e.g. mysqladmin shutdown) in reverse deployment order first.
#
# It does NOT remove the router race on its own: stopping all three MySQL
# members is a complete outage either way, so the next boot still comes up
# through reboot-from-complete-outage. The router-side fix for that lives in
# gitops/workloads/raw/mysql/manifests/10-innodbcluster.yaml.
#
# Usage: ansible-playbook -i ansible/inventory.ini ansible/shutdown.yml
# Pass -e poweroff_nodes=false to quiesce only and leave the guests running.

- name: Stop workloads in reverse deployment order
  hosts: localhost
  gather_facts: false
  vars:
    # Applications the ApplicationSets generate carry no sync-wave annotation.
    # They are the last thing deployed, so they are the first thing stopped.
    unwaved_app_rank: 9999
    # kube-system holds the CNI, CoreDNS and the control-plane static pods.
    # Everything else needs those alive while it terminates, and the static
    # pods are not ours to delete.
    shutdown_excluded_namespaces:
      - kube-system
    # Ceph backs the PVCs every other namespace is unmounting, so its pods go
    # last regardless of where sync waves would otherwise place them.
    shutdown_last_namespaces:
      - rook-ceph
    pod_shutdown_timeout: 180s

  tasks:
    - name: Collect Argo CD Applications
      # Read these before anything is stopped: the argocd namespace is one of
      # the first to go, and with it the API-backing app controller.
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubectl_env.KUBECONFIG | default(omit) }}"
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: argocd
      register: argocd_apps

    - name: Rank each namespace by the highest sync wave that deploys into it
      set_fact:
        namespace_waves: >-
          {{ namespace_waves | default({}) | combine({
               item.spec.destination.namespace:
                 [(namespace_waves | default({})).get(item.spec.destination.namespace, 0),
                  (item.metadata.annotations | default({}, true))
                    .get('argocd.argoproj.io/sync-wave', unwaved_app_rank) | int] | max
             }) }}
      loop: "{{ argocd_apps.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Order namespaces highest sync wave first
      # reject/select rather than difference/intersect: the set-based filters
      # would throw away the ordering this whole play is built on.
      set_fact:
        shutdown_namespaces: >-
          {{ (ordered | reject('in', held_back) | list)
             + (ordered | select('in', shutdown_last_namespaces) | list) }}
      vars:
        ordered: >-
          {{ namespace_waves | default({}) | dict2items
             | sort(attribute='value', reverse=true) | map(attribute='key') | list }}
        held_back: "{{ shutdown_excluded_namespaces + shutdown_last_namespaces }}"

    - name: Report the shutdown order
      debug:
        var: shutdown_namespaces

    - name: Cordon every node
      # Deleting a pod only helps if its controller cannot immediately start a
      # replacement somewhere else. Undone below, before the nodes go down.
      command: kubectl cordon {{ item }}
      environment: "{{ kubectl_env }}"
      loop: "{{ groups['masters'] + groups['workers'] }}"
      changed_when: true

    - name: Stop pods namespace by namespace
      # delete, not drain: eviction respects PodDisruptionBudgets and a
      # single-replica database's PDB would block the whole shutdown.
      command: >-
        kubectl delete pod --all --namespace {{ item }}
        --timeout={{ pod_shutdown_timeout }}
      environment: "{{ kubectl_env }}"
      loop: "{{ shutdown_namespaces }}"
      changed_when: true
      # A namespace that overruns its grace period must not strand the rest.
      failed_when: false

- name: Stop the worker kubelets
  hosts: workers
  become: true
  gather_facts: false
  tasks:
    - name: Stop kubelet
      # The pods are already gone; this only keeps the scheduler from putting
      # them back once the nodes are uncordoned in the next play. Enabled is
      # left alone so the nodes rejoin by themselves on the next boot.
      systemd:
        name: kubelet
        state: stopped
      failed_when: false

- name: Uncordon every node while the API server is still up
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Uncordon every node
      # Otherwise the cluster comes back with every node unschedulable and
      # nothing to fix it.
      command: kubectl uncordon {{ item }}
      environment: "{{ kubectl_env }}"
      loop: "{{ groups['masters'] + groups['workers'] }}"
      changed_when: true

- name: Stop the control plane and power off
  hosts: masters,workers
  become: true
  gather_facts: false
  vars:
    poweroff_nodes: true
  tasks:
    - name: Stop kubelet
      systemd:
        name: kubelet
        state: stopped
      failed_when: false
      when: inventory_hostname in groups['masters']

    - name: Power off the node
      # systemd stops containerd and unmounts the filesystems on the way down,
      # so the VMs can be killed in Proxmox once this returns.
      command: shutdown --halt now
      async: 1
      poll: 0
      failed_when: false
      changed_when: true
      when: poweroff_nodes | bool
