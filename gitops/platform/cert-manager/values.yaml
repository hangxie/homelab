# cert-manager helm values. CRDs installed via the chart.
crds:
  enabled: true

replicaCount: 2

webhook:
  replicaCount: 2

cainjector:
  replicaCount: 2

prometheus:
  enabled: true
  servicemonitor:
    enabled: false

# gateway-shim: Gateways annotated with cert-manager.io/cluster-issuer get a
# Certificate per HTTPS listener, built from the listener hostname.
config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  enableGatewayAPI: true

extraArgs:
  # Bind the helper httpserver on every interface so the gateway can
  # liveness-probe webhooks from any node.
  - --dns01-recursive-nameservers-only
  - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
