alloy:
  clustering:
    enabled: true

  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1536Mi

  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      // ── Logs ─────────────────────────────────────────────────────────────────

      discovery.kubernetes "pods" {
        role = "pod"
      }

      // discovery.kubernetes emits only __meta_* labels, which are dropped before
      // write. Without this relabel every pod log lands in a single stream whose
      // only identity is instance="<ns>/<pod>:<container>", and service_name falls
      // back to the component name.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        // service_name drives Grafana's Logs app; prefer the app label, fall back
        // to the container name so it is never empty.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_container_name"]
          separator     = ";"
          regex         = "([^;]+);.*|;(.*)"
          target_label  = "service_name"
          replacement   = "${1}${2}"
        }
      }

      loki.source.kubernetes "pods" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.loki/loki/api/v1/push"
        }
      }

      // ── Traces ───────────────────────────────────────────────────────────────

      otelcol.receiver.otlp "default" {
        grpc {}
        http {}
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.tempo:4317"
          tls {
            insecure = true
          }
        }
      }

      // ── Metrics remote-write ──────────────────────────────────────────────────

      prometheus.remote_write "mimir" {
        external_labels = {
          cluster = "homelab",
        }
        endpoint {
          url = "http://mimir-gateway.mimir/api/v1/push"
        }
      }

      // ── Node metrics (Alloy runs as DaemonSet — one exporter per node) ────────

      prometheus.exporter.unix "local" {
        enable_collectors = ["cpu", "diskstats", "filesystem", "loadavg",
                             "meminfo", "netdev", "netstat", "stat", "time", "uname"]
      }

      // nodename from uname(2) is the pod hostname; override with the actual K8s node name.
      prometheus.relabel "node_hostname" {
        rule {
          target_label = "nodename"
          replacement  = sys.env("K8S_NODE_NAME")
        }
        rule {
          target_label = "instance"
          replacement  = sys.env("K8S_NODE_NAME")
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      prometheus.scrape "node_exporter" {
        targets         = prometheus.exporter.unix.local.targets
        job_name        = "integrations/node_exporter"
        scrape_interval = "60s"
        forward_to      = [prometheus.relabel.node_hostname.receiver]
      }

      // ── Alloy self-metrics ─────────────────────────────────────────────────────

      prometheus.exporter.self "alloy" {}

      prometheus.scrape "alloy_self" {
        targets    = prometheus.exporter.self.alloy.targets
        job_name   = "alloy"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── Kubelet / cAdvisor ────────────────────────────────────────────────────
      // Each Alloy DaemonSet pod scrapes only its own node through the API proxy.
      // env() works in replacement fields of relabeling rules but NOT in the
      // regex field of a keep rule and NOT in static target dict __metrics_path__.
      // Use discovery.relabel to set __metrics_path__ via replacement.

      discovery.relabel "kubelet" {
        targets = [{"__address__" = "kubernetes.default.svc:443"}]
        rule {
          target_label = "__metrics_path__"
          replacement  = "/api/v1/nodes/" + sys.env("K8S_NODE_NAME") + "/proxy/metrics"
        }
        rule {
          target_label = "node"
          replacement  = sys.env("K8S_NODE_NAME")
        }
        rule {
          target_label = "service"
          replacement  = "kubelet"
        }
      }

      prometheus.scrape "kubelet" {
        targets          = discovery.relabel.kubelet.output
        job_name         = "kubelet"
        scheme           = "https"
        honor_timestamps = false
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      discovery.relabel "cadvisor" {
        targets = [{"__address__" = "kubernetes.default.svc:443"}]
        rule {
          target_label = "__metrics_path__"
          replacement  = "/api/v1/nodes/" + sys.env("K8S_NODE_NAME") + "/proxy/metrics/cadvisor"
        }
        rule {
          target_label = "node"
          replacement  = sys.env("K8S_NODE_NAME")
        }
        rule {
          target_label = "service"
          replacement  = "kubelet"
        }
      }

      prometheus.scrape "cadvisor" {
        targets          = discovery.relabel.cadvisor.output
        job_name         = "kubernetes-cadvisor"
        scheme           = "https"
        honor_timestamps = false
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── kube-state-metrics ────────────────────────────────────────────────────

      discovery.kubernetes "ksm" {
        role = "endpoints"
        namespaces {
          names = ["kube-system"]
        }
        selectors {
          role  = "endpoints"
          label = "app.kubernetes.io/name=kube-state-metrics"
        }
      }

      prometheus.scrape "ksm" {
        clustering {
          enabled = true
        }
        targets    = discovery.kubernetes.ksm.targets
        job_name   = "kube-state-metrics"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── Cilium agent, operator, Hubble ────────────────────────────────────────

      discovery.kubernetes "cilium_agent" {
        role = "pod"
        namespaces {
          names = ["kube-system"]
        }
        selectors {
          role  = "pod"
          label = "k8s-app=cilium"
        }
      }

      discovery.relabel "cilium_agent" {
        targets = discovery.kubernetes.cilium_agent.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_host_ip"]
          target_label  = "__address__"
          replacement   = "${1}:9962"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
        rule {
          target_label = "k8s_app"
          replacement  = "cilium"
        }
      }

      prometheus.scrape "cilium_agent" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.cilium_agent.output
        job_name   = "cilium-agent"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      discovery.kubernetes "cilium_operator" {
        role = "pod"
        namespaces {
          names = ["kube-system"]
        }
        selectors {
          role  = "pod"
          label = "io.cilium/app=operator"
        }
      }

      discovery.relabel "cilium_operator" {
        targets = discovery.kubernetes.cilium_operator.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_name"]
          regex         = "prometheus"
          action        = "keep"
        }
        rule {
          target_label = "io_cilium_app"
          replacement  = "operator"
        }
      }

      prometheus.scrape "cilium_operator" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.cilium_operator.output
        job_name   = "cilium-operator"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      discovery.kubernetes "hubble" {
        role = "endpoints"
        namespaces {
          names = ["kube-system"]
        }
        selectors {
          role  = "endpoints"
          label = "k8s-app=hubble"
        }
      }

      discovery.relabel "hubble" {
        targets = discovery.kubernetes.hubble.targets
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "hubble-metrics"
          action        = "keep"
        }
      }

      prometheus.scrape "hubble" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.hubble.output
        job_name   = "hubble"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── cert-manager ──────────────────────────────────────────────────────────

      discovery.kubernetes "cert_manager" {
        role = "endpoints"
        namespaces {
          names = ["cert-manager"]
        }
        selectors {
          role  = "endpoints"
          label = "app.kubernetes.io/name=cert-manager"
        }
      }

      discovery.relabel "cert_manager" {
        targets = discovery.kubernetes.cert_manager.targets
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "tcp-prometheus-servicemonitor"
          action        = "keep"
        }
      }

      prometheus.scrape "cert_manager" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.cert_manager.output
        job_name   = "cert-manager"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── external-secrets ──────────────────────────────────────────────────────

      discovery.kubernetes "external_secrets" {
        role = "pod"
        namespaces {
          names = ["external-secrets"]
        }
        selectors {
          role  = "pod"
          label = "app.kubernetes.io/name=external-secrets"
        }
      }

      discovery.relabel "external_secrets" {
        targets = discovery.kubernetes.external_secrets.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_name"]
          regex         = "metrics"
          action        = "keep"
        }
      }

      prometheus.scrape "external_secrets" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.external_secrets.output
        job_name   = "external-secrets"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── metrics-server ────────────────────────────────────────────────────────

      discovery.kubernetes "metrics_server" {
        role = "endpoints"
        namespaces {
          names = ["kube-system"]
        }
        selectors {
          role  = "endpoints"
          label = "app.kubernetes.io/name=metrics-server"
        }
      }

      discovery.relabel "metrics_server" {
        targets = discovery.kubernetes.metrics_server.targets
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "https"
          action        = "keep"
        }
      }

      prometheus.scrape "metrics_server" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.metrics_server.output
        job_name   = "metrics-server"
        scheme     = "https"
        tls_config {
          insecure_skip_verify = true
        }
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── Loki ──────────────────────────────────────────────────────────────────

      discovery.kubernetes "loki" {
        role = "pod"
        namespaces {
          names = ["loki"]
        }
        selectors {
          role  = "pod"
          label = "app.kubernetes.io/name=loki"
        }
      }

      discovery.relabel "loki" {
        targets = discovery.kubernetes.loki.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_name"]
          regex         = "http-metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          target_label  = "component"
        }
      }

      prometheus.scrape "loki" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.loki.output
        job_name   = "loki"
        forward_to = [prometheus.relabel.loki.receiver]
      }

      prometheus.relabel "loki" {
        rule {
          source_labels = ["namespace", "component"]
          separator     = "/"
          regex         = "(.+)/(read|write|backend)"
          target_label  = "job"
          replacement   = "$1/loki-$2"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── Tempo ─────────────────────────────────────────────────────────────────

      discovery.kubernetes "tempo" {
        role = "endpoints"
        namespaces {
          names = ["tempo"]
        }
        selectors {
          role  = "endpoints"
          label = "app.kubernetes.io/name=tempo"
        }
      }

      discovery.relabel "tempo" {
        targets = discovery.kubernetes.tempo.targets
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "tempo-prom-metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "tempo" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.tempo.output
        job_name   = "tempo"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── CloudNativePG operator ─────────────────────────────────────────────────

      discovery.kubernetes "cnpg_operator" {
        role = "pod"
        namespaces {
          names = ["cnpg-system"]
        }
        selectors {
          role  = "pod"
          label = "app.kubernetes.io/name=cloudnative-pg"
        }
      }

      discovery.relabel "cnpg_operator" {
        targets = discovery.kubernetes.cnpg_operator.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_name"]
          regex         = "metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "cnpg_operator" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.cnpg_operator.output
        job_name   = "cnpg-operator"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── CNPG postgres-cluster pods ────────────────────────────────────────────

      discovery.kubernetes "cnpg_cluster" {
        role = "pod"
        namespaces {
          names = ["postgres-cluster"]
        }
        selectors {
          role  = "pod"
          label = "cnpg.io/cluster=postgres-cluster"
        }
      }

      discovery.relabel "cnpg_cluster" {
        targets = discovery.kubernetes.cnpg_cluster.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_name"]
          regex         = "metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
      }

      prometheus.scrape "cnpg_cluster" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.cnpg_cluster.output
        job_name   = "postgres-cluster"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── Rook-Ceph manager ─────────────────────────────────────────────────────

      discovery.kubernetes "rook_ceph_mgr" {
        role = "endpoints"
        namespaces {
          names = ["rook-ceph"]
        }
        selectors {
          role  = "endpoints"
          label = "app=rook-ceph-mgr"
        }
      }

      discovery.relabel "rook_ceph_mgr" {
        targets = discovery.kubernetes.rook_ceph_mgr.targets
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "http-metrics"
          action        = "keep"
        }
      }

      prometheus.scrape "rook_ceph_mgr" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.rook_ceph_mgr.output
        job_name   = "rook-ceph"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── Ray ───────────────────────────────────────────────────────────────────

      discovery.kubernetes "ray_head" {
        role = "pod"
        namespaces {
          names = ["ray"]
        }
        selectors {
          role  = "pod"
          label = "ray.io/node-type=head"
        }
      }

      discovery.relabel "ray_head" {
        targets = discovery.kubernetes.ray_head.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_name"]
          regex         = "metrics"
          action        = "keep"
        }
      }

      prometheus.scrape "ray_head" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.ray_head.output
        job_name   = "ray-head"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      discovery.kubernetes "ray_workers" {
        role = "pod"
        namespaces {
          names = ["ray"]
        }
        selectors {
          role  = "pod"
          label = "ray.io/node-type=worker"
        }
      }

      discovery.relabel "ray_workers" {
        targets = discovery.kubernetes.ray_workers.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_name"]
          regex         = "metrics"
          action        = "keep"
        }
      }

      prometheus.scrape "ray_workers" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.ray_workers.output
        job_name   = "ray-workers"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── Airflow ───────────────────────────────────────────────────────────────

      // The Helm release is named by the workloads-helm ApplicationSet, which
      // prefixes every workload with wl- — so the chart's `release` label is
      // wl-airflow, not airflow.
      discovery.kubernetes "airflow" {
        role = "endpoints"
        namespaces {
          names = ["airflow"]
        }
        selectors {
          role  = "endpoints"
          label = "release=wl-airflow,component=statsd"
        }
      }

      // The statsd Service publishes both the UDP ingest port and the scrape
      // port. Keep on the port *name* — kubernetes SD emits no
      // __meta_kubernetes_endpoint_port_number label, so filtering on the
      // number silently discarded every target.
      discovery.relabel "airflow" {
        targets = discovery.kubernetes.airflow.targets
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "statsd-scrape"
          action        = "keep"
        }
      }

      prometheus.scrape "airflow" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.airflow.output
        job_name   = "airflow"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── ClickHouse ────────────────────────────────────────────────────────────

      discovery.kubernetes "clickhouse" {
        role = "endpoints"
        namespaces {
          names = ["clickhouse"]
        }
        selectors {
          role  = "endpoints"
          label = "app.kubernetes.io/name=clickhouse,app.kubernetes.io/component=clickhouse"
        }
      }

      discovery.relabel "clickhouse" {
        targets = discovery.kubernetes.clickhouse.targets
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "prometheus"
          action        = "keep"
        }
      }

      prometheus.scrape "clickhouse" {
        clustering {
          enabled = true
        }
        targets      = discovery.relabel.clickhouse.output
        job_name     = "clickhouse"
        metrics_path = "/metrics"
        forward_to   = [prometheus.remote_write.mimir.receiver]
      }

      // ── Spark operator ────────────────────────────────────────────────────────

      // role = "pod", not "endpoints": the operator exposes a `metrics`
      // containerPort but the chart creates no Service in front of it, so there
      // are no Endpoints to discover. The history server is not a metrics
      // source — /metrics/prometheus there serves the web UI HTML.
      discovery.kubernetes "spark" {
        role = "pod"
        namespaces {
          names = ["spark"]
        }
        selectors {
          role  = "pod"
          label = "app.kubernetes.io/name=spark-operator"
        }
      }

      discovery.relabel "spark" {
        targets = discovery.kubernetes.spark.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_name"]
          regex         = "metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          target_label  = "component"
        }
      }

      prometheus.scrape "spark" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.spark.output
        job_name   = "spark"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── Flink operator ────────────────────────────────────────────────────────

      // Same shape as the Spark operator above: the chart's only Service is
      // the webhook, so there are no Endpoints in front of the metrics port
      // and discovery has to go through the pod. Job clusters are not covered
      // here — a FlinkDeployment exposes metrics only if it sets its own
      // metrics.reporter.prom.* in flinkConfiguration.
      discovery.kubernetes "flink_operator" {
        role = "pod"
        namespaces {
          names = ["flink-operator"]
        }
        selectors {
          role  = "pod"
          label = "app.kubernetes.io/name=flink-kubernetes-operator"
        }
      }

      discovery.relabel "flink_operator" {
        targets = discovery.kubernetes.flink_operator.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_name"]
          regex         = "metrics"
          action        = "keep"
        }
      }

      prometheus.scrape "flink_operator" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.flink_operator.output
        job_name   = "flink-operator"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── ScyllaDB ──────────────────────────────────────────────────────────────

      discovery.kubernetes "scylladb" {
        role = "endpoints"
        namespaces {
          names = ["scylladb"]
        }
        selectors {
          role  = "endpoints"
          label = "app.kubernetes.io/name=scylla"
        }
      }

      discovery.relabel "scylladb" {
        targets = discovery.kubernetes.scylladb.targets
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "prometheus"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_scylla_cluster"]
          target_label  = "cluster"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_scylla_datacenter"]
          target_label  = "dc"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_scylla_rack"]
          target_label  = "rack"
        }
      }

      prometheus.scrape "scylladb" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.scylladb.output
        job_name   = "scylladb"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── NFD (node-feature-discovery) ──────────────────────────────────────────

      discovery.kubernetes "nfd" {
        role = "endpoints"
        namespaces {
          names = ["nfd"]
        }
        selectors {
          role  = "endpoints"
          label = "app.kubernetes.io/name=node-feature-discovery"
        }
      }

      discovery.relabel "nfd" {
        targets = discovery.kubernetes.nfd.targets
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "metrics"
          action        = "keep"
        }
      }

      prometheus.scrape "nfd" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.nfd.output
        job_name   = "nfd"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── Kubernetes API server ─────────────────────────────────────────────────

      prometheus.scrape "apiserver" {
        clustering {
          enabled = true
        }
        targets      = [{"__address__" = "kubernetes.default.svc:443"}]
        job_name     = "apiserver"
        scheme       = "https"
        metrics_path = "/metrics"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── CoreDNS ───────────────────────────────────────────────────────────────

      discovery.kubernetes "coredns" {
        role = "pod"
        namespaces {
          names = ["kube-system"]
        }
        selectors {
          role  = "pod"
          label = "k8s-app=kube-dns"
        }
      }

      discovery.relabel "coredns" {
        targets = discovery.kubernetes.coredns.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          replacement   = "$1:9153"
          target_label  = "__address__"
        }
      }

      prometheus.scrape "coredns" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.coredns.output
        job_name   = "coredns"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── ArgoCD ────────────────────────────────────────────────────────────────

      discovery.kubernetes "argocd" {
        role = "pod"
        namespaces {
          names = ["argocd"]
        }
        selectors {
          role  = "pod"
          label = "app.kubernetes.io/part-of=argocd"
        }
      }

      discovery.relabel "argocd" {
        targets = discovery.kubernetes.argocd.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_name"]
          regex         = ".*metrics"
          action        = "keep"
        }
        // dex declares a metrics port but no SSO connector is configured, so it
        // logs "dex is not configured" and never opens a listener. Scraping it
        // only produces a permanently failing target.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "argocd-dex-server"
          action        = "drop"
        }
      }

      prometheus.scrape "argocd" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.argocd.output
        job_name   = "argocd"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── Mimir (self-monitoring) ───────────────────────────────────────────────

      discovery.kubernetes "mimir_self" {
        role = "pod"
        namespaces {
          names = ["mimir"]
        }
        selectors {
          role  = "pod"
          label = "app.kubernetes.io/name=mimir"
        }
      }

      discovery.relabel "mimir_self" {
        targets = discovery.kubernetes.mimir_self.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_number"]
          regex         = "8080"
          action        = "keep"
        }
        // The gateway is nginx, not a Mimir component: it names its port
        // http-metrics and listens on 8080 like the rest, but 8080 is the proxy
        // itself and /metrics there is a 404.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          regex         = "gateway"
          action        = "drop"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          separator     = "/"
          target_label  = "job"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          target_label  = "component"
        }
      }

      prometheus.scrape "mimir_self" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.mimir_self.output
        job_name   = "mimir"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── mysqld-exporter ───────────────────────────────────────────────────────

      discovery.kubernetes "mysqld_exporter" {
        role = "endpoints"
        namespaces {
          names = ["mysqld-exporter"]
        }
        selectors {
          role  = "endpoints"
          label = "app.kubernetes.io/name=prometheus-mysql-exporter"
        }
      }

      discovery.relabel "mysqld_exporter" {
        targets = discovery.kubernetes.mysqld_exporter.targets
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "mysql-exporter"
          action        = "keep"
        }
      }

      prometheus.scrape "mysql" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.mysqld_exporter.output
        job_name   = "mysql"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── HDFS namenode ─────────────────────────────────────────────────────────

      discovery.kubernetes "hdfs" {
        role = "endpoints"
        namespaces {
          names = ["hdfs"]
        }
        selectors {
          role  = "endpoints"
          label = "app.kubernetes.io/name=namenode"
        }
      }

      discovery.relabel "hdfs" {
        targets = discovery.kubernetes.hdfs.targets
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "jmx"
          action        = "keep"
        }
      }

      prometheus.scrape "hdfs" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.hdfs.output
        job_name   = "hdfs"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── Trino ─────────────────────────────────────────────────────────────────

      discovery.kubernetes "trino_jmx" {
        role = "endpoints"
        namespaces {
          names = ["trino"]
        }
        selectors {
          role  = "endpoints"
          label = "app.kubernetes.io/name=trino"
        }
      }

      discovery.relabel "trino_jmx" {
        targets = discovery.kubernetes.trino_jmx.targets
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "jmx"
          action        = "keep"
        }
      }

      prometheus.scrape "trino" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.trino_jmx.output
        job_name   = "jmx"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── Redis ─────────────────────────────────────────────────────────────────

      // The redis operator already runs a redis-exporter sidecar in every pod
      // and fronts it with a dedicated -metrics Service. Selecting on
      // component=metrics picks up both the replication and the sentinel set
      // while skipping the primary Services, which also publish 9121.
      discovery.kubernetes "redis" {
        role = "endpoints"
        namespaces {
          names = ["redis"]
        }
        selectors {
          role  = "endpoints"
          label = "app.kubernetes.io/component=metrics"
        }
      }

      discovery.relabel "redis" {
        targets = discovery.kubernetes.redis.targets
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "redis-exporter"
          action        = "keep"
        }
        // app is redis-replication or redis-sentinel-sentinel; without it the
        // two sets are only distinguishable by pod IP.
        rule {
          source_labels = ["__meta_kubernetes_service_label_app"]
          target_label  = "redis_set"
        }
      }

      prometheus.scrape "redis" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.redis.output
        job_name   = "redis"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── Hive metastore ────────────────────────────────────────────────────────

      // The metastore runs the JMX exporter as a javaagent on 9084, published
      // by the headless hive-metastore-metrics Service labelled
      // prometheus.io/scrape=true.
      discovery.kubernetes "hive" {
        role = "endpoints"
        namespaces {
          names = ["hive"]
        }
        selectors {
          role  = "endpoints"
          label = "prometheus.io/scrape=true"
        }
      }

      discovery.relabel "hive" {
        targets = discovery.kubernetes.hive.targets
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "metrics"
          action        = "keep"
        }
      }

      prometheus.scrape "hive" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.hive.output
        job_name   = "hive"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── llama.cpp ─────────────────────────────────────────────────────────────

      // The per-model Services have no labels of their own, so discover the
      // pods directly. llama-server only answers /metrics when started with
      // --metrics (see gitops/helm-charts/llama-cpp-model).
      discovery.kubernetes "llama_cpp" {
        role = "pod"
        namespaces {
          names = ["llama-cpp"]
        }
        selectors {
          role  = "pod"
          label = "llama-cpp.model=true"
        }
      }

      // role = "pod" emits one target per declared containerPort plus a
      // portless one for every container without ports — including the init
      // containers — so keep only the named serving port.
      discovery.relabel "llama_cpp" {
        targets = discovery.kubernetes.llama_cpp.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_name"]
          regex         = "http"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "model"
        }
      }

      prometheus.scrape "llama_cpp" {
        clustering {
          enabled = true
        }
        targets    = discovery.relabel.llama_cpp.output
        job_name   = "llama-cpp"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ── External hosts ────────────────────────────────────────────────────────
      // node_exporter runs on the hosts themselves (pi 192.168.0.200, media
      // 192.168.0.201), plus the macOS AI host, and Alloy pulls them over the LAN.
      // Cilium tunnel mode masquerades pod egress, so scrapes arrive from the node
      // IP — 192.168.0.210-225 is what the hosts have to allow, not a pod CIDR.
      //
      // clustering is what keeps this to one scrape per host: without it all
      // nine DaemonSet pods would pull all three exporters and every series would
      // land nine times over.
      //
      // job is deliberately not "integrations/unix". The node.yaml rules match
      // on that job and assume a cluster node — the media server's 5TB media
      // library sits permanently near full and the Pi idles hot — so external
      // hosts get their own thresholds in the ruler's external.yaml.
      prometheus.scrape "external_nodes" {
        clustering {
          enabled = true
        }
        targets = [
          {"__address__" = "pi.xiehang.com:9100", "instance" = "pi"},
          {"__address__" = "media.xiehang.com:9100", "instance" = "media"},
          {"__address__" = "ai.xiehang.com:9100", "instance" = "ai"},
        ]
        job_name        = "external/node"
        scrape_interval = "60s"
        forward_to      = [prometheus.remote_write.mimir.receiver]
      }

      // ── External llama.cpp router ─────────────────────────────────────────────
      // Media runs llama.cpp in router mode. Refresh the loaded model set rather
      // than scraping idle models. The router otherwise auto-loads a model on
      // GET /metrics; autoload=false also protects the race where a model
      // unloads between discovery and scraping. AI's mlx-lm has no /metrics.
      remote.http "media_models" {
        url            = "http://media.xiehang.com:8080/v1/models"
        poll_frequency = "60s"
        poll_timeout   = "10s"
      }

      discovery.relabel "media_llama" {
        targets = [
          {
            "__address__" = "media.xiehang.com:8080",
            "instance" = "media",
            "model" = "deepseek-r1-1.5b-q8",
            "__param_model" = "deepseek-r1-1.5b-q8",
            "__param_autoload" = "false",
            "__tmp_state" = string.join(json_path(remote.http.media_models.content, "$.data[?(@.id == 'deepseek-r1-1.5b-q8')].status.value"), ""),
          },
          {
            "__address__" = "media.xiehang.com:8080",
            "instance" = "media",
            "model" = "qwen3-1.7b-q8",
            "__param_model" = "qwen3-1.7b-q8",
            "__param_autoload" = "false",
            "__tmp_state" = string.join(json_path(remote.http.media_models.content, "$.data[?(@.id == 'qwen3-1.7b-q8')].status.value"), ""),
          },
        ]
        rule {
          source_labels = ["__tmp_state"]
          regex         = "loaded"
          action        = "keep"
        }
      }

      prometheus.scrape "media_llama" {
        clustering {
          enabled = true
        }
        targets         = discovery.relabel.media_llama.output
        job_name        = "external/llama-cpp"
        scrape_interval = "60s"
        metrics_path    = "/metrics"
        forward_to      = [prometheus.remote_write.mimir.receiver]
      }

      // ── Service probes ────────────────────────────────────────────────────────
      // Blackbox lives inside Alloy rather than as its own Deployment: the
      // exporter is a component, so there is no extra chart, namespace or
      // Service to keep alive. Same clustering rule as above — one Alloy pod
      // owns each probe.
      //
      // `scope` splits the alerting. internal targets are ours and page on
      // their own; upstream targets are only meaningful when the anchors are
      // still answering, otherwise a single ISP blip reports six outages
      // (see external.yaml).
      //
      // The YAML below is indented to read inside this file; a block mapping
      // takes its indentation from its first key, so it parses the same as if
      // it started at column 0.
      prometheus.exporter.blackbox "services" {
        config = `
          modules:
            # No redirect-following: every internal target is a health endpoint
            # that answers 200 directly, so a 302 means something is wrong.
            http_2xx:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
                ip_protocol_fallback: false
                follow_redirects: false
            # Validate OpenAI-compatible server responses (llama.cpp, mlx-lm) as
            # well as their HTTP status.
            inference_health:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
                ip_protocol_fallback: false
                follow_redirects: false
                valid_status_codes: [200]
                fail_if_body_not_matches_regexp:
                  - '"status"\s*:\s*"ok"'
            inference_models:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
                ip_protocol_fallback: false
                follow_redirects: false
                valid_status_codes: [200]
                fail_if_body_not_matches_regexp:
                  - '"object"\s*:\s*"list"'
                  - '"id"\s*:\s*"[^" ]+"'
            # Check the SSH banner, not just an open TCP socket.
            ssh:
              prober: tcp
              timeout: 10s
              tcp:
                preferred_ip_protocol: ip4
                ip_protocol_fallback: false
                query_response:
                  - expect: '^SSH-2\.0-'
            # Registry /v2/ roots answer 401 with a WWW-Authenticate challenge
            # when they are healthy. A 200 here would mean auth is broken.
            http_401:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
                ip_protocol_fallback: false
                follow_redirects: false
                valid_status_codes: [401]
            # Follows redirects — public front pages bounce through them.
            http_2xx_redirect:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
                ip_protocol_fallback: false
                follow_redirects: true
        `

        // Internal. media.xiehang.com carries both Vault and Harbor, which makes
        // it the one external host the cluster cannot run without: ESO stops
        // refreshing and every image pull fails with it.
        target {
          name    = "vault"
          address = "https://media.xiehang.com:8200/v1/sys/health"
          module  = "http_2xx"
          labels  = {scope = "internal"}
        }
        target {
          name    = "harbor"
          address = "https://media.xiehang.com/api/v2.0/health"
          module  = "http_2xx"
          labels  = {scope = "internal"}
        }
        // Through the gateway on purpose: this is the only probe that covers
        // public DNS, the LB address, TLS termination and the backend in one
        // request, and it is also where probe_ssl_earliest_cert_expiry comes
        // from for the wildcard certificate.
        target {
          name    = "grafana"
          address = "https://grafana.homelab.xiehang.com/api/health"
          module  = "http_2xx"
          labels  = {scope = "internal"}
        }
        target {
          name    = "argocd"
          address = "https://argocd.homelab.xiehang.com/healthz"
          module  = "http_2xx"
          labels  = {scope = "internal"}
        }

        // Media serves llama.cpp in router mode; AI serves mlx-lm. These reads
        // check availability without submitting inference requests or loading
        // an idle model.
        target {
          name    = "media-llama-health"
          address = "http://media.xiehang.com:8080/health"
          module  = "inference_health"
          labels  = {scope = "internal"}
        }
        target {
          name    = "media-llama-models"
          address = "http://media.xiehang.com:8080/v1/models"
          module  = "inference_models"
          labels  = {scope = "internal"}
        }
        target {
          name    = "ai-mlx-health"
          address = "http://ai.xiehang.com:8080/health"
          module  = "inference_health"
          labels  = {scope = "internal"}
        }
        target {
          name    = "ai-mlx-models"
          address = "http://ai.xiehang.com:8080/v1/models"
          module  = "inference_models"
          labels  = {scope = "internal"}
        }
        target {
          name    = "pi-ssh"
          address = "pi.xiehang.com:22"
          module  = "ssh"
          labels  = {scope = "internal"}
        }
        target {
          name    = "media-ssh"
          address = "media.xiehang.com:22"
          module  = "ssh"
          labels  = {scope = "internal"}
        }
        target {
          name    = "ai-ssh"
          address = "ai.xiehang.com:22"
          module  = "ssh"
          labels  = {scope = "internal"}
        }

        // Upstreams we actually pull from during a rebuild.
        target {
          name    = "dockerhub"
          address = "https://registry-1.docker.io/v2/"
          module  = "http_401"
          labels  = {scope = "upstream"}
        }
        target {
          name    = "ghcr"
          address = "https://ghcr.io/v2/"
          module  = "http_401"
          labels  = {scope = "upstream"}
        }
        target {
          name    = "github"
          address = "https://api.github.com"
          module  = "http_2xx"
          labels  = {scope = "upstream"}
        }
        target {
          name    = "huggingface"
          address = "https://huggingface.co"
          module  = "http_2xx_redirect"
          labels  = {scope = "upstream"}
        }
        target {
          name    = "pypi"
          address = "https://pypi.org/simple/"
          module  = "http_2xx"
          labels  = {scope = "upstream"}
        }

        // Two independent networks that are up whenever our uplink is. They
        // are the control that tells "GitHub is down" apart from "we are".
        target {
          name    = "anchor-cloudflare"
          address = "https://www.cloudflare.com"
          module  = "http_2xx"
          labels  = {scope = "anchor"}
        }
        target {
          name    = "anchor-google"
          address = "https://www.google.com"
          module  = "http_2xx"
          labels  = {scope = "anchor"}
        }
      }

      // The exporter puts each probe's name in the job label
      // ("integrations/blackbox/vault") and leaves instance set to the
      // component ID — the same string for all targets. job_name on a
      // scrape does not override a job the target already carries, so without
      // this the probes collapse into one series per scope. Move the name into
      // instance and flatten job, so a probe reads
      // probe_success{job="blackbox", instance="vault"}.
      discovery.relabel "blackbox" {
        targets = prometheus.exporter.blackbox.services.targets
        rule {
          source_labels = ["job"]
          regex         = "integrations/blackbox/(.+)"
          target_label  = "instance"
          replacement   = "$1"
        }
        // __param_target is dropped after relabeling; keep the URL so an alert
        // can name what it failed to reach.
        rule {
          source_labels = ["__param_target"]
          target_label  = "target"
        }
        rule {
          target_label = "job"
          replacement  = "blackbox"
        }
      }

      // scrape_timeout has to clear the 10s module timeout plus blackbox's
      // 0.5s probe_timeout_offset, or every probe reports a timeout of its own
      // before the prober has finished.
      prometheus.scrape "blackbox" {
        clustering {
          enabled = true
        }
        targets         = discovery.relabel.blackbox.output
        job_name        = "blackbox"
        scrape_interval = "60s"
        scrape_timeout  = "15s"
        forward_to      = [prometheus.remote_write.mimir.receiver]
      }


controller:
  type: daemonset
  # Alloy needs cluster-wide read access for kubernetes discovery and
  # kubelet/cadvisor proxied metrics.
  # Tolerate every taint so the node-exporter (prometheus.exporter.unix runs
  # per-pod) covers all nodes — masters (control-plane) and GPU workers (gpu)
  # are tainted, otherwise Node Exporter Full only shows the untainted workers.
  tolerations:
    - operator: Exists
  podAnnotations:
    prometheus.io/scrape: "false"

rbac:
  create: true

# No serviceMonitor — Alloy scrapes itself via prometheus.exporter.self above.
