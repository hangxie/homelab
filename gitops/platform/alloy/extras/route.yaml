apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alloy
  namespace: alloy
spec:
  parentRefs:
    - name: default-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - "alloy.homelab.xiehang.com"
  rules:
    # Shared login (gitops/platform/oauth2-proxy): every request is checked first.
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: oauth2-proxy
              namespace: oauth2-proxy
              port: 4180
            http:
              allowedHeaders: [cookie, x-forwarded-proto, x-forwarded-host]
              # Unset means every auth-reply header (Content-Type too) overwrites the request.
              allowedResponseHeaders: [x-auth-request-email]
      backendRefs:
        - name: alloy
          port: 12345
