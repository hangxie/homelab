apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    # Rook 1.20 dropped Reef (v18.x) — Squid (v19.x) is the floor.
    image: quay.io/ceph/ceph:v19.2.4
  cephConfig:
    mon:
      mon_data_avail_warn: "15"
      mon_data_avail_crit: "5"
    mgr:
      # Default excludes per-OSD/pool perf counters (numpg, stat_bytes,
      # op_r/w_latency, op_r/w throughput), which several rook-ceph Grafana
      # dashboard panels (OSD PGs/Storage/latency, Cluster read/write/op) need.
      mgr/prometheus/exclude_perf_counters: "false"
    osd:
      # BLUESTORE_SLOW_OP_ALERT defaults to threshold 1 over a 24h window, so a
      # single slow op pins the cluster to HEALTH_WARN for a whole day. A
      # handful of slow commits per day is the normal floor here — measured
      # baseline is ~1.5/day/OSD against ~500k KV commits/day (0.0003%). 20/day
      # keeps the alert ~13x above that floor, so it still fires on real
      # degradation instead of on the baseline.
      # Note the window is trailing: the warning persists for the full lifetime
      # after the last slow op, so it clears on its own well after a fix lands.
      bluestore_slow_ops_warn_threshold: "20"
      bluestore_slow_ops_warn_lifetime: "86400"
      # Nothing above ever returned freed blocks to the backing device — QEMU
      # had discard=ignore — so its FTL treated every LBA ever written as live
      # and fell into garbage collection under sustained fsync load. With
      # discard passthrough now in place (terraform, and the thin pool already
      # passes down), BlueStore returns freed extents to the device.
      bdev_enable_discard: "true"
      # Must be non-zero. At 0 the discards are issued inline on the I/O path,
      # which would reintroduce the very stalls this is meant to remove.
      bdev_async_discard_threads: "1"
  # Without a cgroup limit, Ceph derives osd_memory_target from nearly all
  # node memory. A 5 GiB limit yields the intended 4 GiB BlueStore target and
  # leaves headroom for allocator overhead while requests reserve that memory.
  resources:
    osd:
      requests:
        cpu: 500m
        memory: 5Gi
      limits:
        memory: 5Gi
  dataDirHostPath: /var/lib/rook
  mon:
    count: 3
    allowMultiplePerNode: false
  mgr:
    count: 2
    modules:
      - name: rook
        enabled: true
  dashboard:
    enabled: true
    port: 7000
    ssl: false
  monitoring:
    enabled: false
  network:
    connections:
      encryption:
        enabled: false
      compression:
        enabled: false
  crashCollector:
    disable: false
  logCollector:
    enabled: true
    periodicity: daily
  # Loosen the daemon liveness probes: the 5s default is too tight while
  # the mon's RocksDB is still ramping up and during initial OSD bootstrap,
  # which produces a kubelet-driven restart storm.
  healthCheck:
    livenessProbe:
      mon:
        probe:
          timeoutSeconds: 30
          periodSeconds: 15
          failureThreshold: 5
          initialDelaySeconds: 30
      mgr:
        probe:
          timeoutSeconds: 30
          periodSeconds: 15
          failureThreshold: 5
      osd:
        probe:
          timeoutSeconds: 30
          periodSeconds: 15
          failureThreshold: 5
  storage:
    # No node enumeration — the OSD topology is derived, not duplicated.
    # Rook applies this device selection to every node, but an OSD only
    # materializes where BOTH conditions hold, and both come straight from
    # terraform.tfvars (the single source of truth):
    #   1. The scsi1 data disk exists — only non-GPU workers are given a
    #      second disk; masters and GPU workers have scsi0 only.
    #   2. The OSD pod can schedule there — placement.osd below tolerates
    #      neither the control-plane taint (masters) nor gpu=true:NoSchedule
    #      (GPU workers), so both are excluded automatically.
    # Adding/removing a data-disk worker in terraform needs no change here.
    useAllNodes: true
    useAllDevices: false
    devices:
      - name: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1"
  placement:
    all:
      tolerations: []
    osd:
      tolerations: []
  disruptionManagement:
    managePodBudgets: true
