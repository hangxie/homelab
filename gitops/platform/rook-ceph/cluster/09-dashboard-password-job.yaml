# Applies the Vault-managed dashboard admin password to the Ceph mgr now,
# instead of waiting for the operator's next CephCluster reconcile to push
# `rook-ceph-dashboard-password` (which 08-dashboard-externalsecret.yaml keeps
# equal to Vault). Runs as an Argo PostSync hook, so a rotation takes effect on
# the sync that ships it; it sets the same value the operator will assert, so
# the two no longer fight. The ceph.conf/keyring bootstrap mirrors the rook
# toolbox (07-toolbox.yaml).
apiVersion: batch/v1
kind: Job
metadata:
  name: ceph-dashboard-set-password
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: rook-ceph-default
      containers:
        - name: set-password
          image: quay.io/ceph/ceph:v19.2.4
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              CEPH_CONFIG="/etc/ceph/ceph.conf"
              MON_CONFIG="/etc/rook/mon-endpoints"
              KEYRING_FILE="/etc/ceph/keyring"

              endpoints=$(cat "${MON_CONFIG}")
              # strip the mon names, keeping only host:port endpoints
              mon_endpoints=$(echo "${endpoints}" | sed 's/[a-z0-9_-]\+=//g')

              cat > "${CEPH_CONFIG}" <<EOF
              [global]
              mon_host = ${mon_endpoints}

              [client.admin]
              keyring = ${KEYRING_FILE}
              EOF

              cat > "${KEYRING_FILE}" <<EOF
              [${ROOK_CEPH_USERNAME}]
              key = ${ROOK_CEPH_SECRET}
              EOF

              # --force-password skips the strength policy; the value is a
              # 40-char url-safe random secret from Vault.
              ceph dashboard ac-user-set-password admin \
                -i /etc/ceph-dashboard/password --force-password
          env:
            - name: ROOK_CEPH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rook-ceph-mon
                  key: ceph-username
            - name: ROOK_CEPH_SECRET
              valueFrom:
                secretKeyRef:
                  name: rook-ceph-mon
                  key: ceph-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 2016
            runAsGroup: 2016
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: ceph-config, mountPath: /etc/ceph }
            - { name: mon-endpoint-volume, mountPath: /etc/rook }
            - { name: dashboard-password, mountPath: /etc/ceph-dashboard, readOnly: true }
      volumes:
        - name: ceph-config
          emptyDir: {}
        - name: mon-endpoint-volume
          configMap:
            name: rook-ceph-mon-endpoints
            items:
              - key: data
                path: mon-endpoints
        - name: dashboard-password
          secret:
            secretName: rook-ceph-dashboard-password
