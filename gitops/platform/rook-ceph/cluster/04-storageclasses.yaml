apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-ceph-block
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  # RBD image headers live on the replicated pool; image data on the EC pool.
  pool: replicapool
  dataPool: ec-blockpool
  imageFormat: "2"
  imageFeatures: layering
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
  csi.storage.k8s.io/fstype: ext4
allowVolumeExpansion: true
# Delete, not Retain: under Retain a deleted PVC leaves both the PV and the
# backing RBD image behind, invisible to `kubectl get pvc`, and nothing ever
# surfaces them — that silently accumulated 165 GiB of dead volumes. Git is the
# source of truth for which volumes should exist, so deleting a PVC is a
# deliberate act and the image should go with it. Note the field is immutable:
# changing it means deleting and recreating the StorageClass by hand, and
# existing PVs keep whichever policy they were provisioned with.
reclaimPolicy: Delete
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-cephfs
provisioner: rook-ceph.cephfs.csi.ceph.com
parameters:
  clusterID: rook-ceph
  fsName: cephfs
  # Bulk file data lands on the EC data pool (cephfs-ec); the replicated
  # default pool (cephfs-replicated) only holds file backtraces.
  pool: cephfs-ec
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
allowVolumeExpansion: true
reclaimPolicy: Delete
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-ceph-bucket
provisioner: rook-ceph.ceph.rook.io/bucket
# Deleting an ObjectBucketClaim now drops the bucket and its objects, including
# the Postgres backup bucket. Removing an OBC from Git is the only way that
# happens.
reclaimPolicy: Delete
parameters:
  objectStoreName: object-store
  objectStoreNamespace: rook-ceph
