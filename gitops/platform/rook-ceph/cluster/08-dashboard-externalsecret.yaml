# Makes Vault the source of the dashboard admin password.
#
# rook generates `rook-ceph-dashboard-password` once, when the Secret is
# absent, and then re-pushes whatever it holds to the mgr on *every*
# CephCluster reconcile ("op-mgr: setting ceph dashboard admin login creds").
# A reconcile is exactly what an Argo sync of this app triggers, so anything
# that sets the password out-of-band gets clobbered seconds later. Merging the
# Vault value into rook's own Secret puts the operator on our side instead:
# its reconciles become idempotent and keep re-asserting the Vault password.
#
# creationPolicy: Merge because rook owns the Secret (ownerReference to the
# CephCluster); ESO only patches the `password` key in place. 09-dashboard-
# password-job.yaml applies rotations immediately rather than waiting for the
# next operator reconcile, and list-endpoints reads this same Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rook-ceph-dashboard-password
  namespace: rook-ceph
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: rook-ceph-dashboard-password
    creationPolicy: Merge
  data:
    - secretKey: password
      remoteRef:
        key: ceph/dashboard
        property: password
