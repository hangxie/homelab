# Materializes the Vault-managed dashboard admin password into the cluster.
# rook mints its own `rook-ceph-dashboard-password` on cluster creation and
# has no declarative field to override it, so the actual login is enforced by
# 09-dashboard-password-job.yaml, which reads this Secret. list-endpoints also
# reads this Secret so the credential it prints matches what's in Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ceph-dashboard-admin
  namespace: rook-ceph
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: ceph-dashboard-admin
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: ceph/dashboard
        property: password
