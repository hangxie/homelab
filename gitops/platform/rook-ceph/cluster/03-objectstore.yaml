apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: object-store
  namespace: rook-ceph
spec:
  # Keep unscoped RGW administration on this Rook-managed realm instead of
  # allowing Ceph to fall back to a separate realm-less default topology.
  defaultRealm: true
  metadataPool:
    failureDomain: host
    replicated: { size: 3 }
  dataPool:
    failureDomain: host
    erasureCoded: { dataChunks: 2, codingChunks: 1 }
    parameters:
      compression_mode: aggressive
  preservePoolsOnDelete: false
  gateway:
    port: 80
    instances: 2
---
# RGW user consumed by Loki at wave 410. Rook auto-produces a Secret named
# rook-ceph-object-user-object-store-loki in the rook-ceph namespace; Loki's
# ExternalSecret-driven copy lifts AccessKey/SecretKey out of it.
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: loki
  namespace: rook-ceph
spec:
  store: object-store
  displayName: "loki s3 backend"
---
# RGW user consumed by Spark via spark-defaults.conf in the spark namespace.
# Rook produces Secret/rook-ceph-object-user-object-store-spark; Spark's
# ExternalSecret mirrors it into the spark namespace.
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: spark
  namespace: rook-ceph
spec:
  store: object-store
  displayName: "spark s3 backend"
---
# RGW user for the Hive warehouse bucket (s3a://hive/warehouse). RGW denies
# cross-user bucket access, so every warehouse client authenticates as this
# one user: the metastore itself, Trino's hive catalog (trino-s3), and Spark
# jobs that touch warehouse tables (hive-s3 in the spark namespace).
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: hive
  namespace: rook-ceph
spec:
  store: object-store
  displayName: "hive metastore warehouse"
