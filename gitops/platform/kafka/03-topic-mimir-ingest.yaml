apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: mimir-ingest
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  topicName: mimir-ingest
  # Mimir binds partitions to ingester ordinals, so this is the ceiling on
  # ingester replicas and is disruptive to change later. Idle ones cost ~12KiB.
  partitions: 8
  replicas: 3
  config:
    # Two caps because they bind under different conditions. At the measured
    # 87 KB/s per partition, retention.ms binds (~1.9Gi); if the rate returns to
    # its historical 515 KB/s, retention.bytes binds and holds a 3h20m replay
    # window. Both clear the 2h TSDB block period.
    retention.ms: "21600000" # 6h
    retention.bytes: "6442450944" # 6Gi
    cleanup.policy: delete
    min.insync.replicas: "2"
