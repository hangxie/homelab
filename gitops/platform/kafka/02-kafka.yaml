apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.1
    listeners:
      # Plaintext in-cluster, as with every other upstream behind the gateway.
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      default.replication.factor: 3
      # Keeps writes available through one broker loss and refuses them at two,
      # rather than accepting writes into a single copy.
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      # Topics are declared as CRs. Mimir previously auto-created mimir-ingest
      # with 100 partitions, 98 of which stayed empty.
      auto.create.topics.enable: false
  entityOperator:
    # Reconciles the KafkaTopic CRs.
    topicOperator:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
