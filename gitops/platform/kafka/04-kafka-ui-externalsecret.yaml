apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-ui-oidc
  namespace: kafka
  annotations:
    # Ahead of the Deployment (wave 5), which mounts it as env.
    argocd.argoproj.io/sync-wave: "4"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: kafka-ui-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: oidc/kafka-ui
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: oidc/kafka-ui
        property: client-secret
