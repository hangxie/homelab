apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-ui-admin
  namespace: kafka
  annotations:
    # Ahead of the Deployment (wave 5), which mounts it as env.
    argocd.argoproj.io/sync-wave: "4"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: kafka-ui-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: kafka/admin
        property: username
    - secretKey: password
      remoteRef:
        key: kafka/admin
        property: password
