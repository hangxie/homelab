apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 3
  # Combined roles; dedicated controllers would add three pods to arbitrate two
  # active partitions.
  roles:
    - controller
    - broker
  storage:
    # JBOD with one volume: adding a second later is an append, changing the
    # storage type is not a supported transition.
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        # Transient ingest buffer — every durable block is already in the
        # mimir-blocks bucket, so Ceph would duplicate Kafka's own replication.
        class: local-path
        # Advisory only: local-path is unquota'd hostPath. retention.bytes in
        # 03-topic-mimir-ingest.yaml is the real bound. Sized for the worst case
        # it permits: 2 active partitions x 6Gi, plus metadata.
        size: 16Gi
        kraftMetadata: shared
        deleteClaim: false
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 2Gi
  jvmOptions:
    -Xms: 512m
    -Xmx: 1g
  template:
    pod:
      # One broker per node, strictly. topologySpreadConstraints with maxSkew: 1
      # would allow a 2/1 split on two schedulable nodes, and local-path PV node
      # affinity would make that split permanent.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  strimzi.io/cluster: kafka
                  # Not strimzi.io/controller-name — Strimzi prefixes that with
                  # the cluster name (kafka-dual), and a selector matching
                  # nothing puts every broker on one node.
                  strimzi.io/component-type: kafka
              topologyKey: kubernetes.io/hostname
