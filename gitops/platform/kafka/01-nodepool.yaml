apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 3
  # Combined roles; dedicated controllers would add three pods to arbitrate two
  # active partitions.
  roles:
    - controller
    - broker
  storage:
    # JBOD with one volume: adding a second later is an append, changing the
    # storage type is not a supported transition.
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        # Was local-path, on the reasoning that this is a transient ingest
        # buffer and Ceph would duplicate Kafka's own replication. It still
        # does, but the copies are cheap (~11 GiB raw at RF 3 on EC 2+1,
        # against 65 GiB used of 1.5 TiB) and local-path was the worse tier:
        # unquota'd hostPath on the node system disk, which also carries the
        # 41-44 GiB container image cache and has hit DiskPressure before. This
        # was the largest local-path consumer at 2.4 GiB per broker. On Ceph
        # the size below is enforced and a broker is no longer pinned to its
        # node, so a drain can move it instead of parking it.
        #
        # Strimzi ignores a class change on an existing volume — moving this
        # again means recreating the Kafka and KafkaNodePool resources and
        # their PVCs, or the JBOD add-then-remove dance.
        class: rook-ceph-block
        # retention.bytes in 03-topic-mimir-ingest.yaml is the tighter bound.
        # Sized for the worst case it permits: 2 active partitions x 6Gi, plus
        # metadata.
        size: 16Gi
        kraftMetadata: shared
        deleteClaim: false
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 2Gi
  jvmOptions:
    -Xms: 512m
    -Xmx: 1g
  template:
    pod:
      # One broker per node, strictly. topologySpreadConstraints with maxSkew: 1
      # would allow a 2/1 split on two schedulable nodes, and three controllers
      # on two nodes means one node holds the KRaft quorum.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  strimzi.io/cluster: kafka
                  # Not strimzi.io/controller-name — Strimzi prefixes that with
                  # the cluster name (kafka-dual), and a selector matching
                  # nothing puts every broker on one node.
                  strimzi.io/component-type: kafka
              topologyKey: kubernetes.io/hostname
