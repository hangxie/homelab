# Rook 1.20+ ships no CSI drivers; these CRs replace them. Names must match the
# existing StorageClasses' provisioners (rook-ceph.{rbd,cephfs}.csi.ceph.com).

operatorConfig:
  namespace: rook-ceph
  driverSpecDefaults:
    imageSet:
      name: rook-csi-operator-image-set-configmap
    # The chart renders empty per-driver toleration lists, so the drivers below
    # repeat this. Only the nodePlugin needs it: it mounts on GPU nodes.
    nodePlugin:
      priorityClassName: system-node-critical
      tolerations:
        - key: gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
    controllerPlugin:
      priorityClassName: system-cluster-critical

drivers:
  rbd:
    enabled: true
    name: rook-ceph.rbd.csi.ceph.com
    nodePlugin:
      priorityClassName: system-node-critical
      tolerations:
        - key: gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
    controllerPlugin:
      priorityClassName: system-cluster-critical
  cephfs:
    enabled: true
    name: rook-ceph.cephfs.csi.ceph.com
    nodePlugin:
      priorityClassName: system-node-critical
      tolerations:
        - key: gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
    controllerPlugin:
      priorityClassName: system-cluster-critical
  nfs:
    enabled: false
    name: rook-ceph.nfs.csi.ceph.com
  nvmeof:
    enabled: false
    name: rook-ceph.nvmeof.csi.ceph.com
