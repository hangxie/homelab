# Enrolled in Istio Ambient (#300 phase 1). Restart each workload after any
# change to this label (README "Istio Ambient").
apiVersion: v1
kind: Namespace
metadata:
  name: loki
  labels:
    istio.io/dataplane-mode: ambient
  annotations:
    # Pruning this would delete Loki and its bucket claims with it.
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
