deploymentMode: SimpleScalable

loki:
  auth_enabled: false
  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler:  loki-ruler
    s3:
      # endpoint surfaced via the RGW Service; ExternalSecret-managed Secret
      # supplies access_key_id / secret_access_key at runtime.
      endpoint: rook-ceph-rgw-object-store.rook-ceph.svc:80
      region: us-east-1
      s3ForcePathStyle: true
      insecure: true
      accessKeyId: ${ACCESS_KEY_ID}
      secretAccessKey: ${SECRET_ACCESS_KEY}
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index: { prefix: index_, period: 24h }
  # Delete logs older than 7 days. The compactor (runs in the backend target)
  # applies retention; delete markers are written to the S3 chunk store.
  limits_config:
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: s3

# The write target holds only the ingester WAL and the active index buffer;
# durable chunks and index land in the S3 chunk store. That was the case for
# putting it on node-local disk, back when the OSDs sat on a slow consumer SATA
# SSD. It no longer holds: the OSDs are on the striped NVMe pool, local-path is
# unquota'd hostPath on the shared node system disk, and the WAL writes 77
# KiB/s against a cluster-wide Ceph client load of ~23 write ops/s. Ceph also
# frees the pod from its node, which a local volume cannot be moved off.
#
# replicas must be >= the chart's replication_factor (3) for a node loss to be
# survivable: quorum is floor(3/2)+1 = 2, so two of three ingesters still hold
# every stream. At 2 replicas a single write pod going down breaks quorum.
write:
  replicas: 3
  persistence:
    storageClass: rook-ceph-block
    size: 10Gi
  extraEnvFrom:
    - secretRef: { name: loki-s3 }

read:
  replicas: 2
  persistence:
    storageClass: rook-ceph-block
    size: 10Gi
  extraEnvFrom:
    - secretRef: { name: loki-s3 }

backend:
  replicas: 2
  persistence:
    storageClass: rook-ceph-block
    size: 10Gi
  extraEnvFrom:
    - secretRef: { name: loki-s3 }

chunksCache:
  allocatedMemory: 1024

resultsCache:
  allocatedMemory: 256

gateway:
  enabled: true

monitoring:
  dashboards:
    # Disabled: patched versions with correct datasource/cluster/namespace defaults
    # are provisioned via extras/loki-dashboards.yaml instead.
    enabled: false
