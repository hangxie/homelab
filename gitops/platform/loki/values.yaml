deploymentMode: Monolithic

loki:
  auth_enabled: false
  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler:  loki-ruler
    s3:
      # endpoint surfaced via the RGW Service; ExternalSecret-managed Secret
      # supplies access_key_id / secret_access_key at runtime.
      endpoint: rook-ceph-rgw-object-store.rook-ceph.svc:80
      region: us-east-1
      s3ForcePathStyle: true
      insecure: true
      accessKeyId: ${ACCESS_KEY_ID}
      secretAccessKey: ${SECRET_ACCESS_KEY}
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index: { prefix: index_, period: 24h }
  # Delete logs older than 7 days. The compactor applies retention; delete
  # markers are written to the S3 chunk store.
  limits_config:
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: s3

# Monolithic (#276): every pod runs all targets and they share one ring; Loki
# 4.0 drops SimpleScalable. The PVC holds only the ingester WAL and the active
# index buffer; durable chunks and index land in S3.
#
# replicas must be >= the chart's replication_factor (3) for a node loss to be
# survivable: quorum is floor(3/2)+1 = 2, so two of three ingesters still hold
# every stream. At 2 replicas a single pod going down breaks quorum.
singleBinary:
  replicas: 3
  persistence:
    storageClass: rook-ceph-block
    size: 10Gi
  extraEnvFrom:
    - secretRef: { name: loki-s3 }
  # The chart renders the PDB only with a limit set.
  podDisruptionBudget:
    maxUnavailable: 1

# The chart defaults these SimpleScalable targets to non-zero replicas.
write: { replicas: 0 }
read: { replicas: 0 }
backend: { replicas: 0 }

chunksCache:
  allocatedMemory: 1024

resultsCache:
  allocatedMemory: 256

gateway:
  enabled: true
  # Every push and query goes through nginx. Anti-affinity is the chart
  # default; the PDB renders only with maxUnavailable set.
  replicas: 2
  maxUnavailable: 1

monitoring:
  # Only dashboards are enabled here, so this just keeps their ConfigMaps
  # next to Grafana.
  namespace: grafana
  # The dashboards filter on this label; Alloy already stamps `cluster`.
  appInstanceLabelName: cluster
  dashboards:
    enabled: true
    labels:
      grafana_dashboard: "1"
    annotations:
      k8s-sidecar-target-directory: /tmp/dashboards/Loki
    # Their single-binary fallback matches only a pod named exactly `loki`
    # (anchored `pod=~"...|loki"`) and has none for distributor/query-frontend,
    # so loki-0..2 leave most panels empty. Relabeling pod would merge the three.
    loki-reads-resources:
      enabled: false
    loki-writes-resources:
      enabled: false

# Helm test hook; Argo CD never runs it.
test:
  enabled: false
