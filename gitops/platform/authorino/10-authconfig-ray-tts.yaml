# TTS synthesis API. Only the /api rule of the tts HTTPRoute carries the
# ExternalAuth filter; /health and the FastAPI doc routes stay public.
apiVersion: authorino.kuadrant.io/v1beta3
kind: AuthConfig
metadata:
  name: ray-tts
  namespace: authorino
spec:
  hosts:
    - tts.homelab.xiehang.com
  authentication:
    # Opaque Zitadel tokens (machine-user PATs), checked by introspection.
    zitadel:
      oauth2Introspection:
        endpoint: https://zitadel.homelab.xiehang.com/oauth/v2/introspect
        credentialsRef:
          name: zitadel-introspection
      credentials:
        authorizationHeader:
          prefix: Bearer
      # Bounds both Zitadel load and how long a revoked token keeps working.
      cache:
        key:
          expression: request.headers.authorization
        ttl: 60
  authorization:
    # Roles granted on the homelab project, the project of the introspecting
    # client. Never use `scope`: it lists every role in the project.
    role:
      patternMatching:
        patterns:
          - predicate: >-
              'urn:zitadel:iam:org:project:roles' in auth.identity &&
              ['admin', 'tts-user'].exists(r,
                r in auth.identity['urn:zitadel:iam:org:project:roles'])
  response:
    success:
      headers:
        x-consumer:
          plain:
            expression: auth.identity.username
