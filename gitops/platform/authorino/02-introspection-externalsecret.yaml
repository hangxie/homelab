# Zitadel API client (apiClients in scripts/zitadel.template.yaml) that
# Authorino uses to introspect bearer tokens; seed-zitadel.sh writes it to Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-introspection
  namespace: authorino
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: zitadel-introspection
    creationPolicy: Owner
  data:
    - secretKey: clientID
      remoteRef:
        key: oidc/authorino
        property: client-id
    - secretKey: clientSecret
      remoteRef:
        key: oidc/authorino
        property: client-secret
