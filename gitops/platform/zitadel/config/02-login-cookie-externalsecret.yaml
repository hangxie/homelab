apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-login-cookie
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: zitadel-login-cookie
    creationPolicy: Owner
  data:
    - secretKey: ZITADEL_SESSION_COOKIE_SECRET
      remoteRef:
        key: zitadel/login-cookie
        property: cookie-secret
