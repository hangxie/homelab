# The chart's route sends all of / to Zitadel, which would publish /debug/*
# (metrics, config validation). The more specific matches here win over that
# prefix: health checks stay reachable for the gateway probe, and anything else
# under /debug is rewritten to a path Zitadel answers with 404. Alloy scrapes
# metrics from the pod directly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel-debug
spec:
  parentRefs:
    - name: default-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - zitadel.homelab.xiehang.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /debug/ready
        - path:
            type: Exact
            value: /debug/healthz
      backendRefs:
        - name: zitadel
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /debug
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /blocked
      backendRefs:
        - name: zitadel
          port: 8080
