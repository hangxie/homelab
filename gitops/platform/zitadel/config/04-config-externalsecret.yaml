# Secret half of the Zitadel config: the chart merges this file over its
# ConfigMap (values.yaml) at startup.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-config
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: zitadel-config
    creationPolicy: Owner
    template:
      data:
        config-yaml: |
          Database:
            postgres:
              User:
                Password: "{{ .db_password }}"
              Admin:
                Password: "{{ .db_password }}"
          FirstInstance:
            Org:
              Human:
                Password: "{{ .admin_password }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: postgres-cnpg/zitadel
        property: password
    - secretKey: admin_password
      remoteRef:
        key: zitadel/admin
        property: password
