# Zitadel OIDC client for oidc.config in values.yaml, which reads it as
# $argocd-oidc:<key>; Argo CD only resolves Secrets labelled part-of argocd.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: argocd-oidc
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: client-id
      remoteRef:
        key: oidc/argocd
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: oidc/argocd
        property: client-secret
