hub: docker.io/istio
tag: "1.31.3"
# Pinned from #299: more workers gained nothing; the stream limit is per connection
# lifetime, so lowering it forces TLS handshakes (and at 1, cold streams can hang).
env:
  ZTUNNEL_WORKER_THREADS: "2"
  POOL_MAX_STREAMS_PER_CONNECTION: "100"
# CPU is intentionally uncapped; record worker CPU with each benchmark.
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 1Gi
# Include control-plane nodes and the gpu=true:NoSchedule worker.
tolerations:
  - operator: Exists
    effect: NoSchedule
  - operator: Exists
    effect: NoExecute
