replicas: 2

tempo:
  storage:
    trace:
      backend: s3
      s3:
        bucket: tempo-traces
        endpoint: rook-ceph-rgw-object-store.rook-ceph.svc:80
        region: us-east-1
        insecure: true
        access_key: ${AWS_ACCESS_KEY_ID}
        secret_key: ${AWS_SECRET_ACCESS_KEY}
  retention: 168h
  # TraceQL metrics (/api/metrics/query_range, used by Grafana's Traces Drilldown
  # and service-graph panels) are served by the metrics generator's local-blocks
  # processor. Without it the querier finds an empty generator ring and 500s.
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://mimir-gateway.mimir/api/v1/push
    processor:
      local_blocks:
        flush_to_storage: true
      service_graphs: {}
      span_metrics: {}
    registry:
      external_labels:
        cluster: homelab
        source: tempo
    # Chart defaults put both paths under /tmp; keep them on the PVC instead.
    storage:
      path: /var/tempo/generator/wal
    traces_storage:
      path: /var/tempo/generator/traces
  # The generator only runs for tenants that list its processors.
  overrides:
    defaults:
      metrics_generator:
        processors:
          - local-blocks
          - service-graphs
          - span-metrics
  extraArgs:
    config.expand-env: true
  extraEnvFrom:
    - secretRef:
        name: tempo-traces

# WAL is written locally before being flushed to S3; each pod gets its own PVC.
persistence:
  enabled: true
  storageClassName: rook-ceph-block
  size: 10Gi

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  runAsNonRoot: true

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: tempo
        topologyKey: kubernetes.io/hostname
