replicas: 2

# Default liveness grace (60s + 10*10s) is too short for first-boot DB
# migrations on this cluster's storage; kubelet was killing the container
# mid-migration, causing an endless crash loop.
livenessProbe:
  httpGet:
    path: /api/health
    port: grafana
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 30
  failureThreshold: 40

admin:
  existingSecret: grafana-admin
  userKey: username
  passwordKey: password

defaultDashboardsTimezone: browser

sidecar:
  dashboards:
    enabled: true
    searchNamespace: ALL
    label: grafana_dashboard
    labelValue: "1"
    folderAnnotation: k8s-sidecar-target-directory
    provider:
      foldersFromFilesStructure: true
  datasources:
    enabled: true
    searchNamespace: ALL
    label: grafana_datasource
    labelValue: "1"

# SQLite replaced by Postgres; PVC no longer holds application state.
# Existing PVC is left intact (Prune=false) and can be removed manually.
persistence:
  enabled: false

grafana.ini:
  database:
    # Behind the transaction-mode pooler, lib/pq must send Parse/Bind/Execute
    # in one sync, or the unnamed statement lands on another server conn.
    url: postgres://$__env{GF_DATABASE_USER}:$__env{GF_DATABASE_PASSWORD}@postgres-cluster-pooler-rw.postgres-cluster.svc:5432/grafana?binary_parameters=yes
    ssl_mode: disable
  # Cap annotation history (incl. alert state-change annotations) at 7 days.
  # Grafana keeps annotations forever by default; its periodic cleanup job
  # deletes anything older than max_age.
  annotations.dashboard:
    max_age: 7d
  annotations.api:
    max_age: 7d
  # OAuth builds its redirect URI from this; the default is localhost:3000.
  server:
    root_url: https://grafana.homelab.xiehang.com
  # Zitadel SSO. Zitadel only lets users with a homelab project grant through;
  # its roles map to Grafana roles, and a login without a mapped role is
  # refused. Grafana ignores the token's expiry without a refresh token, so its
  # own session is capped at the 12h used across apps. auto_login skips the
  # login page, so sign-out must also end the Zitadel session or auto_login
  # signs straight back in. Break-glass local login:
  # https://grafana.homelab.xiehang.com/login?disableAutoLogin=true
  auth:
    login_maximum_lifetime_duration: 12h
    signout_redirect_url: https://zitadel.homelab.xiehang.com/oidc/v1/end_session?client_id=$__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}&post_logout_redirect_uri=https%3A%2F%2Fgrafana.homelab.xiehang.com%2Flogin
  auth.generic_oauth:
    enabled: true
    auto_login: true
    name: Zitadel
    scopes: openid profile email
    auth_url: https://zitadel.homelab.xiehang.com/oauth/v2/authorize
    token_url: https://zitadel.homelab.xiehang.com/oauth/v2/token
    api_url: https://zitadel.homelab.xiehang.com/oidc/v1/userinfo
    use_pkce: true
    allow_sign_up: true
    allow_assign_grafana_admin: true
    role_attribute_strict: true
    role_attribute_path: >-
      contains(groups || `[]`, 'admin') && 'GrafanaAdmin'
      || contains(groups || `[]`, 'viewer') && 'Viewer'
      || ''
envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
    secretKeyRef:
      name: grafana-oidc
      key: client-id
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    secretKeyRef:
      name: grafana-oidc
      key: client-secret
  GF_DATABASE_USER:
    secretKeyRef:
      name: grafana-db-credentials
      key: username
  GF_DATABASE_PASSWORD:
    secretKeyRef:
      name: grafana-db-credentials
      key: password

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: grafana
        topologyKey: kubernetes.io/hostname

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: infrastructure
        orgId: 1
        folder: Infrastructure
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/infrastructure
      - name: kubernetes
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/kubernetes
      - name: platform
        orgId: 1
        folder: Platform
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/platform
      - name: observability
        orgId: 1
        folder: Observability
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/observability
      - name: workloads
        orgId: 1
        folder: Workloads
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/workloads

dashboards:
  infrastructure:
    node-exporter-full:
      gnetId: 1860
      revision: 45
      datasource: Mimir
    # Drives off probe_success, so it covers every blackbox target Alloy
    # probes — Vault and Harbor on media, SSH, the AI router, the gateway,
    # and the upstreams. Its job/instance variables line up with the labels the
    # blackbox relabel produces (job="blackbox", instance=<probe name>).
    blackbox-exporter:
      gnetId: 13659
      datasource: Mimir
  kubernetes:
    k8s-views-global:
      gnetId: 15760
      datasource: Mimir
    k8s-views-namespaces:
      gnetId: 15761
      datasource: Mimir
    k8s-views-nodes:
      gnetId: 15762
      datasource: Mimir
    # k8s-views-pods is provisioned via extras/dashboards/k8s_views_pods.json
    # so the datasource variable can default to Mimir (gnetId sets it to "Prometheus").
  platform:
    argocd:
      gnetId: 14584
      datasource: Mimir
    rook-ceph-cluster:
      url: https://raw.githubusercontent.com/rook/rook/v1.20.0/deploy/examples/monitoring/grafana/Ceph%20Cluster%20Dashboard.json
      datasource: Mimir
    rook-ceph-osd:
      url: https://raw.githubusercontent.com/rook/rook/v1.20.0/deploy/examples/monitoring/grafana/Ceph%20OSD%20Single%20Dashboard.json
      datasource: Mimir
    rook-ceph-pool:
      url: https://raw.githubusercontent.com/rook/rook/v1.20.0/deploy/examples/monitoring/grafana/Ceph%20Pools%20Dashboard.json
      datasource: Mimir
  observability:
    # No Alloy dashboard here: gnetId 13659 used to be provisioned under that
    # name and is in fact "Blackbox Exporter (HTTP prober)" — the same mix-up
    # as ray/14708 below. It now sits under infrastructure, where it has data.
    # Alloy's own dashboards live in operations/alloy-mixin in the Alloy repo
    # and are not published to grafana.com.
    tempo:
      gnetId: 23242
      revision: 1
      datasource: Mimir
  workloads:
    airflow:
      gnetId: 21483
      datasource: Mimir
    cassandra:
      gnetId: 5408
      datasource: Mimir
    clickhouse:
      gnetId: 14192
      datasource: Mimir
    hdfs:
      gnetId: 12236
      datasource: Mimir
    mysql:
      gnetId: 14057
      datasource: Mimir
    # Ray's own dashboards (cluster overview, serve, serve-deployment) are
    # vendored directly from the Ray source tree and provisioned via the
    # sidecar from gitops/workloads/raw/ray/manifests/, since they match
    # the ray_* metric names Ray actually exports. gnetId 14708 was an
    # unrelated dashboard that happened to be named "ray" and had no
    # matching metrics.
    redis:
      gnetId: 763
      datasource: Mimir
    spark:
      gnetId: 7890
      datasource: Mimir
    trino:
      gnetId: 14845
      datasource: Mimir
