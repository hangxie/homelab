apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: grafana
  labels:
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # Alert rules live in the Mimir ruler, not in Grafana. manageAlerts lets
      # the Alerting UI list and edit them through this datasource, and
      # alertmanagerUid points "send to" at Mimir's Alertmanager below.
      - name: Mimir
        type: prometheus
        uid: mimir
        url: http://mimir-gateway.mimir/prometheus
        isDefault: true
        jsonData:
          httpMethod: POST
          timeInterval: 60s
          manageAlerts: true
          alertmanagerUid: mimir-alertmanager
      # Routing and silences are owned by Mimir's Alertmanager; Grafana is only
      # a UI over it. handleGrafanaManagedAlerts stays false so Grafana's own
      # embedded Alertmanager is not fed from here.
      - name: Alertmanager
        type: alertmanager
        uid: mimir-alertmanager
        url: http://mimir-gateway.mimir/
        jsonData:
          implementation: mimir
          handleGrafanaManagedAlerts: false
      # A same-URL alias of Mimir, kept only so community dashboards that
      # hardcode a datasource named "Prometheus" resolve. manageAlerts defaults
      # to true, which made the Alerting UI enumerate the Mimir ruler's rules a
      # second time under this datasource; it stays off so Mimir above is the
      # single entry point for alert rules.
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://mimir-gateway.mimir/prometheus
        jsonData:
          httpMethod: POST
          timeInterval: 60s
          manageAlerts: false
      - name: Loki
        type: loki
        uid: loki
        url: http://loki-gateway.loki
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.tempo:3200
        jsonData:
          httpMethod: GET
          tracesToLogsV2:
            datasourceUid: loki
          lokiSearch:
            datasourceUid: loki
