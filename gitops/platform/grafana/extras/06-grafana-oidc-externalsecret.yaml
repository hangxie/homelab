# Zitadel OIDC client, written to Vault by scripts/seed-zitadel.sh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: grafana-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: oidc/grafana
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: oidc/grafana
        property: client-secret
