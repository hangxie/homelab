# kustomize renders this whole directory: Argo CD switches renderers the moment
# a kustomization.yaml appears here and stops picking up loose files. A new
# manifest dropped in this directory is silently ignored until it is listed
# under `resources:`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 01-grafana-admin-externalsecret.yaml
  - 02-datasources.yaml
  - 04-routes.yaml
  - 05-grafana-db.yaml

# Dashboards are vendored upstream JSON, kept as .json so they can be jq'd,
# diffed against a refreshed copy, and pasted into Grafana's import dialog.
configMapGenerator:
  - name: grafana-dashboard-k8s-views-pods
    namespace: grafana
    files:
      - dashboards/k8s_views_pods.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        k8s-sidecar-target-directory: /tmp/dashboards/Kubernetes
