# kustomize renders this whole directory: Argo CD switches renderers the moment
# a kustomization.yaml appears here and stops picking up loose files. A new
# manifest dropped in this directory is silently ignored until it is listed
# under `resources:`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 01-grafana-admin-externalsecret.yaml
  - 02-datasources.yaml
  - 04-routes.yaml
  - 05-grafana-db.yaml
  - 06-grafana-oidc-externalsecret.yaml

# The sidecar names files after the ConfigMap's data keys, not the ConfigMap,
# so a hashed name would have Argo prune the old ConfigMap and delete the very
# files the new one just wrote. Fixed names reload in place on MODIFIED.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: /tmp/dashboards/Infrastructure

# Dashboards built here, with no upstream to pull from; kept as .json so they
# can be jq'd and pasted into Grafana's import dialog. Upstream dashboards come
# from gnetId/url in values.yaml instead.
configMapGenerator:
  - name: grafana-dashboard-ai-inference
    namespace: grafana
    files:
      - dashboards/ai-inference.json
  - name: grafana-dashboard-zitadel
    namespace: grafana
    files:
      - dashboards/zitadel.json
