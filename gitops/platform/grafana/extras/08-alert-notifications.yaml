apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-notifications
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  # Picked up by the alerts sidecar into /etc/grafana/provisioning/alerting and
  # applied via POST /api/admin/provisioning/alerting/reload, so edits here take
  # effect without a Grafana restart.
  #
  # Provisioning the root policy makes the notification tree read-only in the
  # UI (provenance: file) — route changes belong in this file, not the UI.
  notifications.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: slack
        receivers:
          - uid: slack-homelab
            type: slack
            settings:
              # Expanded from the container env at provisioning time; the
              # webhook URL itself never lands in Git or in this ConfigMap.
              url: $__env{GF_SLACK_WEBHOOK_URL}
              title: '[{{ .Status }}] {{ .CommonLabels.alertname }}'
              text: |
                {{ range .Alerts -}}
                *{{ .Labels.alertname }}* ({{ .Labels.severity }})
                {{ .Annotations.summary }}
                {{ .Annotations.description }}
                {{ if .DashboardURL }}<{{ .DashboardURL }}|Dashboard> {{ end }}{{ if .SilenceURL }}<{{ .SilenceURL }}|Silence>{{ end }}
                {{ end }}
    policies:
      - orgId: 1
        receiver: slack
        group_by: [alertname, grafana_folder]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
