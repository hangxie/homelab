# Lets HTTPRoutes in app namespaces point their ExternalAuth filter at the
# oauth2-proxy Service here. Add a `from` entry per namespace that uses it.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: external-auth
  namespace: oauth2-proxy
spec:
  from:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: kube-system }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: alloy }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: hdfs }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: spark }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: ray-vllm }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: ray-tts }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: clickhouse }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: dbeaver }
  to:
    - group: ""
      kind: Service
      name: oauth2-proxy
