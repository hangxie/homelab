# Shared login for apps without OIDC (#214). Routes call it through an
# ExternalAuth filter (protocol HTTP); it proxies nothing: a valid session
# answers 200 (allow), anything else gets the login redirect, which the Gateway
# hands back to the browser unchanged. Each host keeps its own cookie and its
# own /oauth2/callback, listed in the Zitadel client's redirectUris.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: oauth2-proxy
                topologyKey: kubernetes.io/hostname
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
          args:
            - --provider=oidc
            - --provider-display-name=Zitadel
            - --oidc-issuer-url=https://zitadel.homelab.xiehang.com
            - --scope=openid email profile
            - --code-challenge-method=S256
            - --oidc-groups-claim=groups
            # Applies to every app behind it; an app open to viewers needs its own instance.
            - --allowed-group=admin
            - --email-domain=*
            - --skip-provider-button=true
            - --reverse-proxy=true
            - --whitelist-domain=.homelab.xiehang.com
            - --http-address=0.0.0.0:4180
            # Envoy HTTP ext_authz allows only 200; 202 is returned to the browser.
            - --upstream=static://200
            # X-Auth-Request-Email on the 200; routes pass only it (allowedResponseHeaders) to the app.
            - --set-xauthrequest=true
            - --cookie-name=__Host-oauth2-proxy
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
            - --cookie-expire=12h
            # The Gateway drops auth-service headers on allowed requests, so a refreshed cookie never reaches the browser.
            - --cookie-refresh=0
            # /oauth2/sign_out also ends the Zitadel session, else the next visit signs straight back in.
            - --backend-logout-url=https://zitadel.homelab.xiehang.com/oidc/v1/end_session?id_token_hint={id_token}
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: { secretKeyRef: { name: oauth2-proxy-oidc, key: client-id } }
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy-oidc, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy-oidc, key: cookie-secret } }
          ports:
            - { name: http, containerPort: 4180 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
          livenessProbe:
            httpGet: { path: /ping, port: http }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy
  ports:
    - { name: http, port: 4180, targetPort: http }
---
# Cilium's Envoy makes ext_authz calls from the node, not with the `ingress`
# identity route backends see, so admit nodes. Reaching it grants nothing:
# it only answers allow or deny.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: oauth2-proxy-ingress
  namespace: oauth2-proxy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - { port: "4180", protocol: TCP }
