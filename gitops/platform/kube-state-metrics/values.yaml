replicas: 2

# No serviceMonitor — Alloy scrapes kube-state-metrics directly.

# The Loki resources dashboards pick their PVCs from these (via an Alloy
# relabel that rebuilds the chart's old `name` label).
metricLabelsAllowlist:
  - persistentvolumeclaims=[app.kubernetes.io/name,app.kubernetes.io/component]
