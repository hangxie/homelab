# Slack incoming-webhook URL for the Alertmanager `slack` receiver. The key is
# named SLACK_WEBHOOK_URL because the alertmanager pods consume this Secret via
# envFrom, and Mimir expands ${SLACK_WEBHOOK_URL} in the fallback config — the
# URL therefore never appears in the rendered ConfigMap or in Git.
#
# The webhook points at the homelab alerts channel. Nothing else consumes it:
# Grafana is only a UI over Mimir's Alertmanager and has no Slack wiring left.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mimir-slack
  namespace: mimir
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: mimir-slack
    creationPolicy: Owner
  data:
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: slack/mimir
        property: webhook-url
