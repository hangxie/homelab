# Mounted into the ruler at /rules/anonymous — "anonymous" is the tenant the
# gateway injects when multitenancy is off, and Mimir's local rule store expects
# <ruler_storage.local.directory>/<tenant>/<file>.
#
# Each data key is a Mimir rule namespace, so the file itself carries only the
# group list — a `namespace:` key inside a file fails to parse as
# rulefmt.RuleGroups. Unlike Grafana-managed rules, an empty query result simply
# means "not firing", so no noDataState handling is needed.
#
# Two conventions every rule here follows:
#
#   * Aggregate away `instance`. kube-state-metrics runs two replicas and both
#     are scraped, so every kube_* series exists twice with a different
#     `instance`; without a `max by (...)` each KSM alert would fire twice.
#     Argo CD's application-controller metrics reshard the same way.
#   * `severity` is either warning or critical. The Alertmanager route groups by
#     (alertname, severity) and an inhibit rule drops the warning when the
#     critical of the same alertname is already firing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-ruler-rules
  namespace: mimir
data:
  # ── Scrape targets ────────────────────────────────────────────────────────
  # The broadest net: every exporter Alloy scrapes. A target that stops
  # answering is either the workload being down or its metrics path breaking,
  # and both are worth knowing about.
  targets.yaml: |
    groups:
      - name: targets
        interval: 1m
        rules:
          - alert: TargetDown
            expr: up == 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Scrape target is down"
              description: "Alloy has failed to scrape {{ $labels.instance }} for job {{ $labels.job }} for 15 minutes."

  # ── Kubernetes workloads ──────────────────────────────────────────────────
  # kube-state-metrics covers every workload in the cluster, including the ones
  # that export no metrics of their own (superset, jupyter, openwebui, dbeaver,
  # headlamp). These rules are the only alerting those services get, so they
  # stay generic on purpose; everything else is also covered by its own rules
  # under workloads.yaml.
  kubernetes.yaml: |
    groups:
      - name: kubernetes-workloads
        interval: 1m
        rules:
          - alert: KubePodCrashLooping
            expr: |
              max by (namespace, pod, container) (
                kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}
              ) == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Pod is crash looping"
              description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has been in CrashLoopBackOff for 15 minutes."

          - alert: KubePodContainerWaiting
            expr: |
              max by (namespace, pod, container, reason) (
                kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError|InvalidImageName"}
              ) == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Container cannot start"
              description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has been waiting on {{ $labels.reason }} for 15 minutes."

          # Job-owned pods legitimately end up Failed and are never retried, so
          # they are excluded rather than alerted on here — KubeJobFailed covers
          # them with the Job's own identity.
          - alert: KubePodNotReady
            expr: |
              max by (namespace, pod) (
                max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"} == 1)
                * on (namespace, pod) group_left(owner_kind)
                  topk by (namespace, pod) (
                    1, max by (namespace, pod, owner_kind) (kube_pod_owner{owner_kind!="Job"})
                  )
              ) > 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Pod has been in a non-ready state for 30 minutes"
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has not reached Running for 30 minutes."

          - alert: KubeContainerOOMKilled
            expr: |
              max by (namespace, pod, container) (
                increase(container_oom_events_total{container!=""}[15m])
              ) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Container was OOMKilled"
              description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} hit its memory limit and was killed in the last 15 minutes."

          # The changes() clause suppresses the alert while a rollout is still
          # replacing pods; only a Deployment that has stopped converging fires.
          - alert: KubeDeploymentReplicasMismatch
            expr: |
              (
                max by (namespace, deployment) (kube_deployment_spec_replicas)
                != max by (namespace, deployment) (kube_deployment_status_replicas_available)
              )
              and
              (
                max by (namespace, deployment) (changes(kube_deployment_status_replicas_updated[10m])) == 0
              )
            for: 20m
            labels:
              severity: warning
            annotations:
              summary: "Deployment has not matched its desired replica count"
              description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has {{ printf \"%.0f\" $value }} available replicas, fewer than desired, and has stopped rolling out."

          - alert: KubeStatefulSetReplicasMismatch
            expr: |
              (
                max by (namespace, statefulset) (kube_statefulset_replicas)
                != max by (namespace, statefulset) (kube_statefulset_status_replicas_ready)
              )
              and
              (
                max by (namespace, statefulset) (changes(kube_statefulset_status_replicas_updated[10m])) == 0
              )
            for: 20m
            labels:
              severity: warning
            annotations:
              summary: "StatefulSet has not matched its desired replica count"
              description: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has {{ printf \"%.0f\" $value }} ready replicas, fewer than desired, and has stopped rolling out."

          - alert: KubeDaemonSetNotFullyScheduled
            expr: |
              max by (namespace, daemonset) (kube_daemonset_status_number_unavailable) > 0
            for: 20m
            labels:
              severity: warning
            annotations:
              summary: "DaemonSet pods are unavailable"
              description: "DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} has {{ printf \"%.0f\" $value }} unavailable pods."

          - alert: KubeJobFailed
            expr: |
              max by (namespace, job_name) (kube_job_status_failed) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Job failed to complete"
              description: "Job {{ $labels.namespace }}/{{ $labels.job_name }} has {{ printf \"%.0f\" $value }} failed pods."

      - name: kubernetes-storage
        interval: 1m
        rules:
          - alert: KubePersistentVolumeFillingUp
            expr: |
              kubelet_volume_stats_available_bytes
              / kubelet_volume_stats_capacity_bytes * 100 < 15
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "PersistentVolume has less than 15% space left"
              description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has only {{ printf \"%.2f\" $value }}% free."

          - alert: KubePersistentVolumeFillingUp
            expr: |
              kubelet_volume_stats_available_bytes
              / kubelet_volume_stats_capacity_bytes * 100 < 5
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "PersistentVolume has less than 5% space left"
              description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has only {{ printf \"%.2f\" $value }}% free."

          - alert: KubePersistentVolumeClaimPending
            expr: |
              max by (namespace, persistentvolumeclaim) (
                kube_persistentvolumeclaim_status_phase{phase=~"Pending|Lost"}
              ) == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "PersistentVolumeClaim is not bound"
              description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has been unbound for 15 minutes."

      - name: kubernetes-nodes
        interval: 1m
        rules:
          - alert: KubeNodeNotReady
            expr: |
              max by (node) (kube_node_status_condition{condition="Ready",status="true"}) == 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Node is not ready"
              description: "Node {{ $labels.node }} has been NotReady for 15 minutes."

          - alert: KubeNodeUnderPressure
            expr: |
              max by (node, condition) (
                kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure",status="true"}
              ) == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Node reports resource pressure"
              description: "Node {{ $labels.node }} has been reporting {{ $labels.condition }} for 15 minutes."

  # ── Nodes ─────────────────────────────────────────────────────────────────
  # prometheus.exporter.unix runs inside the Alloy DaemonSet pod, so `instance`
  # is the node name (overridden in the Alloy relabel) and `job` is
  # "integrations/unix" — the exporter's own name, not the job_name in the
  # scrape block. The pod sees the node root filesystem through four bind
  # mounts (/etc/alloy, /etc/hostname, /etc/hosts, /etc/resolv.conf), so the
  # filesystem rules aggregate by device to collapse the duplicates.
  node.yaml: |
    groups:
      - name: node-filesystem
        interval: 1m
        rules:
          - alert: NodeFilesystemAlmostOutOfSpace
            expr: |
              (
                max by (instance, device, fstype) (node_filesystem_avail_bytes{job="integrations/unix",fstype!~"tmpfs|ramfs|overlay|squashfs"})
                / max by (instance, device, fstype) (node_filesystem_size_bytes{job="integrations/unix",fstype!~"tmpfs|ramfs|overlay|squashfs"}) * 100 < 15
              )
              and
              min by (instance, device, fstype) (node_filesystem_readonly{job="integrations/unix",fstype!~"tmpfs|ramfs|overlay|squashfs"}) == 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Filesystem has less than 15% space left"
              description: "Filesystem on {{ $labels.device }} at {{ $labels.instance }} has only {{ printf \"%.2f\" $value }}% available space."

          - alert: NodeFilesystemAlmostOutOfSpace
            expr: |
              (
                max by (instance, device, fstype) (node_filesystem_avail_bytes{job="integrations/unix",fstype!~"tmpfs|ramfs|overlay|squashfs"})
                / max by (instance, device, fstype) (node_filesystem_size_bytes{job="integrations/unix",fstype!~"tmpfs|ramfs|overlay|squashfs"}) * 100 < 5
              )
              and
              min by (instance, device, fstype) (node_filesystem_readonly{job="integrations/unix",fstype!~"tmpfs|ramfs|overlay|squashfs"}) == 0
            for: 30m
            labels:
              severity: critical
            annotations:
              summary: "Filesystem has less than 5% space left"
              description: "Filesystem on {{ $labels.device }} at {{ $labels.instance }} has only {{ printf \"%.2f\" $value }}% available space."

          - alert: NodeFilesystemAlmostOutOfInodes
            expr: |
              max by (instance, device, fstype) (node_filesystem_files_free{job="integrations/unix",fstype!~"tmpfs|ramfs|overlay|squashfs"})
              / max by (instance, device, fstype) (node_filesystem_files{job="integrations/unix",fstype!~"tmpfs|ramfs|overlay|squashfs"}) * 100 < 10
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Filesystem has less than 10% inodes left"
              description: "Filesystem on {{ $labels.device }} at {{ $labels.instance }} has only {{ printf \"%.2f\" $value }}% free inodes."

          - alert: NodeFilesystemReadOnly
            expr: |
              min by (instance, device, fstype) (node_filesystem_readonly{job="integrations/unix",fstype!~"tmpfs|ramfs|overlay|squashfs"}) == 1
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Filesystem has been remounted read-only"
              description: "Filesystem on {{ $labels.device }} at {{ $labels.instance }} is read-only, which usually means the underlying device is failing."

      - name: node-resources
        interval: 1m
        rules:
          - alert: NodeMemoryHighUtilisation
            expr: |
              (
                1 - node_memory_MemAvailable_bytes{job="integrations/unix"}
                / node_memory_MemTotal_bytes{job="integrations/unix"}
              ) * 100 > 90
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Node memory is nearly exhausted"
              description: "{{ $labels.instance }} has used {{ printf \"%.2f\" $value }}% of its memory for 30 minutes."

          - alert: NodeCPUHighUtilisation
            expr: |
              100 - (
                avg by (instance) (rate(node_cpu_seconds_total{job="integrations/unix",mode="idle"}[5m])) * 100
              ) > 90
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Node CPU is saturated"
              description: "{{ $labels.instance }} has been {{ printf \"%.2f\" $value }}% busy for 30 minutes."

          - alert: NodeHighLoad
            expr: |
              node_load5{job="integrations/unix"}
              / count by (instance) (node_cpu_seconds_total{job="integrations/unix",mode="idle"}) > 2
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Node run queue is more than 2x its CPU count"
              description: "{{ $labels.instance }} has a 5m load average of {{ printf \"%.2f\" $value }} per core."

  # ── Argo CD ───────────────────────────────────────────────────────────────
  # Several apps sit Progressing for long stretches by design (hdfs, trino,
  # nvidia-device-plugin, llama-cpp), so Progressing is deliberately not an
  # alerting state. rook-ceph-cluster flaps Degraded, hence the 30m `for`.
  argocd.yaml: |
    groups:
      - name: argocd
        interval: 1m
        rules:
          - alert: ArgoCDAppNotHealthy
            expr: |
              max by (name, project, dest_namespace) (
                argocd_app_info{health_status=~"Degraded|Missing|Unknown"}
              ) == 1
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Argo CD application is unhealthy"
              description: "Application {{ $labels.name }} (project {{ $labels.project }}, namespace {{ $labels.dest_namespace }}) has been unhealthy for 30 minutes."

          - alert: ArgoCDAppOutOfSync
            expr: |
              max by (name, project, dest_namespace) (
                argocd_app_info{sync_status="OutOfSync"}
              ) == 1
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Argo CD application has drifted from Git"
              description: "Application {{ $labels.name }} (project {{ $labels.project }}) has been OutOfSync for an hour — either self-heal is off or its sync keeps failing."

          - alert: ArgoCDAppSyncFailed
            expr: |
              sum by (name, project, dest_namespace, phase) (
                increase(argocd_app_sync_total{phase=~"Failed|Error"}[15m])
              ) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Argo CD sync failed"
              description: "Application {{ $labels.name }} recorded {{ printf \"%.0f\" $value }} {{ $labels.phase }} syncs in the last 15 minutes."

  # ── Ceph ──────────────────────────────────────────────────────────────────
  # Everything in this cluster with a PVC lands on Ceph, so its own alerts run
  # ahead of the per-workload ones. Fill levels are computed from raw byte
  # counters rather than ceph_pool_percent_used, whose units are ambiguous.
  ceph.yaml: |
    groups:
      - name: ceph
        interval: 1m
        rules:
          - alert: CephHealthError
            expr: ceph_health_status == 2
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Ceph cluster is in HEALTH_ERR"
              description: "The Ceph cluster has reported HEALTH_ERR for 15 minutes."

          - alert: CephHealthWarning
            expr: ceph_health_status == 1
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Ceph cluster is in HEALTH_WARN"
              description: "The Ceph cluster has reported HEALTH_WARN for an hour."

          - alert: CephOSDDown
            expr: ceph_osd_up == 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Ceph OSD is down"
              description: "{{ $labels.ceph_daemon }} has been down for 15 minutes."

          - alert: CephMonQuorumAtRisk
            expr: count(ceph_mon_quorum_status == 1) < 3
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Fewer than three Ceph monitors are in quorum"
              description: "Only {{ printf \"%.0f\" $value }} monitors are in quorum; one more failure loses the cluster."

          - alert: CephClusterNearFull
            expr: |
              ceph_cluster_total_used_bytes / ceph_cluster_total_bytes * 100 > 80
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Ceph cluster is more than 80% full"
              description: "Raw usage is {{ printf \"%.2f\" $value }}%. Ceph starts blocking writes near the full ratio."

          - alert: CephOSDNearFull
            expr: |
              ceph_osd_stat_bytes_used / ceph_osd_stat_bytes * 100 > 85
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Ceph OSD is more than 85% full"
              description: "{{ $labels.ceph_daemon }} is {{ printf \"%.2f\" $value }}% full; the cluster blocks writes once any OSD hits the full ratio."

          # HEALTH_WARN alerts only after an hour, and BLUESTORE_SLOW_OP_ALERT
          # is muted at the cluster level because it pins the cluster to
          # HEALTH_WARN on this hardware. This keeps the underlying signal at a
          # threshold that means something: ops still blocked after 30 minutes.
          - alert: CephSlowOps
            expr: ceph_healthcheck_slow_ops > 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Ceph has operations blocked for too long"
              description: "{{ printf \"%.0f\" $value }} OSD operations have been blocked for 30 minutes; every PVC-backed workload sees this as I/O stalls."

          - alert: CephPGsUnhealthy
            expr: |
              sum(ceph_pg_degraded + ceph_pg_undersized + ceph_pg_inconsistent
                + ceph_pg_down + ceph_pg_incomplete + ceph_pg_stale) > 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Ceph placement groups are not clean"
              description: "{{ printf \"%.0f\" $value }} PGs have been degraded, undersized, inconsistent, down, incomplete or stale for 30 minutes."

  # ── Observability stack ───────────────────────────────────────────────────
  # Mimir, Loki, Tempo and Alloy. These fail quietly: if Alloy stops writing or
  # the ruler stops evaluating, every other alert here silently stops working,
  # so the monitoring stack monitors itself.
  observability.yaml: |
    groups:
      - name: mimir
        interval: 1m
        rules:
          - alert: MimirRuleEvaluationFailing
            expr: |
              sum by (job) (rate(cortex_prometheus_rule_evaluation_failures_total[5m])) > 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Mimir ruler is failing to evaluate rules"
              description: "{{ $labels.job }} is failing rule evaluations, so the alerts in this file are not being computed."

          - alert: MimirAlertmanagerNotificationsFailing
            expr: |
              sum by (job, integration) (rate(cortex_alertmanager_notifications_failed_total[5m])) > 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Mimir Alertmanager cannot deliver notifications"
              description: "Notifications to {{ $labels.integration }} are failing, so firing alerts are not reaching Slack."

          # A ratio rather than "> 0": the ingesters continuously reject about
          # 1.5% of samples as err-mimir-sample-out-of-order across every job, so
          # an absolute threshold would fire forever. 5% catches a real
          # regression above that standing baseline.
          - alert: MimirIngestionFailing
            expr: |
              sum by (job) (rate(cortex_ingester_ingested_samples_failures_total[5m]))
              / sum by (job) (rate(cortex_ingester_ingested_samples_total[5m])) * 100 > 5
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Mimir is dropping samples on ingest"
              description: "{{ $labels.job }} is rejecting {{ printf \"%.2f\" $value }}% of incoming samples."

          # Mimir ingests through Kafka, and the failure that actually happened
          # here was the topic disappearing under the ingesters — Kafka itself
          # healthy, Grafana blank. The brokers export no metrics of their own
          # (no JMX exporter, only 9092/9093), so the reader side is the signal:
          # receive_delay is the age of a record when the ingester consumes it.
          - alert: MimirKafkaIngestDelayHigh
            expr: |
              sum(rate(cortex_ingest_storage_reader_receive_delay_seconds_sum[5m]))
              / sum(rate(cortex_ingest_storage_reader_receive_delay_seconds_count[5m])) > 30
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Mimir ingesters are falling behind Kafka"
              description: "Records are reaching the ingesters {{ printf \"%.0f\" $value }}s after they were produced; recent metrics are missing from queries."

          - alert: MimirKafkaFetchErrors
            expr: |
              sum by (job) (rate(cortex_ingest_storage_reader_fetch_errors_total[5m])) > 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Mimir cannot fetch from Kafka"
              description: "{{ $labels.job }} is failing Kafka fetches; the ingest path is broken even if the brokers look healthy."

          - alert: MimirRequestErrors
            expr: |
              sum by (job, route) (rate(cortex_request_duration_seconds_count{status_code=~"5.."}[5m]))
              / sum by (job, route) (rate(cortex_request_duration_seconds_count[5m])) * 100 > 5
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Mimir is returning 5xx responses"
              description: "{{ printf \"%.2f\" $value }}% of {{ $labels.route }} requests to {{ $labels.job }} are failing."

      - name: loki-tempo
        interval: 1m
        rules:
          - alert: LokiRequestErrors
            expr: |
              sum by (job, route) (rate(loki_request_duration_seconds_count{status_code=~"5.."}[5m]))
              / sum by (job, route) (rate(loki_request_duration_seconds_count[5m])) * 100 > 5
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Loki is returning 5xx responses"
              description: "{{ printf \"%.2f\" $value }}% of {{ $labels.route }} requests to {{ $labels.job }} are failing."

          - alert: TempoRequestErrors
            expr: |
              sum by (job, route) (rate(tempo_request_duration_seconds_count{status_code=~"5.."}[5m]))
              / sum by (job, route) (rate(tempo_request_duration_seconds_count[5m])) * 100 > 5
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Tempo is returning 5xx responses"
              description: "{{ printf \"%.2f\" $value }}% of {{ $labels.route }} requests to {{ $labels.job }} are failing."

          - alert: TempoCompactionFailing
            expr: sum(rate(tempodb_compaction_errors_total[5m])) > 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Tempo compaction is erroring"
              description: "Tempo has been failing block compaction for 30 minutes; trace storage will keep growing."

      - name: alloy
        interval: 1m
        rules:
          - alert: AlloyRemoteWriteFailing
            expr: |
              sum by (instance) (rate(prometheus_remote_storage_samples_failed_total[5m])) > 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Alloy cannot write metrics to Mimir"
              description: "Alloy on {{ $labels.instance }} is dropping samples on remote write; metrics from that node are incomplete."

  # ── Platform services ─────────────────────────────────────────────────────
  # The components everything else depends on: DNS, the API server, the CNI,
  # certificates and secret delivery.
  platform.yaml: |
    groups:
      - name: certificates
        interval: 1m
        rules:
          - alert: CertificateExpiringSoon
            expr: |
              certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 24 * 3600
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Certificate expires in less than 14 days"
              description: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ printf \"%.1f\" $value }} seconds and has not renewed."

          - alert: CertificateNotReady
            expr: certmanager_certificate_ready_status{condition="True"} == 0
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Certificate is not ready"
              description: "Certificate {{ $labels.namespace }}/{{ $labels.name }} issued by {{ $labels.issuer_name }} has not been ready for an hour."

      - name: secrets
        interval: 1m
        rules:
          - alert: ExternalSecretNotReady
            expr: |
              max by (namespace, name) (
                externalsecret_status_condition{condition="Ready",status="false"}
              ) == 1
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "ExternalSecret is not syncing from Vault"
              description: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} has been not-Ready for 30 minutes; the Secret it backs is stale or missing."

      - name: cluster-services
        interval: 1m
        rules:
          - alert: KubeAPIServerErrors
            expr: |
              sum(rate(apiserver_request_total{code=~"5.."}[5m]))
              / sum(rate(apiserver_request_total[5m])) * 100 > 5
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "API server is returning 5xx responses"
              description: "{{ printf \"%.2f\" $value }}% of API server requests are failing."

          - alert: CoreDNSServerFailures
            expr: |
              sum(rate(coredns_dns_responses_total{rcode="SERVFAIL"}[5m]))
              / sum(rate(coredns_dns_responses_total[5m])) * 100 > 5
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "CoreDNS is returning SERVFAIL"
              description: "{{ printf \"%.2f\" $value }}% of DNS responses are SERVFAIL; in-cluster service discovery is degraded."

          - alert: CiliumUnreachableNodes
            expr: max by (instance) (cilium_unreachable_nodes) > 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Cilium reports unreachable nodes"
              description: "The Cilium agent on {{ $labels.instance }} cannot reach {{ printf \"%.0f\" $value }} other nodes; pod-to-pod traffic across them is broken."

  # ── Workloads ─────────────────────────────────────────────────────────────
  # The workloads that export their own metrics. Anything not listed here
  # (superset, jupyter, openwebui, dbeaver, headlamp) has no exporter and is
  # covered by the Kubernetes rules.
  #
  # Label shapes differ sharply by exporter and are not interchangeable:
  # postgres-cluster carries namespace/pod/datname, redis carries a redis_set
  # added by an Alloy relabel, and mysql/scylladb/clickhouse/hive/rook-ceph
  # carry only instance. Scylla additionally reports almost everything
  # per-shard, so every rule below aggregates the shard away.
  workloads.yaml: |
    groups:
      - name: postgres
        interval: 1m
        rules:
          - alert: PostgresInstanceDown
            expr: cnpg_collector_up == 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "PostgreSQL instance is unreachable"
              description: "The CNPG collector cannot reach {{ $labels.namespace }}/{{ $labels.pod }}."

          - alert: PostgresReplicationLagHigh
            expr: cnpg_pg_replication_lag > 300
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "PostgreSQL replica is more than 5 minutes behind"
              description: "{{ $labels.namespace }}/{{ $labels.pod }} is {{ printf \"%.0f\" $value }}s behind the primary."

          # state="idle" backends hold no transaction, so their duration is
          # meaningless; "idle in transaction" is exactly what this should
          # catch and is a different state string, so only plain idle is
          # excluded.
          - alert: PostgresLongRunningTransaction
            expr: |
              max by (namespace, pod, datname, usename) (
                cnpg_backends_max_tx_duration_seconds{state!="idle"}
              ) > 300
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "PostgreSQL transaction has been open for too long"
              description: "A {{ $labels.usename }} transaction on {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.datname }}) has been open {{ printf \"%.0f\" $value }}s, holding locks and blocking vacuum."

          - alert: PostgresBackendsWaitingOnLocks
            expr: max by (namespace, pod) (cnpg_backends_waiting_total) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "PostgreSQL backends are blocked on locks"
              description: "{{ printf \"%.0f\" $value }} backends on {{ $labels.namespace }}/{{ $labels.pod }} have been waiting on locks for 15 minutes."

          - alert: PostgresDeadlocks
            expr: |
              max by (namespace, pod, datname) (
                increase(cnpg_pg_stat_database_deadlocks[15m])
              ) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "PostgreSQL detected deadlocks"
              description: "{{ printf \"%.0f\" $value }} deadlocks in {{ $labels.datname }} on {{ $labels.namespace }}/{{ $labels.pod }} in the last 15 minutes; one transaction was aborted for each."

          - alert: PostgresConnectionsNearLimit
            expr: |
              sum by (namespace, pod) (cnpg_backends_total)
              / on (namespace, pod) group_left()
                max by (namespace, pod) (cnpg_pg_settings_setting{name="max_connections"})
              * 100 > 80
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "PostgreSQL is close to max_connections"
              description: "{{ $labels.namespace }}/{{ $labels.pod }} is using {{ printf \"%.1f\" $value }}% of its connection slots; new connections are refused at 100%."

          # autovacuum_freeze_max_age defaults to 200M, at which point Postgres
          # forces an aggressive vacuum; past 2^31 it refuses writes entirely.
          - alert: PostgresTransactionIDWraparoundRisk
            expr: |
              max by (namespace, pod, datname) (cnpg_pg_database_xid_age) > 150000000
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "PostgreSQL transaction IDs are approaching wraparound"
              description: "Database {{ $labels.datname }} on {{ $labels.namespace }}/{{ $labels.pod }} has an XID age of {{ printf \"%.0f\" $value }}; vacuum is not keeping up."

          # Archiver metrics only exist on the primary, so this needs no
          # in-recovery filter — replicas simply do not produce the series.
          - alert: PostgresWALArchiveFailing
            expr: |
              max by (namespace, pod) (increase(cnpg_pg_stat_archiver_failed_count[15m])) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "PostgreSQL is failing to archive WAL"
              description: "{{ $labels.namespace }}/{{ $labels.pod }} recorded {{ printf \"%.0f\" $value }} WAL archive failures in 15 minutes; WAL accumulates on disk until this clears."

          - alert: PostgresCollectorError
            expr: max by (namespace, pod) (cnpg_collector_last_collection_error) > 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "CNPG metrics collector is erroring"
              description: "The collector on {{ $labels.namespace }}/{{ $labels.pod }} is failing its queries, so the Postgres rules above are running on stale data."

      - name: mysql
        interval: 1m
        rules:
          - alert: MySQLDown
            expr: mysql_up == 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "MySQL is unreachable"
              description: "mysqld-exporter has been unable to connect to MySQL at {{ $labels.instance }} for 10 minutes."

          # Slow_queries counts every statement exceeding long_query_time (10s
          # here) and increments whether or not the slow query log is enabled —
          # it is off on this server, so this counter is the only slow-query
          # signal available. Per-statement detail would need
          # --collect.perf_schema.eventsstatements on the exporter.
          - alert: MySQLSlowQueries
            expr: rate(mysql_global_status_slow_queries[15m]) * 60 > 5
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "MySQL is running slow queries"
              description: "{{ $labels.instance }} is logging {{ printf \"%.1f\" $value }} queries per minute over long_query_time."

          - alert: MySQLConnectionsNearLimit
            expr: |
              mysql_global_status_threads_connected
              / mysql_global_variables_max_connections * 100 > 80
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "MySQL is close to max_connections"
              description: "{{ $labels.instance }} is using {{ printf \"%.1f\" $value }}% of its connection slots; new connections are refused at 100%."

          # A row lock that is still contended 15 minutes later is a stuck
          # transaction, not normal contention.
          - alert: MySQLRowLockWaitStuck
            expr: mysql_global_status_innodb_row_lock_current_waits > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "InnoDB row locks have been contended for 15 minutes"
              description: "{{ printf \"%.0f\" $value }} transactions on {{ $labels.instance }} are waiting on row locks; something is holding a transaction open."

          - alert: MySQLAbortedConnects
            expr: rate(mysql_global_status_aborted_connects[15m]) * 60 > 5
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "MySQL is rejecting connection attempts"
              description: "{{ $labels.instance }} is aborting {{ printf \"%.1f\" $value }} connections per minute — failed authentication, or clients dropping mid-handshake."

          - alert: MySQLExporterCollectorFailing
            expr: mysql_exporter_collector_success == 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "mysqld-exporter collector is failing"
              description: "The {{ $labels.collector }} collector on {{ $labels.instance }} is erroring, so the metrics it feeds are stale or absent."

      - name: scylladb
        interval: 1m
        rules:
          # operation_mode 3 is NORMAL; anything else is joining, draining or
          # already gone.
          - alert: ScyllaNodeNotNormal
            expr: scylla_node_operation_mode != 3
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "ScyllaDB node is not in NORMAL mode"
              description: "Scylla node {{ $labels.instance }} has been in operation mode {{ printf \"%.0f\" $value }} for 15 minutes."

          # operation_mode only describes the local node. Gossip is how a node
          # notices its peers dying, so this fires on the survivors.
          - alert: ScyllaNodeUnreachable
            expr: max by (instance) (scylla_gossip_unreachable) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "ScyllaDB node cannot reach its peers"
              description: "{{ $labels.instance }} reports {{ printf \"%.0f\" $value }} unreachable peers via gossip."

          # Bulk loads legitimately queue compactions, hence the hour. A
          # backlog that never drains means compaction cannot keep up with
          # writes, and read latency degrades as SSTable count grows.
          - alert: ScyllaCompactionBacklog
            expr: max by (instance) (scylla_compaction_manager_pending_compactions) > 20
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "ScyllaDB compaction is falling behind"
              description: "{{ $labels.instance }} has had {{ printf \"%.0f\" $value }} compactions queued for an hour; SSTable count and read latency will keep climbing."

          - alert: ScyllaCompactionsFailing
            expr: |
              max by (instance) (increase(scylla_compaction_manager_failed_compactions[15m])) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "ScyllaDB compactions are failing"
              description: "{{ $labels.instance }} recorded {{ printf \"%.0f\" $value }} failed compactions in 15 minutes; disk space will not be reclaimed."

          # Hints are writes buffered for a replica that was unreachable at
          # write time. Accumulating hints mean a peer has been down long
          # enough to matter.
          - alert: ScyllaHintsAccumulating
            expr: max by (instance) (scylla_hints_manager_size_of_hints_in_progress) > 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "ScyllaDB is buffering hinted handoffs"
              description: "{{ $labels.instance }} has been holding hints for an unreachable replica for 30 minutes; those writes are not yet on every replica."

          - alert: ScyllaRequestsShed
            expr: sum by (instance) (rate(scylla_transport_requests_shed[5m])) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "ScyllaDB is shedding CQL requests"
              description: "{{ $labels.instance }} is rejecting {{ printf \"%.2f\" $value }} requests/s because it is over its memory or concurrency limit."

          # Scylla latency histograms are in microseconds — the top bucket is
          # 33554432 (~33s), not seconds. 100000 is 100ms.
          - alert: ScyllaReadLatencyHigh
            expr: |
              histogram_quantile(0.99,
                sum by (instance, le) (rate(scylla_storage_proxy_coordinator_read_latency_bucket[5m]))
              ) > 100000
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "ScyllaDB p99 read latency is above 100ms"
              description: "{{ $labels.instance }} is serving p99 reads in {{ printf \"%.0f\" $value }}µs."

          - alert: ScyllaWriteLatencyHigh
            expr: |
              histogram_quantile(0.99,
                sum by (instance, le) (rate(scylla_storage_proxy_coordinator_write_latency_bucket[5m]))
              ) > 100000
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "ScyllaDB p99 write latency is above 100ms"
              description: "{{ $labels.instance }} is serving p99 writes in {{ printf \"%.0f\" $value }}µs."

      - name: clickhouse
        interval: 1m
        rules:
          # No replicated tables exist yet (AttachedReplicatedTable is 0 and
          # there is no Keeper session), so these two cannot fire today. They
          # stay because they are the rules that matter the moment a
          # ReplicatedMergeTree table is created.
          - alert: ClickHouseReadonlyReplica
            expr: ClickHouseMetrics_ReadonlyReplica > 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "ClickHouse has read-only replicated tables"
              description: "{{ printf \"%.0f\" $value }} tables on {{ $labels.instance }} are read-only, which normally means Keeper is unreachable."

          - alert: ClickHouseReplicationDelay
            expr: ClickHouseAsyncMetrics_ReplicasMaxAbsoluteDelay > 300
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "ClickHouse replication is more than 5 minutes behind"
              description: "{{ $labels.instance }} has a maximum replica delay of {{ printf \"%.0f\" $value }}s."

          # An absolute count rather than a failed/total ratio: query volume
          # here is low enough that one failure out of three would read as 33%.
          - alert: ClickHouseQueryFailures
            expr: increase(ClickHouseProfileEvents_FailedQuery[15m]) > 5
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "ClickHouse queries are failing"
              description: "{{ $labels.instance }} failed {{ printf \"%.0f\" $value }} queries in the last 15 minutes."

          # MergeTree inserts create one part each and merges reduce them.
          # Parts climbing means merges are losing; ClickHouse first throttles
          # inserts and then rejects them outright.
          - alert: ClickHouseTooManyParts
            expr: ClickHouseAsyncMetrics_MaxPartCountForPartition > 200
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "ClickHouse partition has too many parts"
              description: "The busiest partition on {{ $labels.instance }} has {{ printf \"%.0f\" $value }} parts; merges are not keeping up with inserts."

          - alert: ClickHouseDelayedInserts
            expr: ClickHouseMetrics_DelayedInserts > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "ClickHouse is throttling inserts"
              description: "{{ printf \"%.0f\" $value }} inserts on {{ $labels.instance }} are being delayed because there are too many parts."

      - name: redis
        interval: 1m
        rules:
          # Only replicas export master_link_up, so this is inherently scoped
          # to them.
          - alert: RedisReplicaLinkDown
            expr: redis_master_link_up == 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Redis replica has lost its master"
              description: "{{ $labels.instance }} has been disconnected from master {{ $labels.master_host }} for 15 minutes and is serving stale data."

          - alert: RedisSentinelQuorumAtRisk
            expr: max by (master_name) (redis_sentinel_master_ckquorum_status) == 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Redis sentinels cannot reach quorum"
              description: "Sentinel reports quorum unreachable for {{ $labels.master_name }}; an automatic failover would not succeed."

          # The value is 1 only while master_status is "ok"; any other state
          # (sdown, odown, failover) reports 0 and carries a different
          # master_status label, so this must test the value, not the label.
          - alert: RedisSentinelMasterNotOk
            expr: max by (master_name) (redis_sentinel_master_status) == 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Redis sentinel reports the master is not ok"
              description: "Sentinel has flagged the master for {{ $labels.master_name }} as not ok for 15 minutes."

          - alert: RedisReplicasMissing
            expr: min by (master_name) (redis_sentinel_master_ok_slaves) < 2
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Redis has fewer healthy replicas than expected"
              description: "Sentinel sees {{ printf \"%.0f\" $value }} healthy replicas for {{ $labels.master_name }}; the replication set is meant to run three nodes."

          - alert: RedisPersistenceFailing
            expr: redis_rdb_last_bgsave_status == 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Redis background save is failing"
              description: "The last RDB save on {{ $labels.instance }} failed; a restart would lose everything written since the previous successful save."

          - alert: RedisKeysEvicted
            expr: increase(redis_evicted_keys_total[15m]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Redis is evicting keys"
              description: "{{ $labels.instance }} evicted {{ printf \"%.0f\" $value }} keys in 15 minutes; it is at its memory limit and silently dropping data."

          - alert: RedisExporterScrapeError
            expr: redis_exporter_last_scrape_error > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "redis-exporter cannot query Redis"
              description: "The exporter on {{ $labels.instance }} is failing its scrape, so the Redis rules above are blind."

      - name: hive
        interval: 1m
        rules:
          # The metastore is a single replica with a small heap and has been
          # restarting; Trino, Spark and Hive all stall when it goes.
          - alert: HiveMetastoreHeapHigh
            expr: |
              metrics_memory_heap_used_value / metrics_memory_heap_max_value * 100 > 90
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Hive metastore heap is nearly full"
              description: "The metastore JVM at {{ $labels.instance }} has used {{ printf \"%.1f\" $value }}% of its heap for 30 minutes and is heading for an OOM."

          - alert: HiveMetastoreGCPauses
            expr: increase(metrics_jvm_pause_warn_threshold_count[15m]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Hive metastore is pausing on GC"
              description: "The metastore JVM at {{ $labels.instance }} recorded {{ printf \"%.0f\" $value }} pauses over its warn threshold in 15 minutes; metastore calls block for the duration."

      - name: airflow
        interval: 1m
        rules:
          # Airflow reports through statsd, so these are counters that only
          # advance while the component is alive. A component that hangs
          # without exiting keeps its pod Ready and is invisible to the
          # Kubernetes rules — a flat heartbeat is the only way to see it.
          - alert: AirflowSchedulerNotHeartbeating
            expr: rate(airflow_scheduler_heartbeat[10m]) == 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Airflow scheduler has stopped heartbeating"
              description: "No scheduler heartbeats for 15 minutes; nothing is being scheduled even though the pod is still Running."

          - alert: AirflowDagProcessorNotHeartbeating
            expr: rate(airflow_dag_processor_heartbeat[10m]) == 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Airflow DAG processor has stopped heartbeating"
              description: "DAG files are no longer being parsed, so new and edited DAGs will not appear."

          - alert: AirflowTriggererNotHeartbeating
            expr: rate(airflow_triggerer_heartbeat[10m]) == 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Airflow triggerer has stopped heartbeating"
              description: "Deferred tasks will stay deferred until the triggerer resumes."

          - alert: AirflowTasksStarving
            expr: airflow_scheduler_tasks_starving > 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Airflow tasks cannot get a pool slot"
              description: "{{ printf \"%.0f\" $value }} tasks have been starving for 30 minutes — schedulable, but with no pool slot free."

          # The statsd exporter publishes this both with a pool label and
          # flattened into the metric name; the label filter keeps one series
          # per pool instead of double-firing.
          - alert: AirflowPoolExhausted
            expr: airflow_pool_open_slots{pool!=""} == 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Airflow pool has no free slots"
              description: "Pool {{ $labels.pool }} has been fully allocated for 30 minutes; queued tasks are not starting."

          - alert: AirflowExecutorSlotsExhausted
            expr: airflow_executor_open_slots == 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Airflow executor has no free slots"
              description: "The executor has been at capacity for 30 minutes; task instances are queuing."

      - name: spark
        interval: 1m
        rules:
          - alert: SparkOperatorReconcileErrors
            expr: |
              sum by (controller) (rate(controller_runtime_reconcile_errors_total{job="spark"}[15m])) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Spark operator is failing reconciles"
              description: "The {{ $labels.controller }} controller is erroring; SparkApplications will not progress."

          - alert: SparkOperatorWorkqueueBacklog
            expr: max by (controller) (workqueue_depth{job="spark"}) > 10
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Spark operator work queue is backing up"
              description: "The {{ $labels.controller }} queue has held {{ printf \"%.0f\" $value }} items for 30 minutes; the operator is not keeping up."

      - name: llama-cpp
        interval: 1m
        rules:
          # llama-server runs a fixed number of slots. Deferred requests mean
          # every slot is busy and callers are queuing behind them, which
          # surfaces to LiteLLM as latency rather than as an error.
          - alert: LlamaCppRequestsDeferred
            expr: max by (model) (llamacpp:requests_deferred) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "llama.cpp requests are queuing"
              description: "{{ $labels.model }} has had {{ printf \"%.0f\" $value }} requests waiting for a free slot for 15 minutes."

      - name: hdfs
        interval: 1m
        rules:
          # Only the Hadoop_NameNode_StorageTypeStats_* series are usable: the
          # rest of the namenode's JMX output is exported with the sample value
          # appended to the metric name (hadoop_namenode_..._MissingBlocks:_0),
          # so it cannot be queried numerically.
          - alert: HDFSCapacityLow
            expr: |
              Hadoop_NameNode_StorageTypeStats_capacityRemaining
              / Hadoop_NameNode_StorageTypeStats_capacityTotal * 100 < 15
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "HDFS has less than 15% capacity left"
              description: "HDFS reports {{ printf \"%.2f\" $value }}% remaining capacity."

          - alert: HDFSNoDataNodesInService
            expr: Hadoop_NameNode_StorageTypeStats_nodesInService < 1
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "HDFS has no datanodes in service"
              description: "The namenode reports {{ printf \"%.0f\" $value }} datanodes in service; HDFS cannot serve reads or writes."

      # Only the trino_memory_ClusterMemoryPool_*, trino_execution_* and
      # trino_plugin_* families survive the JMX exporter intact. Query-level
      # counters (trino_query_manager_FailedQueries, QueuedQueries) are
      # exported with the sample value appended to the metric name
      # (trino_query_manager_FailedQueries_TotalCount:_0), so failed-query
      # alerting is not possible until that exporter config is fixed.
      - name: trino
        interval: 1m
        rules:
          - alert: TrinoNoWorkers
            expr: trino_memory_ClusterMemoryPool_Nodes < 1
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Trino has no nodes in its memory pool"
              description: "The {{ $labels.name }} memory pool reports {{ printf \"%.0f\" $value }} nodes; queries cannot be scheduled."

          # A blocked node is one whose memory pool is full: queries assigned
          # to it stop making progress rather than failing.
          - alert: TrinoMemoryPoolBlocked
            expr: max by (name) (trino_memory_ClusterMemoryPool_BlockedNodes) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Trino nodes are blocked on memory"
              description: "{{ printf \"%.0f\" $value }} nodes in the {{ $labels.name }} pool have been out of memory for 15 minutes; queries on them are stalled."

      - name: ray
        interval: 1m
        rules:
          - alert: RayClusterNoActiveNodes
            expr: max by (node_type) (ray_cluster_active_nodes) < 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Ray node group has no active nodes"
              description: "The Ray {{ $labels.node_type }} group has no active nodes."

          - alert: RayWorkerStartupFailing
            expr: sum(increase(ray_scheduler_failed_worker_startup_total[15m])) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Ray worker processes are failing to start"
              description: "Ray recorded {{ printf \"%.0f\" $value }} failed worker startups in the last 15 minutes."
