# ── Scrape targets ──────────────────────────────────────────────────────────
# The broadest net: every exporter Alloy scrapes. A target that stops
# answering is either the workload being down or its metrics path breaking,
# and both are worth knowing about.
#
# external/node is excluded because external.yaml pages on those hosts at
# critical after 10m, so the broad net would only add a second, weaker
# notification five minutes behind it. external/llama-cpp is excluded because
# Alloy scrapes every listed model and an idle one answers 400, so up=0 there
# means "not loaded", not "down".

groups:
  - name: targets
    interval: 1m
    rules:
      - alert: TargetDown
        expr: up{job!~"external/(node|llama-cpp)"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Scrape target is down"
          description: "Alloy has failed to scrape {{ $labels.instance }} for job {{ $labels.job }} for 15 minutes."
