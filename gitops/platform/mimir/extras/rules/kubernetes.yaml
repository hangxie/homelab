# ── Kubernetes workloads ────────────────────────────────────────────────────
# kube-state-metrics covers every workload in the cluster, including the ones
# that export no metrics of their own (superset, jupyter, openwebui, dbeaver,
# headlamp). These rules are the only alerting those services get, so they
# stay generic on purpose; everything else is also covered by its own rules
# under workloads.yaml.

groups:
  - name: kubernetes-workloads
    interval: 1m
    rules:
      - alert: KubePodCrashLooping
        expr: |
          max by (namespace, pod, container) (
            kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}
          ) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pod is crash looping"
          description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has been in CrashLoopBackOff for 15 minutes."

      - alert: KubePodContainerWaiting
        expr: |
          max by (namespace, pod, container, reason) (
            kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError|InvalidImageName"}
          ) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Container cannot start"
          description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has been waiting on {{ $labels.reason }} for 15 minutes."

      # Job-owned pods legitimately end up Failed and are never retried, so
      # they are excluded rather than alerted on here — KubeJobFailed covers
      # them with the Job's own identity.
      - alert: KubePodNotReady
        expr: |
          max by (namespace, pod) (
            max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"} == 1)
            * on (namespace, pod) group_left(owner_kind)
              topk by (namespace, pod) (
                1, max by (namespace, pod, owner_kind) (kube_pod_owner{owner_kind!="Job"})
              )
          ) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Pod has been in a non-ready state for 30 minutes"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has not reached Running for 30 minutes."

      - alert: KubeContainerOOMKilled
        expr: |
          max by (namespace, pod, container) (
            increase(container_oom_events_total{container!=""}[15m])
          ) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Container was OOMKilled"
          description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} hit its memory limit and was killed in the last 15 minutes."

      # The changes() clause suppresses the alert while a rollout is still
      # replacing pods; only a Deployment that has stopped converging fires.
      - alert: KubeDeploymentReplicasMismatch
        expr: |
          (
            max by (namespace, deployment) (kube_deployment_spec_replicas)
            != max by (namespace, deployment) (kube_deployment_status_replicas_available)
          )
          and
          (
            max by (namespace, deployment) (changes(kube_deployment_status_replicas_updated[10m])) == 0
          )
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "Deployment has not matched its desired replica count"
          description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has {{ printf \"%.0f\" $value }} available replicas, fewer than desired, and has stopped rolling out."

      - alert: KubeStatefulSetReplicasMismatch
        expr: |
          (
            max by (namespace, statefulset) (kube_statefulset_replicas)
            != max by (namespace, statefulset) (kube_statefulset_status_replicas_ready)
          )
          and
          (
            max by (namespace, statefulset) (changes(kube_statefulset_status_replicas_updated[10m])) == 0
          )
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "StatefulSet has not matched its desired replica count"
          description: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has {{ printf \"%.0f\" $value }} ready replicas, fewer than desired, and has stopped rolling out."

      - alert: KubeDaemonSetNotFullyScheduled
        expr: |
          max by (namespace, daemonset) (kube_daemonset_status_number_unavailable) > 0
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "DaemonSet pods are unavailable"
          description: "DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} has {{ printf \"%.0f\" $value }} unavailable pods."

      - alert: KubeJobFailed
        expr: |
          max by (namespace, job_name) (kube_job_status_failed) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Job failed to complete"
          description: "Job {{ $labels.namespace }}/{{ $labels.job_name }} has {{ printf \"%.0f\" $value }} failed pods."

  - name: kubernetes-storage
    interval: 1m
    rules:
      - alert: KubePersistentVolumeFillingUp
        expr: |
          kubelet_volume_stats_available_bytes
          / kubelet_volume_stats_capacity_bytes * 100 < 15
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "PersistentVolume has less than 15% space left"
          description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has only {{ printf \"%.2f\" $value }}% free."

      - alert: KubePersistentVolumeFillingUp
        expr: |
          kubelet_volume_stats_available_bytes
          / kubelet_volume_stats_capacity_bytes * 100 < 5
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "PersistentVolume has less than 5% space left"
          description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has only {{ printf \"%.2f\" $value }}% free."

      # The byte rules above miss inode exhaustion, which surfaces as
      # ENOSPC with free space still showing. Block volumes report zero
      # inodes, hence the > 0 guard.
      - alert: KubePersistentVolumeOutOfInodes
        expr: |
          kubelet_volume_stats_inodes_free / kubelet_volume_stats_inodes * 100 < 10
          and kubelet_volume_stats_inodes > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "PersistentVolume has less than 10% inodes left"
          description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has only {{ printf \"%.2f\" $value }}% free inodes."

      - alert: KubePersistentVolumeClaimPending
        expr: |
          max by (namespace, persistentvolumeclaim) (
            kube_persistentvolumeclaim_status_phase{phase=~"Pending|Lost"}
          ) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PersistentVolumeClaim is not bound"
          description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has been unbound for 15 minutes."

  - name: kubernetes-nodes
    interval: 1m
    rules:
      - alert: KubeNodeNotReady
        expr: |
          max by (node) (kube_node_status_condition{condition="Ready",status="true"}) == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Node is not ready"
          description: "Node {{ $labels.node }} has been NotReady for 15 minutes."

      - alert: KubeNodeUnderPressure
        expr: |
          max by (node, condition) (
            kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure",status="true"}
          ) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Node reports resource pressure"
          description: "Node {{ $labels.node }} has been reporting {{ $labels.condition }} for 15 minutes."
