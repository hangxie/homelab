# Provision Mimir's buckets in the mimir namespace. For each claim Rook creates
# the bucket and drops a like-named Secret here with AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY. sync-wave: "-1" ensures the Secrets exist before the
# Mimir StatefulSets start.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: mimir-blocks
  namespace: mimir
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  bucketName: mimir-blocks
  storageClassName: rook-ceph-bucket
---
# Holds Alertmanager silences and the notification log. The ruler needs no
# bucket — its rule groups are mounted from the mimir-ruler-rules ConfigMap.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: mimir-alertmanager
  namespace: mimir
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  bucketName: mimir-alertmanager
  storageClassName: rook-ceph-bucket
