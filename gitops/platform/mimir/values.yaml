# Basic HA deployment for homelab.
# Disable zone-aware replication throughout (requires 3+ zones).
# S3 credentials come from the mimir-blocks OBC Secret (mimir namespace).

metaMonitoring:
  dashboards:
    enabled: true
    namespace: grafana
    annotations:
      k8s-sidecar-target-directory: /tmp/dashboards/Mimir

mimir:
  structuredConfig:
    common:
      storage:
        backend: s3
        s3:
          endpoint: rook-ceph-rgw-object-store.rook-ceph.svc:80
          region: us-east-1
          insecure: true
          access_key_id: ${AWS_ACCESS_KEY_ID}
          secret_access_key: ${AWS_SECRET_ACCESS_KEY}
    blocks_storage:
      s3:
        bucket_name: mimir-blocks
    # The chart only fills these in when the bundled MinIO is enabled, so they
    # have to be set explicitly against Ceph RGW. Both inherit common.storage.
    alertmanager_storage:
      s3:
        bucket_name: mimir-alertmanager
    alertmanager:
      sharding_ring:
        # Matches the 2 replicas; the 3 default would never reach quorum here.
        replication_factor: 2
      # Written by the render-fallback-config init container with the Slack
      # webhook substituted in; the chart's own /configs copy is the template.
      fallback_config_file: /rendered/alertmanager_fallback_config.yaml
    # Rules are mounted from a ConfigMap, so the ruler needs no bucket at all.
    ruler_storage:
      backend: local
      local:
        directory: /rules
    ingester:
      ring:
        replication_factor: 2
    store_gateway:
      sharding_ring:
        replication_factor: 2
    limits:
      ingestion_rate: 100000
      ingestion_burst_size: 2000000
      max_global_series_per_user: 2000000
      # Delete metric blocks older than 2 days (compactor enforces this).
      compactor_blocks_retention_period: 2d

ingester:
  replicas: 2
  zoneAwareReplication:
    enabled: false
  extraEnvFrom:
    - secretRef:
        name: mimir-blocks
  # Ingesters were ~29% of client RBD writes, which EC 2+1 amplifies ~25x in
  # IOPS. ingest_storage is on, so an ingester rebuilds its TSDB by replaying
  # Kafka — Ceph redundancy buys nothing. local-path also lands on the PLP SSD.
  # It does NOT enforce this size: unquota'd hostPath on the node root disk,
  # which has hit DiskPressure before. Steady usage is <1Gi.
  persistentVolume:
    storageClass: local-path
    size: 10Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: ingester
          topologyKey: kubernetes.io/hostname

store_gateway:
  replicas: 2
  zoneAwareReplication:
    enabled: false
  extraEnvFrom:
    - secretRef:
        name: mimir-blocks
  persistentVolume:
    storageClass: rook-ceph-block
    size: 10Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: store-gateway
          topologyKey: kubernetes.io/hostname

compactor:
  replicas: 1
  extraEnvFrom:
    - secretRef:
        name: mimir-blocks
  persistentVolume:
    storageClass: rook-ceph-block
    size: 30Gi

distributor:
  replicas: 2
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: distributor
          topologyKey: kubernetes.io/hostname

querier:
  replicas: 2
  extraEnvFrom:
    - secretRef:
        name: mimir-blocks
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: querier
          topologyKey: kubernetes.io/hostname

query_frontend:
  replicas: 2
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: query-frontend
          topologyKey: kubernetes.io/hostname

# Alerting lives here rather than in Grafana's embedded Alertmanager: the ruler
# evaluates the rules and the alertmanager owns routing to Slack. Grafana is a
# read-only UI over both (see the Alertmanager datasource in the grafana chart).
alertmanager:
  enabled: true
  replicas: 2
  zoneAwareReplication:
    enabled: false
  # Silences and the notification log persist to the bucket, so a rescheduled
  # replica does not re-notify for alerts a peer already sent.
  extraEnvFrom:
    - secretRef:
        name: mimir-alertmanager
  persistentVolume:
    storageClass: rook-ceph-block
    size: 2Gi
  # Mimir applies -config.expand-env only to -config.file, NOT to the fallback
  # config, and it rejects Alertmanager's api_url_file for tenant configs. So
  # the webhook is substituted into a copy of the config before Mimir starts,
  # and mimir.structuredConfig points fallback_config_file at the copy. The
  # ConfigMap on disk keeps the ${SLACK_WEBHOOK_URL} placeholder.
  initContainers:
    - name: render-fallback-config
      image: busybox:1.37
      command:
        - sh
        - -c
        - >-
          sed "s|\${SLACK_WEBHOOK_URL}|${SLACK_WEBHOOK_URL}|"
          /configs/alertmanager_fallback_config.yaml
          > /rendered/alertmanager_fallback_config.yaml
      envFrom:
        - secretRef:
            name: mimir-slack
      volumeMounts:
        - name: alertmanager-fallback-config
          mountPath: /configs
        - name: rendered-fallback-config
          mountPath: /rendered
  extraVolumes:
    - name: rendered-fallback-config
      emptyDir: {}
  extraVolumeMounts:
    - name: rendered-fallback-config
      mountPath: /rendered
      readOnly: true
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: alertmanager
          topologyKey: kubernetes.io/hostname
  # Used for any tenant without an uploaded config — with multitenancy off that
  # is the only tenant ("anonymous"), so this is effectively *the* config and
  # stays declarative in Git. ${SLACK_WEBHOOK_URL} is expanded from the env
  # supplied by the mimir-slack Secret, keeping the URL out of the ConfigMap.
  fallbackConfig: |
    route:
      receiver: slack
      group_by: [alertname, severity]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    # Several rules come as a warning/critical pair on the same alertname and the
    # same series (filesystem and PVC fill levels). Without this both fire, since
    # the route groups by severity. Labels absent from an alert compare equal as
    # empty strings, so one rule covers every pair.
    inhibit_rules:
      - source_matchers: [severity = critical]
        target_matchers: [severity = warning]
        equal: [alertname, instance, device, namespace, persistentvolumeclaim]
    receivers:
      - name: slack
        slack_configs:
          - api_url: ${SLACK_WEBHOOK_URL}
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: |
              {{ range .Alerts -}}
              *{{ .Labels.alertname }}* ({{ .Labels.severity }})
              {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}

ruler:
  enabled: true
  replicas: 2
  # The ruler evaluates queries through its own embedded querier, so it needs
  # the blocks bucket credentials the same way the querier does.
  extraEnvFrom:
    - secretRef:
        name: mimir-blocks
  # Rule groups come from a ConfigMap rather than the ruler's object-storage
  # backend, so they stay in Git and are pruned by Argo CD like any other
  # manifest. Local storage is read-only: the ruler config API cannot write.
  extraVolumes:
    - name: rules
      configMap:
        name: mimir-ruler-rules
  extraVolumeMounts:
    - name: rules
      mountPath: /rules/anonymous
      readOnly: true
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: ruler
          topologyKey: kubernetes.io/hostname

# Disable the MinIO dependency (using Ceph RGW instead).
minio:
  enabled: false

kafka:
  replicas: 3
  securityContext:
    fsGroupChangePolicy: OnRootMismatch
  persistence:
    # Node-local disk. Kafka is a transient ingest buffer here — every durable
    # block already lives in the mimir-blocks bucket — and it was ~77% of all
    # RBD client writes. Keeping it off rook-ceph-block also keeps it off the
    # EC 2+1 data pool, where a partial-stripe write costs a read-modify-write
    # on all three OSDs, which share one physical disk.
    storageClassName: local-path
    size: 16Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: kafka
          topologyKey: kubernetes.io/hostname
  extraEnv:
    # Bound each active partition when the chart's hardcoded 24h time-based
    # retention lags behind ingestion. local-path is an unquota'd hostPath, so
    # this is the only thing keeping Kafka off the node root filesystem: with
    # replication factor 2 and 2 active partitions a single broker can hold two
    # replicas, so the worst case is 2 x 6Gi plus metadata — inside the claim
    # above. At ~515 KB/s per partition 6Gi is a ~3h20m replay window, well
    # clear of the 2h TSDB block period.
    - name: KAFKA_LOG_RETENTION_BYTES
      value: "6442450944" # 6Gi
    - name: KAFKA_DEFAULT_REPLICATION_FACTOR
      value: "2"
