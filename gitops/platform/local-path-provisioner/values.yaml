# Node-local storage for workloads whose on-disk state is transient and
# regenerable — ingester WALs, ingest buffers, scratch dirs. Ceph replicates
# every write across three OSDs, so putting a WAL there multiplies it by the
# application's own replication factor again, and every write takes a network
# round trip.
#
# It currently has no consumers. The WAL and buffer workloads that used it —
# Mimir ingesters, Loki write, Kafka — are back on rook-ceph-block: local
# volumes land on the node system disk, which is unquota'd hostPath shared with
# the container image cache, and they pin the pod to its node. Kept because the
# tradeoff flips back the moment a workload writes hard enough to care.
#
# This is deliberately not the default StorageClass: anything that must survive
# losing its node belongs on rook-ceph-block.

storageClass:
  create: true
  name: local-path
  defaultClass: false
  # Pinned rather than generated. The chart derives a name from the release and
  # cluster domain when this is unset, which bakes the release name into an
  # immutable StorageClass field.
  provisionerName: rancher.io/local-path
  reclaimPolicy: Delete
  volumeBindingMode: WaitForFirstConsumer

nodePathMap:
  - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
    paths:
      - /opt/local-path-provisioner
