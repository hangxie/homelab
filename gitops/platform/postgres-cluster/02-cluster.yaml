apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: postgres-cluster
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 3
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: postgres-cluster-images
    major: 18
  primaryUpdateStrategy: unsupervised

  bootstrap:
    initdb:
      database: app
      owner: postgres
      secret:
        name: postgres-cluster-superuser

  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-cluster-superuser

  storage:
    size: 10Gi
    storageClass: rook-ceph-block

  monitoring:
    enablePodMonitor: false

  # WAL archiving + base backups via the Barman Cloud Plugin (native
  # barmanObjectStore support is removed in CNPG 1.30). Store config and
  # schedule live in 03-backup.yaml.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-cluster-backup

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      # CNPG defaults to 5min, but a forced switch still writes a full 16 MiB
      # segment — ~98% padding here, and ~30% of all client writes to Ceph.
      # Costs archive RPO.
      archive_timeout: "30min"
      # Fewer checkpoints, so full-page images are not re-paid for the same
      # hot pages every 5min.
      checkpoint_timeout: "15min"
      # Shrinks full-page images. Insurance for bulk bursts, not steady state.
      wal_compression: "zstd"
      # HA replication slots are what protect the replicas; this is only a
      # backstop. pg_wal was 577M against a 100M database.
      wal_keep_size: "128MB"

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
