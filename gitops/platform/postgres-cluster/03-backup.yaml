# Barman Cloud Plugin backup to the in-cluster Ceph RGW. The OBC mints the
# bucket plus a same-namespace Secret (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY)
# scoped to that bucket, so no CephObjectStoreUser or ExternalSecret mirror is
# needed. barman-cloud does NOT create missing buckets (NoSuchBucket on WAL
# archive), so the OBC must be Bound before the Cluster enables the plugin.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: postgres-cluster-backup
  namespace: postgres-cluster
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  bucketName: postgres-cluster-backup
  storageClassName: rook-ceph-bucket
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-cluster-backup
  namespace: postgres-cluster
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  retentionPolicy: 14d
  configuration:
    destinationPath: s3://postgres-cluster-backup/
    endpointURL: http://rook-ceph-rgw-object-store.rook-ceph.svc:80
    s3Credentials:
      accessKeyId:
        name: postgres-cluster-backup
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: postgres-cluster-backup
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
---
# Daily base backup at 03:00; WAL archiving between backups gives PITR
# within the 14d retention window. Schedule is 6-field cron (seconds first).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-cluster-daily
  namespace: postgres-cluster
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: postgres-cluster
