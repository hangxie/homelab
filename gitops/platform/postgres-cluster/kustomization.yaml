# kustomize renders this whole directory: Argo CD switches renderers the moment
# a kustomization.yaml appears here and stops picking up loose files. A new
# manifest dropped in this directory is silently ignored until it is listed
# under `resources:`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-image-catalog.yaml
  - 01-superuser-externalsecret.yaml
  - 02-cluster.yaml
  - 03-backup.yaml
  - 04-pooler.yaml

# The sidecar names files after the ConfigMap's data keys, not the ConfigMap,
# so a hashed name would have Argo prune the old ConfigMap and delete the very
# files the new one just wrote. Fixed names reload in place on MODIFIED.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: /tmp/dashboards/Infrastructure

# Vendored from the cloudnative-pg chart, with the backup panels switched from
# cnpg_collector_* (always 0 under the Barman Cloud plugin) to the plugin's
# barman_cloud_cloudnative_pg_io_* metrics.
configMapGenerator:
  - name: cnpg-dashboard
    namespace: postgres-cluster
    files:
      - dashboards/cnpg.json
