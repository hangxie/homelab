apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads-raw
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "710"
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          # Mandatory — required for the cluster's data platform.
          - name: hdfs
          - name: hive
          - name: redis
          # Optional — comment a line out to disable that workload.
          # Pruning is automatic: a disabled workload's resources
          # (including PVCs) are deleted on the next Argo sync.
          - name: dbeaver
          - name: mysql
          # Ray Serve on the GPU node's two cards: ray-vllm takes both, ray-tts
          # one per TTS replica (TTS_NUM_REPLICAS), ray-stt one. Enable apps
          # that fit in two cards. Their model and compile-cache PVCs are
          # Delete=false and survive a disable, so switching back starts warm.
          # - name: ray-vllm
          - name: ray-tts
          - name: ray-stt
          # Voice chat: CPU only, needs ray-tts and ray-stt.
          - name: ray-vchat
  template:
    metadata:
      name: 'wl-{{ .name }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: workloads
      source:
        repoURL: https://github.com/hangxie/homelab.git
        targetRevision: main
        path: 'gitops/workloads/raw/{{ .name }}/manifests'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .name }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
