apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "153"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    # The Helm repository index omits stable 1.31 charts. Render the upstream
    # chart at the matching release tag instead; do not vendor chart copies.
    - repoURL: https://github.com/istio/istio.git
      targetRevision: 1.31.3
      path: manifests/charts/istio-cni
      helm:
        releaseName: istio-cni
        valueFiles:
          - $values/gitops/platform/istio/cni/values.yaml
    - repoURL: https://github.com/hangxie/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
