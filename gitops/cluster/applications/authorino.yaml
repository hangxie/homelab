apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authorino
  namespace: argocd
  annotations:
    # After authorino-operator (150), which installs the Authorino and AuthConfig CRDs.
    argocd.argoproj.io/sync-wave: "160"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/hangxie/homelab.git
    targetRevision: main
    path: gitops/platform/authorino
  destination:
    server: https://kubernetes.default.svc
    namespace: authorino
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
