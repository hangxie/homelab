# model-pull.sh for the model init containers of the Ray Serve workloads
# (raw/ray-vllm, raw/ray-tts) and Open WebUI's embedding model
# (helm/openwebui/extras): one copy, rendered into each app's namespace.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  # Fixed name: the worker pods mount it by name. subPath mounts never refresh,
  # so a change here needs the RayCluster recreated.
  - name: ray-model-pull
    files:
      - model-pull.sh
    options:
      disableNameSuffixHash: true
