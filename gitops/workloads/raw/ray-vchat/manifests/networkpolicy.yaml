# Ingress allowlist for ray-vchat. Outside callers must come through the
# Gateway, where everything but /health needs a Zitadel login; a pod calling
# ray-vchat-serve-svc directly would skip it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ray-vchat-ingress
  namespace: ray-vchat
spec:
  endpointSelector: {}
  ingress:
    # Ray head internals and OAuth2 Proxy -> Ray Serve.
    - fromEndpoints:
        - {}
    # Gateway Envoy: Ray Serve, Ray dashboard route, OAuth2 Proxy.
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
            - { port: "8265", protocol: TCP }
            - { port: "4180", protocol: TCP }
    # kubelet probes.
    - fromEntities: [host]
    # Metrics scrape.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: alloy
            app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - { port: "8080", protocol: TCP }
    # RayService controller: dashboard API and Serve health checks.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kuberay-operator
            app.kubernetes.io/name: kuberay-operator
