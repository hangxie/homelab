# kustomize renders this whole directory: Argo CD switches renderers the moment
# a kustomization.yaml appears here and stops picking up loose files. A new
# manifest dropped in this directory is silently ignored until it is listed
# under `resources:`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ray.yaml
  - route-ray-dashboard.yaml

# The sidecar names files after the ConfigMap's data keys, not the ConfigMap,
# so a hashed name would have Argo prune the old ConfigMap and delete the very
# files the new one just wrote. Fixed names reload in place on MODIFIED. The
# serve scripts need fixed names too: the RayService mounts them by name.
generatorOptions:
  disableNameSuffixHash: true

# Dashboards are vendored upstream JSON, kept as .json so they can be jq'd,
# diffed against a refreshed copy, and pasted into Grafana's import dialog. The
# sidecar label and target directory sit on each entry rather than in
# generatorOptions: those apply to every generated ConfigMap, and labelling the
# serve scripts would have Grafana ingest them as dashboards.
configMapGenerator:
  - name: ray-dashboard-default
    namespace: ray
    files:
      - dashboards/default.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        k8s-sidecar-target-directory: /tmp/dashboards/Workloads
  - name: ray-dashboard-serve
    namespace: ray
    files:
      - dashboards/serve.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        k8s-sidecar-target-directory: /tmp/dashboards/Workloads
  - name: ray-dashboard-serve-deployment
    namespace: ray
    files:
      - dashboards/serve-deployment.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        k8s-sidecar-target-directory: /tmp/dashboards/Workloads

  # Mounted by the RayService head and worker pods at /home/ray/<name> via
  # subPath. Kept as real .py/.jinja files so they stay syntax-highlighted and
  # lintable instead of living as opaque block scalars inside ray.yaml. subPath
  # mounts never refresh, so a change here needs the RayCluster recreated.
  - name: ray-vllm-serve-script
    namespace: ray
    files:
      - serve.py
      - sitecustomize.py
      - tool_chat_template_llama3.2_json.jinja
