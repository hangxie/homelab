apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-master-key
  namespace: ray
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: litellm-master-key
    creationPolicy: Owner
    template:
      data:
        # LiteLLM rejects master keys without the `sk-` prefix.
        master-key: "sk-{{ .key }}"
  data:
    - secretKey: key
      remoteRef:
        key: ray/litellm
        property: master-key
---
# model_list mirrors MODELS in ray.yaml's serveConfigV2; keep the two in step.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ray
data:
  config.yaml: |
    model_list:
      - model_name: cyankiwi/Qwen3.5-4B-AWQ-4bit
        litellm_params:
          model: openai/cyankiwi/Qwen3.5-4B-AWQ-4bit
          api_base: http://ray-vllm-serve-svc.ray.svc:8000/v1
          api_key: dummy
    litellm_settings:
      drop_params: true
    # LiteLLM never forwards a client disconnect on non-streaming requests, so
    # its own timeout is what closes the upstream connection and lets Ray Serve
    # cancel the generation. Retries would resubmit work the client gave up on.
    router_settings:
      num_retries: 0
      timeout: 300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ray
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: litellm
              topologyKey: kubernetes.io/hostname
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          args: [--config, /app/config.yaml, --port, "4000"]
          ports:
            - { containerPort: 4000 }
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
          volumeMounts:
            - { name: config, mountPath: /app/config.yaml, subPath: config.yaml }
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm
  namespace: ray
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ray
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - { port: 4000, targetPort: 4000 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  namespace: ray
spec:
  parentRefs:
    - name: default-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - "vllm.homelab.xiehang.com"
  rules:
    - backendRefs:
        - name: litellm
          port: 4000
