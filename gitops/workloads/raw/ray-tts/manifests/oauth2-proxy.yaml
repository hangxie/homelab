apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tts-api-key
  namespace: ray-tts
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: tts-api-key
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: ray/tts
        property: api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tts-oidc
  namespace: ray-tts
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: tts-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: oidc/ray-tts
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: oidc/ray-tts
        property: client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: ray/tts-oidc
        property: cookie-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts-oauth2-proxy
  namespace: ray-tts
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tts-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tts-oauth2-proxy
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tts-oauth2-proxy
                topologyKey: kubernetes.io/hostname
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
          args:
            - --provider=oidc
            - --provider-display-name=Zitadel
            - --oidc-issuer-url=https://zitadel.homelab.xiehang.com
            - --redirect-url=https://tts.homelab.xiehang.com/oauth2/callback
            - --scope=openid email profile
            - --code-challenge-method=S256
            - --oidc-groups-claim=groups
            - --allowed-group=admin
            - --allowed-group=viewer
            - --email-domain=*
            - --skip-provider-button=true
            - --reverse-proxy=true
            - --http-address=0.0.0.0:4180
            - --upstream=http://ray-tts-serve-svc:8000/
            - --cookie-name=__Host-ray-tts
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
            - --cookie-expire=12h
            - --cookie-refresh=0
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: { secretKeyRef: { name: tts-oidc, key: client-id } }
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: tts-oidc, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: tts-oidc, key: cookie-secret } }
          ports:
            - { name: http, containerPort: 4180 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
          livenessProbe:
            httpGet: { path: /ping, port: http }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: tts-oauth2-proxy
  namespace: ray-tts
spec:
  selector:
    app.kubernetes.io/name: tts-oauth2-proxy
  ports:
    - { name: http, port: 4180, targetPort: http }
