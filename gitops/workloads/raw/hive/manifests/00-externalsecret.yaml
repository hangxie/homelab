# Postgres role/password the metastore authenticates to CNPG with. The
# bootstrap Job below creates the role from the same Secret, so both sides
# always agree on the password Vault holds.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hive-db-credentials
  namespace: hive
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: hive-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: postgres-cnpg/hive
        property: username
    - secretKey: password
      remoteRef:
        key: postgres-cnpg/hive
        property: password
---
# CNPG superuser, needed only by the bootstrap Job to CREATE ROLE/DATABASE.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-superuser
  namespace: hive
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: postgres-superuser
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: postgres-cnpg/superuser
        property: password
---
# RGW credentials for the warehouse bucket, mirrored out of Rook's
# CephObjectStoreUser/hive Secret. AWS_-prefixed keys so the aws CLI in the
# bucket bootstrap Job picks them up from envFrom without extra mapping.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hive-s3
  namespace: hive
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: rook-ceph-rgw
    kind: ClusterSecretStore
  target:
    name: hive-s3
    creationPolicy: Owner
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_key }}"
  data:
    - secretKey: access_key
      remoteRef:
        key: rook-ceph-object-user-object-store-hive
        property: AccessKey
    - secretKey: secret_key
      remoteRef:
        key: rook-ceph-object-user-object-store-hive
        property: SecretKey
