# After an ungraceful power-off every mysqld comes back healthy but Group
# Replication stays down, and the InnoDBCluster sits at OFFLINE / ONLINE 0.
# The operator's repair path is only reachable from a pod restart it detects
# against in-memory state the power-off also wiped, so it never fires. See
# PR #201 for the trace through the operator source.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-outage-reboot
  namespace: mysql
data:
  reboot.sh: |
    #!/bin/bash
    set -u

    DOMAIN=mysql-cluster-instances.mysql.svc
    MEMBERS="mysql-cluster-0 mysql-cluster-1 mysql-cluster-2"
    PASSWORD=$(cat /etc/mysql-root/rootPassword)

    umask 077

    # The password goes into a 0600 script file, not argv, so it stays out of ps.
    run_js() {
      local host=$1 body=$2
      {
        printf 'shell.connect({host:"%s.%s",port:3306,user:"root",password:"%s","connect-timeout":5000});\n' \
          "$host" "$DOMAIN" "$PASSWORD"
        printf '%s\n' "$body"
      } >/tmp/op.js
      mysqlsh --js -f /tmp/op.js
      local rc=$?
      rm -f /tmp/op.js
      return $rc
    }

    # ONLINE members seen from $1, or nothing if $1 is unreachable.
    online_members() {
      run_js "$1" 'println(session.runSql("SELECT COUNT(*) FROM performance_schema.replication_group_members WHERE member_state = '"'"'ONLINE'"'"'").fetchOne()[0]);' \
        2>/dev/null | tail -1
    }

    # Only a unanimous, reachable 0 counts. Any ONLINE member means the group is
    # healthy or rejoining on its own; an unreachable one looks like a rolling
    # restart and is also where seeding from a stale copy would bite.
    all_offline() {
      local member count
      for member in $MEMBERS; do
        count=$(online_members "$member")
        case "$count" in
          0) ;;
          "") echo "$member: unreachable"; return 1 ;;
          *)  echo "$member: $count ONLINE member(s)"; return 1 ;;
        esac
      done
      return 0
    }

    if ! all_offline; then
      echo "cluster is not in a complete outage, nothing to do"
      exit 0
    fi

    # The group is legitimately memberless for a few seconds during
    # operator-driven work; confirm rather than fight the operator.
    echo "no ONLINE members on any of the three; re-checking in 60s"
    sleep 60
    if ! all_offline; then
      echo "cluster recovered on its own, nothing to do"
      exit 0
    fi

    # rebootClusterFromCompleteOutage() refuses to seed from an instance behind
    # another, so walk the members. It also refuses while any member is
    # unreachable, which is the backstop against a stale seed.
    for member in $MEMBERS; do
      # A concurrent repair can bring the group back mid-loop.
      if ! all_offline; then
        echo "cluster is ONLINE again, nothing more to do"
        exit 0
      fi
      echo "rebooting cluster from complete outage, seed=$member"
      if run_js "$member" 'dba.rebootClusterFromCompleteOutage();'; then
        echo "reboot OK"
        exit 0
      fi
      echo "$member rejected as seed, trying the next member"
    done

    echo "no member could seed the reboot; manual intervention required" >&2
    exit 1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-outage-reboot
  namespace: mysql
spec:
  schedule: "*/5 * * * *"
  # A run outlives its slot when it re-checks; a backlog all seeding the same
  # reboot helps nobody.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # One attempt per tick; a retry would re-run the same wait unchanged.
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: reboot
              # Same image as the operator's member sidecar, so mysqlsh matches
              # the 9.7.0 server.
              image: container-registry.oracle.com/mysql/community-operator:9.7.0-2.2.8
              command: [bash, /opt/reboot/reboot.sh]
              volumeMounts:
                - name: script
                  mountPath: /opt/reboot
                - name: mysql-root
                  mountPath: /etc/mysql-root
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: mysql-outage-reboot
            - name: mysql-root
              secret:
                secretName: mysql-root
            - name: tmp
              emptyDir: {}
