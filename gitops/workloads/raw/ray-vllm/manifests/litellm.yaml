# model_list mirrors MODELS in ray.yaml's serveConfigV2; keep the two in step.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ray-vllm
data:
  config.yaml: |
    model_list:
      - model_name: cyankiwi/Qwen3.5-9B-AWQ-4bit
        litellm_params:
          model: openai/cyankiwi/Qwen3.5-9B-AWQ-4bit
          api_base: http://ray-vllm-serve-svc.ray-vllm.svc:8000/v1
          api_key: dummy
    litellm_settings:
      drop_params: true
    # LiteLLM never forwards a client disconnect on non-streaming requests, so
    # its own timeout is what closes the upstream connection and lets Ray Serve
    # cancel the generation. Retries would resubmit work the client gave up on.
    router_settings:
      num_retries: 0
      timeout: 300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ray-vllm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: litellm
              topologyKey: kubernetes.io/hostname
      containers:
        - name: litellm
          # Pinned: main-stable moved under us and started refusing to boot without a master key.
          image: ghcr.io/berriai/litellm:v1.108.0
          args: [--config, /app/config.yaml, --port, "4000"]
          ports:
            - { containerPort: 4000 }
          env:
            # No master key on purpose: the Gateway checks bearer tokens (#254), the
            # route exposes only /v1, and ray-vllm's network policy admits only the Gateway.
            - name: LITELLM_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY
              value: "true"
          volumeMounts:
            - { name: config, mountPath: /app/config.yaml, subPath: config.yaml }
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm
  namespace: ray-vllm
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ray-vllm
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - { port: 4000, targetPort: 4000 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  namespace: ray-vllm
spec:
  parentRefs:
    - name: default-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - "vllm.homelab.xiehang.com"
  # Only the OpenAI API is exposed; the admin UI and API (/ui, /key, /model,
  # /config, ...) have no route. LiteLLM runs without a master key, and
  # ray-vllm's network policy keeps it reachable only through here.
  rules:
    # Model list is public: no prompts, keys, or GPU work.
    - matches:
        - path:
            type: Exact
            value: /v1/models
          method: GET
      backendRefs:
        - name: litellm
          port: 4000
    # Bearer token checked by Authorino (AuthConfig authorino/ray-vllm, #254).
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: GRPC
            backendRef:
              name: authorino-authorino-authorization
              namespace: authorino
              port: 50051
            grpc: {}
      backendRefs:
        - name: litellm
          port: 4000
