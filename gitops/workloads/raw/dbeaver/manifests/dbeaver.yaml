apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
  namespace: dbeaver
  labels:
    app.kubernetes.io/name: cloudbeaver
spec:
  replicas: 1
  # RWO workspace PVC: a rolling update's new pod can't attach it while the
  # old pod still holds it on another node.
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudbeaver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudbeaver
    spec:
      # SSO: trust the user from the shared OAuth2 Proxy (X-Auth-Request-Email,
      # set by the Gateway, which overwrites any client copy). The setting lives
      # in the runtime config on the PVC, which CloudBeaver rewrites itself, so
      # patch it on every start. On a fresh workspace, write just these keys:
      # CloudBeaver merges the file over conf/cloudbeaver.conf, and CB_SERVER_NAME
      # keeps it out of the setup wizard.
      initContainers:
        - name: enable-sso
          image: python:3.13-alpine
          command: [python3, -c]
          args:
            - |
              import json, os
              p = "/workspace/.data/.cloudbeaver.runtime.conf"
              os.makedirs(os.path.dirname(p), exist_ok=True)
              conf = json.load(open(p)) if os.path.exists(p) else {}
              app = conf.setdefault("app", {})
              app["enableReverseProxyAuth"] = True
              app["enabledAuthProviders"] = ["local", "reverseProxy"]
              app["authConfigurations"] = [{
                  "id": "zitadel",
                  "provider": "reverseProxy",
                  "displayName": "Zitadel",
                  "disabled": False,
                  "parameters": {
                      "user-header": "X-Auth-Request-Email",
                      "logout-url": "https://dbeaver.homelab.xiehang.com/oauth2/sign_out",
                  },
              }]
              json.dump(conf, open(p, "w"), indent=2)
          volumeMounts:
            - { name: data, mountPath: /workspace }
      containers:
        - name: cloudbeaver
          image: dbeaver/cloudbeaver:24.3.0
          ports:
            - containerPort: 8978
          env:
            # Preconfigures the admin account on first (empty-workspace)
            # startup so no manual first-login setup is needed. Ignored once
            # the workspace DB is initialized. Admin username must not be
            # "admin" — see scripts/vault-secrets.template.yaml (dbeaver/admin).
            - { name: CB_SERVER_NAME, value: Home Lab }
            - name: CB_ADMIN_NAME
              valueFrom:
                secretKeyRef: { name: cloudbeaver-admin, key: username }
            - name: CB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: cloudbeaver-admin, key: password }
          volumeMounts:
            - { name: postgres-ca, mountPath: /etc/postgres-ca, readOnly: true }
            - { name: data, mountPath: /opt/cloudbeaver/workspace }
            - name: data-sources
              mountPath: /opt/cloudbeaver/workspace/GlobalConfiguration/.dbeaver/data-sources-homelab.json
              subPath: data-sources-homelab.json
              readOnly: true
      volumes:
        - name: postgres-ca
          configMap: { name: postgres-server-ca }
        - name: data
          persistentVolumeClaim:
            claimName: cloudbeaver
        - name: data-sources
          configMap:
            name: cloudbeaver-data-sources
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudbeaver
  namespace: dbeaver
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cloudbeaver
  namespace: dbeaver
spec:
  selector:
    app.kubernetes.io/name: cloudbeaver
  ports:
    - port: 80
      targetPort: 8978
