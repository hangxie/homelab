apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
  namespace: dbeaver
  labels:
    app.kubernetes.io/name: cloudbeaver
spec:
  replicas: 1
  # RWO workspace PVC: a rolling update's new pod can't attach it while the
  # old pod still holds it on another node.
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudbeaver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudbeaver
    spec:
      containers:
        - name: cloudbeaver
          image: dbeaver/cloudbeaver:24.3.0
          ports:
            - containerPort: 8978
          env:
            # Preconfigures the admin account on first (empty-workspace)
            # startup so no manual first-login setup is needed. Ignored once
            # the workspace DB is initialized. Admin username must not be
            # "admin" — see scripts/vault-secrets.template.yaml (dbeaver/admin).
            - { name: CB_SERVER_NAME, value: Home Lab }
            - name: CB_ADMIN_NAME
              valueFrom:
                secretKeyRef: { name: cloudbeaver-admin, key: username }
            - name: CB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: cloudbeaver-admin, key: password }
          volumeMounts:
            - { name: data, mountPath: /opt/cloudbeaver/workspace }
            - name: data-sources
              mountPath: /opt/cloudbeaver/workspace/GlobalConfiguration/.dbeaver/data-sources-homelab.json
              subPath: data-sources-homelab.json
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cloudbeaver
        - name: data-sources
          configMap:
            name: cloudbeaver-data-sources
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudbeaver
  namespace: dbeaver
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cloudbeaver
  namespace: dbeaver
spec:
  selector:
    app.kubernetes.io/name: cloudbeaver
  ports:
    - port: 80
      targetPort: 8978
