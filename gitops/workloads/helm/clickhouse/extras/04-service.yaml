apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: clickhouse
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    app: clickhouse-clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      protocol: TCP
    - name: tcp
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: prometheus
      port: 9363
      targetPort: 9363
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clickhouse
  namespace: clickhouse
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: default-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - "clickhouse.homelab.xiehang.com"
  rules:
    # Shared login (gitops/platform/oauth2-proxy): every request is checked first.
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: oauth2-proxy
              namespace: oauth2-proxy
              port: 4180
            http:
              allowedHeaders: [cookie, x-forwarded-proto, x-forwarded-host]
              # Unset means every auth-reply header (Content-Type too) overwrites the request.
              allowedResponseHeaders: [x-auth-request-email]
      backendRefs:
        - name: clickhouse
          port: 8123
