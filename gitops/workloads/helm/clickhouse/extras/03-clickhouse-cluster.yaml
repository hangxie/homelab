apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: clickhouse
  namespace: clickhouse
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  shards: 1
  replicas: 2
  keeperClusterRef:
    name: clickhouse
  containerTemplate:
    image:
      repository: docker.io/clickhouse/clickhouse-server
      tag: "25.7"
    imagePullPolicy: IfNotPresent
    resources:
      # ClickHouse sizes itself off the limit, not the request, so a 2Gi
      # request let it grow to ~7Gi on a node that guaranteed it 2Gi.
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 8Gi
  podTemplate:
    # Each replica is its own StatefulSet with replicas: 1, so nothing spreads
    # them by default and both landed on worker-0 — where replicas: 2 buys
    # nothing against node loss.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                clickhouse.com/role: clickhouse-server
            topologyKey: kubernetes.io/hostname
  dataVolumeClaimSpec:
    storageClassName: rook-ceph-block
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 40Gi
  settings:
    defaultUserPassword:
      secret:
        name: clickhouse-credentials
        key: password
    # The operator defaults to trace logging with 50 x 1 GiB files, which
    # makes an idle server continuously merge its own diagnostic tables.
    # Kubernetes already captures console logs and Alloy scrapes /metrics.
    logger:
      level: information
      logToFile: false
      size: 100M
      count: 3
    extraConfig:
      text_log:
        "@remove": remove
      metric_log:
        "@remove": remove
      asynchronous_metric_log:
        "@remove": remove
      # 0.9 of 8Gi leaves too little for what the memory tracker can't see,
      # so the kernel OOM-kills before ClickHouse ever refuses a query.
      max_server_memory_usage_to_ram_ratio: 0.8
    # Otherwise the default profile is unbounded and one query can take the
    # pod down. Also what creates users.d/ — the operator omits it until set.
    extraUsersConfig:
      profiles:
        default:
          max_memory_usage: 4294967296
          max_bytes_before_external_group_by: 2147483648
          max_bytes_before_external_sort: 2147483648
