apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: clickhouse
  namespace: clickhouse
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  shards: 1
  replicas: 2
  keeperClusterRef:
    name: clickhouse
  containerTemplate:
    image:
      repository: docker.io/clickhouse/clickhouse-server
      tag: "25.7"
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 4Gi
  podTemplate:
    # Each replica is its own StatefulSet with replicas: 1, so nothing spreads
    # them by default and both landed on worker-0 — where replicas: 2 buys
    # nothing against node loss.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                clickhouse.com/role: clickhouse-server
            topologyKey: kubernetes.io/hostname
  dataVolumeClaimSpec:
    storageClassName: rook-ceph-block
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
  settings:
    defaultUserPassword:
      secret:
        name: clickhouse-credentials
        key: password
    # The operator defaults to trace logging with 50 x 1 GiB files, which
    # makes an idle server continuously merge its own diagnostic tables.
    # Kubernetes already captures console logs and Alloy scrapes /metrics.
    logger:
      level: information
      logToFile: false
      size: 100M
      count: 3
    extraConfig:
      text_log:
        "@remove": remove
      metric_log:
        "@remove": remove
      asynchronous_metric_log:
        "@remove": remove
