apiVersion: clickhouse.com/v1alpha1
kind: KeeperCluster
metadata:
  name: clickhouse
  namespace: clickhouse
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 3
  containerTemplate:
    image:
      repository: docker.io/clickhouse/clickhouse-keeper
      tag: "25.7"
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi
  podTemplate:
    # One Keeper per node. Two on one node means losing that node loses quorum
    # and puts ClickHouse read-only — worse than running a single Keeper. Under
    # the maxUnavailable: 1 PDB it also hangs a drain of that node.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                clickhouse.com/role: clickhouse-keeper
            topologyKey: kubernetes.io/hostname
  dataVolumeClaimSpec:
    storageClassName: rook-ceph-block
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 5Gi
