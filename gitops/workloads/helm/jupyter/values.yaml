hub:
  db:
    type: postgres
    url: postgresql+psycopg2://jupyterhub@postgres-cluster-pooler-rw.postgres-cluster.svc:5432/jupyterhub
    upgrade: true
  existingSecret: jupyterhub-db
  config:
    # Zitadel SSO. A notebook server runs arbitrary code, so only the admin
    # group gets in (viewer has no read-only meaning here) and is a hub admin.
    # Endpoints are spelled out so nothing is discovered at startup. The hub
    # cookie lasts the 12h used across apps.
    JupyterHub:
      authenticator_class: generic-oauth
      cookie_max_age_days: 0.5
    GenericOAuthenticator:
      login_service: Zitadel
      oauth_callback_url: https://jupyter.homelab.xiehang.com/hub/oauth_callback
      authorize_url: https://zitadel.homelab.xiehang.com/oauth/v2/authorize
      token_url: https://zitadel.homelab.xiehang.com/oauth/v2/token
      userdata_url: https://zitadel.homelab.xiehang.com/oidc/v1/userinfo
      scope: [openid, profile, email]
      username_claim: preferred_username
      auth_state_groups_key: oauth_user.groups
      manage_groups: true
      allowed_groups: [admin]
      admin_groups: [admin]
  # Read by OAuthenticator itself.
  extraEnv:
    - name: OAUTH_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: jupyter-oidc
          key: client-id
    - name: OAUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: jupyter-oidc
          key: client-secret
  networkPolicy:
    # Cilium's CIDR selectors do not match in-cluster pod identities, so the
    # chart's default `egressAllowRules.privateIPs: true` (ipBlock 10.0.0.0/8)
    # silently fails to permit hub -> postgres. Use a namespaceSelector instead.
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: postgres-cluster
        ports:
          - port: 5432
            protocol: TCP

proxy:
  service:
    type: ClusterIP

singleuser:
  storage:
    type: dynamic
    dynamic:
      storageClass: rook-ceph-block
    capacity: 10Gi
  cpu:
    limit: 2
    guarantee: 0.25
  memory:
    limit: 4G
    guarantee: 256M

scheduling:
  userScheduler:
    enabled: true
  podPriority:
    enabled: true

prePuller:
  hook:
    enabled: false
  continuous:
    enabled: false
