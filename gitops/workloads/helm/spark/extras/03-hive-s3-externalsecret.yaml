# Mirrors Rook's CephObjectStoreUser/hive Secret into the spark namespace.
# The Hive warehouse bucket is owned by the `hive` RGW user, and RGW denies
# cross-user access, so a job that reads or writes warehouse tables has to
# authenticate as that user rather than as `spark` — envFrom this Secret
# instead of spark-s3 (see the Hive metastore section of README.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hive-s3
  namespace: spark
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: rook-ceph-rgw
    kind: ClusterSecretStore
  target:
    name: hive-s3
    creationPolicy: Owner
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_key }}"
  data:
    - secretKey: access_key
      remoteRef:
        key: rook-ceph-object-user-object-store-hive
        property: AccessKey
    - secretKey: secret_key
      remoteRef:
        key: rook-ceph-object-user-object-store-hive
        property: SecretKey
