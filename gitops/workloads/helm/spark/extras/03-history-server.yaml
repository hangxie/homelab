apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history-server
  namespace: spark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-history-server
  template:
    metadata:
      labels:
        app: spark-history-server
    spec:
      initContainers:
        - name: copy-spark-jars
          image: apache/spark:3.5.5
          command: ["cp", "-r", "/opt/spark/jars/.", "/mnt/jars/"]
          volumeMounts:
            - name: spark-jars
              mountPath: /mnt/jars
        # hadoop-aws plus the AWS SDK the image does not ship; see
        # scripts/seed-jars.sh. Tagged by hadoop-aws version: 3.3.4 pairs with
        # SDK v1, which is what Spark 3.5.5 is built against.
        - name: fetch-s3-jars
          image: ghcr.io/oras-project/oras:v1.2.2
          command: ["/bin/oras", "pull", "--output", "/mnt/jars", "media.xiehang.com/jars/spark-history-s3a:3.3.4"]
          volumeMounts:
            - name: spark-jars
              mountPath: /mnt/jars
      containers:
        - name: history-server
          image: apache/spark:3.5.5
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.history.HistoryServer
          ports:
            - containerPort: 18080
          envFrom:
            - secretRef:
                name: spark-s3
          volumeMounts:
            - name: spark-conf
              mountPath: /opt/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
            - name: spark-jars
              mountPath: /opt/spark/jars
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: spark-conf
          configMap:
            name: spark-defaults
        - name: spark-jars
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: spark-history-server
  namespace: spark
spec:
  selector:
    app: spark-history-server
  ports:
    - port: 18080
      targetPort: 18080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spark-history-server
  namespace: spark
spec:
  parentRefs:
    - name: default-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - "spark-history.homelab.xiehang.com"
  rules:
    - backendRefs:
        - name: spark-history-server
          port: 18080
