# spark-defaults.conf points spark.eventLog.dir at s3a://spark-logs/, but nothing
# creates that bucket. An ObjectBucketClaim mints its own RGW user, so it can't
# reach the CephObjectStoreUser/spark credentials Spark authenticates as; this Job
# creates the bucket under those same credentials instead. Wave "-1" runs it after
# the spark-s3 ExternalSecret (wave "-2") and before the history server.
apiVersion: batch/v1
kind: Job
metadata:
  name: spark-bucket-bootstrap
  namespace: spark
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mkbucket
          image: amazon/aws-cli:2.15.0
          envFrom:
            - secretRef:
                name: spark-s3
          env:
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          command: [sh, -ec]
          args:
            - |
              EP=http://rook-ceph-rgw-object-store.rook-ceph.svc:80
              aws --endpoint-url "$EP" s3api head-bucket --bucket spark-logs 2>/dev/null ||
                aws --endpoint-url "$EP" s3api create-bucket --bucket spark-logs
