apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-openai-keys
  namespace: openwebui
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: openwebui-openai-keys
    creationPolicy: Owner
    template:
      data:
        # Order matches openaiBaseApiUrls: vLLM, then llama-cpp (both LiteLLM).
        api-keys: "sk-{{ .vllm }};sk-{{ .llamacpp }}"
  data:
    - secretKey: vllm
      remoteRef:
        key: ray/litellm
        property: master-key
    - secretKey: llamacpp
      remoteRef:
        key: llama-cpp/litellm
        property: master-key
