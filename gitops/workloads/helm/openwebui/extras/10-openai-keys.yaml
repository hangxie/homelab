apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-openai-keys
  namespace: openwebui
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: openwebui-openai-keys
    creationPolicy: Owner
    template:
      data:
        # Order matches openaiBaseApiUrls. The vLLM entry is the PAT of the
        # openwebui machine user (machines: in scripts/zitadel.template.yaml).
        api-keys: "{{ .vllm }}"
  data:
    - secretKey: vllm
      remoteRef:
        key: api-keys/openwebui
        property: token
