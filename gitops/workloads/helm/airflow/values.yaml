airflowVersion: "3.2.2"
defaultAirflowTag: "3.2.2"

executor: KubernetesExecutor

# Users come from Zitadel (apiServer.apiServerConfig), so no local admin.
createUserJob:
  enabled: false

migrateDatabaseJob:
  applyCustomEnv: false
  ttlSecondsAfterFinished: null
  # The chart ships migrations as a Helm post-install/post-upgrade hook -> Argo CD
  # PostSync. PostSync runs only after every resource is Healthy, but the
  # scheduler/api-server/triggerer block in their `wait-for-airflow-migrations`
  # init container until migrations exist. That is a deadlock: deployments wait on
  # migrations, migrations wait on deployments being Healthy. Disable the Helm
  # hooks and re-tag the rendered Job as an Argo CD Sync hook at wave -1 so it runs
  # after the DB bootstrap (wave -2) and before the deployments (wave 0).
  useHelmHooks: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
  # The migrate Job is a Sync hook at wave -1, but its ServiceAccount renders as a
  # plain resource at the default wave 0 -- i.e. after the hook. Argo CD then runs
  # the hook Job before the SA exists, so pod creation fails with
  # "serviceaccount ... not found" and the sync deadlocks on the never-completing
  # hook. Move the SA to wave -2 (with the DB bootstrap) so it is always present
  # before the migration hook runs.
  serviceAccount:
    annotations:
      argocd.argoproj.io/sync-wave: "-2"

apiSecretKeySecretName: airflow-api-secret-key
jwtSecretName: airflow-jwt-secret
fernetKeySecretName: airflow-fernet-key

# The UI session is the api-server's JWT; cap it at the 12h used across apps
# (default 24h).
config:
  api_auth:
    jwt_expiration_time: 43200

# The migrate (wave -1) and create-user (wave 0) Jobs run as Sync hooks and mount
# this airflow config ConfigMap, which otherwise renders as a plain resource at
# the default wave 0 -- after the migrate hook. The hook pod then hangs with
# "configmap wl-airflow-config not found". Pull the ConfigMap into an earlier wave
# so it always exists before any hook Job runs.
airflowConfigAnnotations:
  argocd.argoproj.io/sync-wave: "-3"

data:
  metadataConnection:
    user: airflow
    pass: ""        # supplied via metadataSecretName
    protocol: postgresql
    host: postgres-cluster-pooler-rw.postgres-cluster.svc
    port: 5432
    db: airflow
    sslmode: disable
  metadataSecretName: airflow-db-credentials

postgresql:
  enabled: false

redis:
  enabled: false

dags:
  persistence:
    enabled: true
    storageClassName: rook-cephfs
    size: 5Gi
    accessMode: ReadWriteMany
    annotations:
      argocd.argoproj.io/sync-options: Prune=false

logs:
  persistence:
    enabled: true
    storageClassName: rook-cephfs
    size: 5Gi
    annotations:
      argocd.argoproj.io/sync-options: Prune=false

# Two of each so a node drain or crash doesn't stop the UI, scheduling or
# deferred tasks; Airflow coordinates schedulers and triggerers through
# Postgres row locks. dag-processor stays at one (duplicate parsing races).
apiServer:
  replicas: 2
  podDisruptionBudget:
    enabled: true
  startupProbe:
    periodSeconds: 10
    timeoutSeconds: 20
    failureThreshold: 30
  # Trust the gateway's X-Forwarded-Proto so the OAuth callback URL is https.
  # The pods are only reachable in-cluster.
  args: ["bash", "-c", "exec airflow api-server --proxy-headers"]
  env:
    - name: FORWARDED_ALLOW_IPS
      value: "*"
    - name: OIDC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: airflow-oidc
          key: client-id
    - name: OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: airflow-oidc
          key: client-secret
  # Zitadel SSO. FAB takes one AUTH_TYPE, so the local login is gone. FAB has
  # no generic OIDC userinfo reader, hence the small security manager; the
  # `groups` claim picks the role at every login (admin is Admin, viewer is
  # Viewer). Users without a role are refused by Zitadel before they get here.
  apiServerConfig: |
    import os
    from datetime import timedelta
    from flask_appbuilder.security.manager import AUTH_OAUTH
    from airflow.providers.fab.auth_manager.security_manager.override import (
        FabAirflowSecurityManagerOverride,
    )

    AUTH_TYPE = AUTH_OAUTH
    AUTH_USER_REGISTRATION = True
    AUTH_USER_REGISTRATION_ROLE = "Public"
    AUTH_ROLES_MAPPING = {"admin": ["Admin"], "viewer": ["Viewer"]}
    AUTH_ROLES_SYNC_AT_LOGIN = True
    PERMANENT_SESSION_LIFETIME = timedelta(hours=12)
    OAUTH_PROVIDERS = [{
        "name": "zitadel",
        "icon": "fa-key",
        "token_key": "access_token",
        "remote_app": {
            "client_id": os.environ["OIDC_CLIENT_ID"],
            "client_secret": os.environ["OIDC_CLIENT_SECRET"],
            "api_base_url": "https://zitadel.homelab.xiehang.com/",
            "authorize_url": "https://zitadel.homelab.xiehang.com/oauth/v2/authorize",
            "access_token_url": "https://zitadel.homelab.xiehang.com/oauth/v2/token",
            "jwks_uri": "https://zitadel.homelab.xiehang.com/oauth/v2/keys",
            "client_kwargs": {"scope": "openid profile email"},
        },
    }]

    class ZitadelSecurityManager(FabAirflowSecurityManagerOverride):
        def get_oauth_user_info(self, provider, resp):
            me = self.oauth_remotes[provider].get("oidc/v1/userinfo").json()
            return {
                "username": me["preferred_username"],
                "email": me.get("email", ""),
                "first_name": me.get("given_name", ""),
                "last_name": me.get("family_name", ""),
                "role_keys": me.get("groups", []),
            }

    SECURITY_MANAGER_CLASS = ZitadelSecurityManager

# Task logs land on the shared logs PVC and are pruned by the per-component
# log-groomer sidecars. Lower retention from the chart default (15d) to 7d to
# match the observability stack. Groomers run alongside these three components
# under KubernetesExecutor (no persistent workers).
#
# Default scheduler startupProbe grace (6 * 10s = 60s) is also too short on
# this cluster: the `airflow jobs check` probe command itself sometimes takes
# close to its 20s timeout under load, and the scheduler's first heartbeat
# after boot can land right around the 60s mark. Kubelet was killing the
# container before it ever became healthy, causing an endless crash loop.
# Match apiServer's failureThreshold for the same ~300s grace.
scheduler:
  replicas: 2
  podDisruptionBudget:
    enabled: true
  logGroomerSidecar:
    retentionDays: 7
  startupProbe:
    periodSeconds: 10
    timeoutSeconds: 20
    failureThreshold: 30

triggerer:
  replicas: 2
  podDisruptionBudget:
    enabled: true
  logGroomerSidecar:
    retentionDays: 7

dagProcessor:
  logGroomerSidecar:
    retentionDays: 7

statsd:
  enabled: true

flower:
  enabled: false
