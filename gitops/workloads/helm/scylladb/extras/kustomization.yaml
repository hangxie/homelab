# kustomize renders this whole directory: Argo CD switches renderers the moment
# a kustomization.yaml appears here and stops picking up loose files. A new
# manifest dropped in this directory is silently ignored until it is listed
# under `resources:`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Nothing but dashboards lives here yet; new manifests go under this key.
resources: []

# The sidecar names files after the ConfigMap's data keys, not the ConfigMap,
# so a hashed name would have Argo prune the old ConfigMap and delete the very
# files the new one just wrote. Fixed names reload in place on MODIFIED.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: /tmp/dashboards/Workloads

# Dashboards are vendored upstream JSON, kept as .json so they can be jq'd,
# diffed against a refreshed copy, and pasted into Grafana's import dialog.
configMapGenerator:
  - name: scylladb-dashboard-cql
    namespace: scylladb
    files:
      - dashboards/scylla-cql.json
  - name: scylladb-dashboard-os
    namespace: scylladb
    files:
      - dashboards/scylla-os.json
  - name: scylladb-dashboard-overview
    namespace: scylladb
    files:
      - dashboards/scylla-overview.json
