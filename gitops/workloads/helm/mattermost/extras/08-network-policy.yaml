# Internet-facing, and there is no cluster-wide default-deny yet, so lock the
# server down in both directions.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mattermost
  namespace: mattermost
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mattermost
      app.kubernetes.io/instance: wl-mattermost
  ingress:
    # Cilium Gateway (Envoy) traffic carries the reserved `ingress` identity.
    - fromEntities: [ingress]
      toPorts:
        - ports: [{ port: "8065", protocol: TCP }]
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: admin-bootstrap
      toPorts:
        - ports: [{ port: "8065", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: postgres-cluster
            cnpg.io/cluster: postgres-cluster
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: rook-ceph
            app: rook-ceph-rgw
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    # Push proxy, marketplace, link previews.
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
            - { port: "80", protocol: TCP }
