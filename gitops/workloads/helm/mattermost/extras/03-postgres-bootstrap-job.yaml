apiVersion: batch/v1
kind: Job
metadata:
  name: mattermost-postgres-bootstrap
  namespace: mattermost
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:18
          env:
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-superuser, key: password } }
            - name: MATTERMOST_PASSWORD
              valueFrom: { secretKeyRef: { name: mattermost-db-credentials, key: password } }
          command: [bash, -ec]
          args:
            - |
              psql -h postgres-cluster-rw.postgres-cluster -U postgres \
                   -v ON_ERROR_STOP=1 \
                   -v MATTERMOST_PASSWORD="${MATTERMOST_PASSWORD}" <<SQL
              SELECT format('CREATE USER mattermost WITH PASSWORD %L', :'MATTERMOST_PASSWORD')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname='mattermost')\gexec
              ALTER USER mattermost WITH PASSWORD :'MATTERMOST_PASSWORD';
              SELECT 'CREATE DATABASE mattermost OWNER mattermost'
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname='mattermost')\gexec
              GRANT ALL PRIVILEGES ON DATABASE mattermost TO mattermost;
              SQL
