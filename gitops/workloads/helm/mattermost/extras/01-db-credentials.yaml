apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mattermost-db-credentials
  namespace: mattermost
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: mattermost-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: postgres-cnpg/mattermost
        property: username
    - secretKey: password
      remoteRef:
        key: postgres-cnpg/mattermost
        property: password
