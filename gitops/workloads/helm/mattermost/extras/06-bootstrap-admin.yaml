# Mattermost promotes the first account to system admin and allows it even with
# EnableOpenServer=false, so the admin exists before the site is reachable.
apiVersion: batch/v1
kind: Job
metadata:
  name: mattermost-admin-bootstrap
  namespace: mattermost
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # See openwebui/extras/03-bootstrap-admin.yaml.
    argocd.argoproj.io/sync-options: Replace=true,ServerSideDiff=false
spec:
  backoffLimit: 15
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: admin-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: signup
          image: curlimages/curl:8.10.1
          env:
            - name: ADMIN_USERNAME
              value: sysadmin
            - name: ADMIN_EMAIL
              value: admin@homelab.xiehang.com
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mattermost-admin
                  key: password
          command: [sh, -ceu]
          args:
            - |
              endpoint="http://mattermost.mattermost.svc:8065"
              # No jq in this image; escape the only JSON specials a password
              # can carry here (Vault values never contain control chars).
              json_esc() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }
              user=$(json_esc "${ADMIN_USERNAME}")
              email=$(json_esc "${ADMIN_EMAIL}")
              pass=$(json_esc "${ADMIN_PASSWORD}")

              echo "Waiting for Mattermost to be ready..."
              for i in $(seq 1 60); do
                if curl -fsS -o /dev/null "${endpoint}/api/v4/system/ping"; then
                  echo "Mattermost is ready."
                  break
                fi
                if [ "${i}" = "60" ]; then
                  echo "Mattermost not ready after 5m; failing." >&2
                  exit 1
                fi
                sleep 5
              done

              login_payload=$(printf '{"login_id":"%s","password":"%s"}' \
                "${user}" "${pass}")
              login_code=$(curl -sS -o /tmp/login-resp -w '%{http_code}' \
                -X POST "${endpoint}/api/v4/users/login" \
                -H 'Content-Type: application/json' \
                -d "${login_payload}")

              case "${login_code}" in
                200)
                  echo "Admin credential verified."
                  exit 0
                  ;;
                400|401)
                  echo "Admin login did not verify (HTTP ${login_code}); trying initial signup."
                  ;;
                *)
                  echo "Unexpected login status ${login_code}: $(cat /tmp/login-resp)" >&2
                  exit 1
                  ;;
              esac

              # Vault password rotation is intentionally NOT propagated here;
              # matches the OpenWebUI admin-bootstrap behavior.
              signup_payload=$(printf '{"username":"%s","email":"%s","password":"%s"}' \
                "${user}" "${email}" "${pass}")
              signup_code=$(curl -sS -o /tmp/signup-resp -w '%{http_code}' \
                -X POST "${endpoint}/api/v4/users" \
                -H 'Content-Type: application/json' \
                -d "${signup_payload}")

              case "${signup_code}" in
                201) echo "Admin user created."; exit 0 ;;
                *)
                  echo "Signup rejected (HTTP ${signup_code}): $(cat /tmp/signup-resp)" >&2
                  echo "If ${ADMIN_USERNAME} exists, its password does not match Vault; see README.md (Mattermost admin)." >&2
                  exit 1
                  ;;
              esac
