apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mattermost
  namespace: mattermost
  labels:
    # See openwebui/extras/02-route.yaml: avoids a phantom `labels: {}` diff.
    app.kubernetes.io/name: mattermost
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-system
      sectionName: https
  # No hostnames: inherited from the public-gateway listener.
  rules:
    - backendRefs:
        - name: mattermost
          port: 8065
