postgresql:
  enabled: false

# Use the cluster-wide Redis (redis-operator) instead of an embedded sub-chart.
# Connection details live under supersetNode.connections below.
redis:
  enabled: false

# The upstream apache/superset image ships without the `postgres` extra, so a
# Postgres metadata DB connection fails at boot with
# `ModuleNotFoundError: No module named 'psycopg2'`. Superset 5.0.0 uses an
# uv-managed venv at /app/.venv, so install into that interpreter explicitly.
# Authlib is FAB's OAuth client, also missing from the image.
bootstrapScript: |
  #!/bin/bash
  set -e
  if [ -x "/app/.venv/bin/python" ] && command -v uv >/dev/null 2>&1; then
    uv pip install --quiet --python /app/.venv/bin/python psycopg2-binary==2.9.10 authlib==1.6.12
    /app/.venv/bin/python -c "import psycopg2, authlib"
  else
    python -m pip install --quiet psycopg2-binary==2.9.10 authlib==1.6.12
    python -c "import psycopg2, authlib"
  fi
  if [ ! -f ~/bootstrap ]; then echo "Running Superset with uid $(id -u)" > ~/bootstrap; fi

supersetNode:
  replicas:
    replicaCount: 2
  connections:
    db_host: postgres-cluster-pooler-rw.postgres-cluster.svc
    db_port: "5432"
    db_user: superset
    db_name: superset
    # Central redis-operator instance. The -master service follows the master
    # on Sentinel failover (operator re-points its redis-role=master selector).
    redis_host: redis-replication-master.redis.svc
    redis_port: "6379"
    # The chart has no existingSecret hook for the Redis password and only
    # emits password-aware config when this value is truthy. The real password
    # is injected at runtime via the REDIS_PASSWORD entry in extraEnvRaw (an
    # explicit env that overrides the plaintext value the chart bakes into its
    # -env Secret), so this is just a non-secret placeholder flag.
    redis_password: from-extraenvraw

supersetWorker:
  replicas:
    replicaCount: 2

supersetCeleryBeat:
  enabled: true

supersetWebsockets:
  enabled: true
  # The chart's default `jwtSecret: CHANGE-ME` is 9 chars, but the
  # @apache/superset-websocket service requires >=32 bytes and exits at boot
  # otherwise. The chart has no `existingSecret` hook for this Secret, so we
  # inline a value here. TODO: externalize via Vault + ExternalSecret patch.
  config:
    jwtSecret: "6hJgm-mULfdzcq1T-1Vl-3R-jPe194jb"

extraEnvRaw:
  - name: SUPERSET_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: superset-secret
        key: secret-key
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: superset-db-credentials
        key: username
  - name: DB_PASS
    valueFrom:
      secretKeyRef:
        name: superset-db-credentials
        key: password
  - name: OIDC_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: superset-oidc
        key: client-id
  - name: OIDC_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: superset-oidc
        key: client-secret
  # Overrides the placeholder redis_password baked into the chart's -env Secret.
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: superset-redis
        key: password

# Zitadel SSO. FAB takes one AUTH_TYPE, so the local login is gone. FAB has
# no generic OIDC userinfo reader, hence the small security manager; the
# `groups` claim picks the role at every login (admin is Admin, viewer is
# Gamma). Users without a role are refused by Zitadel before they get here.
# ProxyFix makes the callback URL https behind the gateway.
configOverrides:
  zitadel: |
    import os
    from datetime import timedelta
    from flask_appbuilder.security.manager import AUTH_OAUTH
    from superset.security import SupersetSecurityManager

    ENABLE_PROXY_FIX = True
    AUTH_TYPE = AUTH_OAUTH
    AUTH_USER_REGISTRATION = True
    AUTH_USER_REGISTRATION_ROLE = "Public"
    AUTH_ROLES_MAPPING = {"admin": ["Admin"], "viewer": ["Gamma"]}
    AUTH_ROLES_SYNC_AT_LOGIN = True
    PERMANENT_SESSION_LIFETIME = timedelta(hours=12)
    OAUTH_PROVIDERS = [{
        "name": "zitadel",
        "icon": "fa-key",
        "token_key": "access_token",
        "remote_app": {
            "client_id": os.environ["OIDC_CLIENT_ID"],
            "client_secret": os.environ["OIDC_CLIENT_SECRET"],
            "api_base_url": "https://zitadel.homelab.xiehang.com/",
            "authorize_url": "https://zitadel.homelab.xiehang.com/oauth/v2/authorize",
            "access_token_url": "https://zitadel.homelab.xiehang.com/oauth/v2/token",
            "jwks_uri": "https://zitadel.homelab.xiehang.com/oauth/v2/keys",
            "client_kwargs": {"scope": "openid profile email"},
        },
    }]

    class ZitadelSecurityManager(SupersetSecurityManager):
        def oauth_user_info(self, provider, response=None):
            me = self.oauth_remotes[provider].get("oidc/v1/userinfo").json()
            return {
                "username": me["preferred_username"],
                "email": me.get("email", ""),
                "first_name": me.get("given_name", ""),
                "last_name": me.get("family_name", ""),
                "role_keys": me.get("groups", []),
            }

    CUSTOM_SECURITY_MANAGER = ZitadelSecurityManager

init:
  loadExamples: false
  createAdmin: false
  initscript: |-
    #!/bin/sh
    set -eu
    echo "Upgrading DB schema..."
    superset db upgrade
    echo "Initializing roles..."
    superset init
    if [ -f "{{ .Values.extraConfigMountPath }}/import_datasources.yaml" ]; then
      echo "Importing database connections.... "
      superset import_datasources -p {{ .Values.extraConfigMountPath }}/import_datasources.yaml
    fi

serviceAccount:
  create: true
