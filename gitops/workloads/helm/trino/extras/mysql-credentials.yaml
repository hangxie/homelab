# trino-mysql exposes MYSQL_USER/MYSQL_PASSWORD (read-only user) to the
# mysql catalog via env-substitution in values.yaml. mysql-root is only for
# the bootstrap Job that creates that user.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trino-mysql
  namespace: trino
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: trino-mysql
    creationPolicy: Owner
    template:
      data:
        MYSQL_USER: "{{ .username }}"
        MYSQL_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: mysql/trino
        property: username
    - secretKey: password
      remoteRef:
        key: mysql/trino
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-root
  namespace: trino
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: mysql-root
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: mysql/root
        property: password
