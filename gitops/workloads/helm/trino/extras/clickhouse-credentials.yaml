# trino-clickhouse exposes CLICKHOUSE_USER/CLICKHOUSE_PASSWORD (read-only user)
# to the clickhouse catalog via env-substitution in values.yaml.
# clickhouse-admin is only for the bootstrap Job that creates that user.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trino-clickhouse
  namespace: trino
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: trino-clickhouse
    creationPolicy: Owner
    template:
      data:
        CLICKHOUSE_USER: "{{ .username }}"
        CLICKHOUSE_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: clickhouse/trino
        property: username
    - secretKey: password
      remoteRef:
        key: clickhouse/trino
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-admin
  namespace: trino
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: clickhouse-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: clickhouse/credentials
        property: username
    - secretKey: password
      remoteRef:
        key: clickhouse/credentials
        property: password
