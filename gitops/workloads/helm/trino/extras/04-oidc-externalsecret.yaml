# Zitadel OIDC client for the coordinator's OAuth2 login, as env vars
# (envFrom in values.yaml) for ${ENV:...} substitution.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trino-oidc
  namespace: trino
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: trino-oidc
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: oidc/trino
        property: client-id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: oidc/trino
        property: client-secret
