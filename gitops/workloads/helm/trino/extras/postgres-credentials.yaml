# trino-postgres exposes POSTGRES_USER/POSTGRES_PASSWORD (read-only role) to
# the postgres_* catalogs via env-substitution in values.yaml. postgres-superuser
# is only for the bootstrap Job that creates that role.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trino-postgres
  namespace: trino
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: trino-postgres
    creationPolicy: Owner
    template:
      data:
        POSTGRES_USER: "{{ .username }}"
        POSTGRES_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: postgres-cnpg/trino
        property: username
    - secretKey: password
      remoteRef:
        key: postgres-cnpg/trino
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-superuser
  namespace: trino
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: postgres-superuser
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: postgres-cnpg/superuser
        property: password
