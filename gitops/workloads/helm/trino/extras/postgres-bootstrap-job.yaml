# Read-only role for the postgres_* catalogs: pg_read_all_data covers every
# table in every database, current and future, with no write access.
apiVersion: batch/v1
kind: Job
metadata:
  name: trino-postgres-bootstrap
  namespace: trino
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:18
          env:
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-superuser, key: password } }
            - name: TRINO_USER
              valueFrom: { secretKeyRef: { name: trino-postgres, key: POSTGRES_USER } }
            - name: TRINO_PASSWORD
              valueFrom: { secretKeyRef: { name: trino-postgres, key: POSTGRES_PASSWORD } }
          command: [bash, -ec]
          args:
            - |
              psql -h postgres-cluster-rw.postgres-cluster -U postgres \
                   -v ON_ERROR_STOP=1 \
                   -v TRINO_USER="${TRINO_USER}" \
                   -v TRINO_PASSWORD="${TRINO_PASSWORD}" <<SQL
              SELECT format('CREATE USER %I WITH PASSWORD %L', :'TRINO_USER', :'TRINO_PASSWORD')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname=:'TRINO_USER')\gexec
              ALTER USER :"TRINO_USER" WITH PASSWORD :'TRINO_PASSWORD';
              GRANT pg_read_all_data TO :"TRINO_USER";
              SQL
