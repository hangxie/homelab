envFrom:
  - secretRef:
      name: trino-s3
  - secretRef:
      name: trino-mysql
  - secretRef:
      name: trino-postgres
  - secretRef:
      name: trino-clickhouse

coordinator:
  jvm:
    maxHeapSize: "1500M"
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
  additionalJVMConfig:
    - "-javaagent:/jmx/agent/jmx_prometheus_javaagent.jar=9087:/jmx/config.yaml"
  additionalExposedPorts:
    jmx:
      servicePort: 9087
      name: jmx
      port: 9087
      protocol: TCP
  additionalVolumes:
    - name: jmx-agent
      emptyDir: {}
    - name: jmx-config
      configMap:
        name: trino-jmx-config
  additionalVolumeMounts:
    - name: jmx-agent
      mountPath: /jmx/agent
    - name: jmx-config
      mountPath: /jmx/config.yaml
      subPath: config.yaml

worker:
  replicas: 2
  jvm:
    maxHeapSize: "3G"
  resources:
    requests:
      cpu: 1
      memory: 4Gi
  additionalJVMConfig:
    - "-javaagent:/jmx/agent/jmx_prometheus_javaagent.jar=9087:/jmx/config.yaml"
  additionalExposedPorts:
    jmx:
      servicePort: 9087
      name: jmx
      port: 9087
      protocol: TCP
  additionalVolumes:
    - name: jmx-agent
      emptyDir: {}
    - name: jmx-config
      configMap:
        name: trino-jmx-config
  additionalVolumeMounts:
    - name: jmx-agent
      mountPath: /jmx/agent
    - name: jmx-config
      mountPath: /jmx/config.yaml
      subPath: config.yaml

server:
  workers: 2
  config:
    authenticationType: PASSWORD

additionalConfigProperties:
  - internal-communication.shared-secret=homelab-trino-internal-shared-secret-20260603
  # The gateway (Envoy) fronts every client request and adds X-Forwarded-For.
  # Trino's PASSWORD authenticator refuses to process that header from an
  # untrusted client by default, which made every request through the gateway
  # fail with HTTP 406 — this trusts the gateway as the reverse proxy it is.
  - http-server.process-forwarded=true

auth:
  passwordAuthSecret: trino-credentials

# Catalogs reference Hive metastore (hive-metastore.hive.svc:9083), MySQL,
# ScyllaDB (Cassandra connector, no auth), ClickHouse and Postgres. A Postgres
# catalog is bound to one database, so each app database gets its own,
# read-only via the ro pooler (replicas) and the trino role (pg_read_all_data).
# ClickHouse and MySQL use read-only trino users (SELECT/SHOW grants only).
additionalCatalogs:
  hive: |
    connector.name=hive
    hive.metastore.uri=thrift://hive-metastore.hive.svc:9083
    fs.native-s3.enabled=true
    s3.endpoint=http://rook-ceph-rgw-object-store.rook-ceph.svc/
    s3.region=us-east-1
    s3.path-style-access=true
    s3.aws-access-key=${ENV:ACCESS_KEY_ID}
    s3.aws-secret-key=${ENV:SECRET_ACCESS_KEY}
  mysql: |
    connector.name=mysql
    connection-url=jdbc:mysql://mysql-cluster.mysql.svc:3306
    connection-user=${ENV:MYSQL_USER}
    connection-password=${ENV:MYSQL_PASSWORD}
  scylladb: |
    connector.name=cassandra
    cassandra.contact-points=scylladb-client.scylladb.svc.cluster.local
    cassandra.load-policy.dc-aware.local-dc=dc1
  clickhouse: |
    connector.name=clickhouse
    connection-url=jdbc:clickhouse://clickhouse.clickhouse.svc:8123/
    connection-user=${ENV:CLICKHOUSE_USER}
    connection-password=${ENV:CLICKHOUSE_PASSWORD}
    # Otherwise ClickHouse String columns come back as varbinary.
    clickhouse.map-string-as-varchar=true
  postgres_airflow: |
    connector.name=postgresql
    connection-url=jdbc:postgresql://postgres-cluster-pooler-ro.postgres-cluster.svc:5432/airflow
    connection-user=${ENV:POSTGRES_USER}
    connection-password=${ENV:POSTGRES_PASSWORD}
  postgres_grafana: |
    connector.name=postgresql
    connection-url=jdbc:postgresql://postgres-cluster-pooler-ro.postgres-cluster.svc:5432/grafana
    connection-user=${ENV:POSTGRES_USER}
    connection-password=${ENV:POSTGRES_PASSWORD}
  postgres_hive: |
    connector.name=postgresql
    connection-url=jdbc:postgresql://postgres-cluster-pooler-ro.postgres-cluster.svc:5432/hive
    connection-user=${ENV:POSTGRES_USER}
    connection-password=${ENV:POSTGRES_PASSWORD}
  postgres_jupyterhub: |
    connector.name=postgresql
    connection-url=jdbc:postgresql://postgres-cluster-pooler-ro.postgres-cluster.svc:5432/jupyterhub
    connection-user=${ENV:POSTGRES_USER}
    connection-password=${ENV:POSTGRES_PASSWORD}
  postgres_openwebui: |
    connector.name=postgresql
    connection-url=jdbc:postgresql://postgres-cluster-pooler-ro.postgres-cluster.svc:5432/openwebui
    connection-user=${ENV:POSTGRES_USER}
    connection-password=${ENV:POSTGRES_PASSWORD}
  postgres_superset: |
    connector.name=postgresql
    connection-url=jdbc:postgresql://postgres-cluster-pooler-ro.postgres-cluster.svc:5432/superset
    connection-user=${ENV:POSTGRES_USER}
    connection-password=${ENV:POSTGRES_PASSWORD}

# JMX exporter agent — copies the JAR to a shared emptyDir before Trino
# starts. Jar comes from Harbor; see scripts/seed-jars.sh.
initContainers:
  coordinator:
    - name: jmx-exporter-init
      image: ghcr.io/oras-project/oras:v1.2.2
      command: ["/bin/oras", "pull", "--output", "/jmx/agent", "media.xiehang.com/jars/jmx-prometheus-javaagent:1.6.0"]
      volumeMounts:
        - name: jmx-agent
          mountPath: /jmx/agent
  worker:
    - name: jmx-exporter-init
      image: ghcr.io/oras-project/oras:v1.2.2
      command: ["/bin/oras", "pull", "--output", "/jmx/agent", "media.xiehang.com/jars/jmx-prometheus-javaagent:1.6.0"]
      volumeMounts:
        - name: jmx-agent
          mountPath: /jmx/agent
